<script type="module">
const standalone=location.protocol==='file:';
const $=s=>document.querySelector(s);
const SLOTS=[
 {key:'head',label:'Head',icon:'♜',row:1,col:2,stat:'defense'},
 {key:'cape',label:'Cape',icon:'⚑',row:2,col:1,stat:'health'},
 {key:'neck',label:'Neck',icon:'◇',row:2,col:2,stat:'attack'},
 {key:'weapon',label:'Weapon',icon:'⚔',row:3,col:1,stat:'attack'},
 {key:'body',label:'Body',icon:'▣',row:3,col:2,stat:'defense'},
 {key:'shield',label:'Shield',icon:'◈',row:3,col:3,stat:'defense'},
 {key:'legs',label:'Legs',icon:'Ⅱ',row:4,col:2,stat:'defense'},
 {key:'hands',label:'Hands',icon:'✥',row:5,col:1,stat:'attack'},
 {key:'feet',label:'Feet',icon:'♟',row:5,col:2,stat:'health'},
 {key:'ring',label:'Ring',icon:'○',row:5,col:3,stat:'attack'}
];
const MATERIALS={iron:{name:'Iron fragments',icon:'◆'},rivets:{name:'Binding rivets',icon:'✣'},leather:{name:'Worn leather',icon:'▧'},essence:{name:'Grave essence',icon:'✧'}};
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let resetting=false,syncPromise=Promise.resolve();const openPanels={};
let estimating=false;const riskCache=new Map();
let selectedSlot='weapon';
function migrate(state){
 state.gear??={};state.gearUpgrades??={};
 if(state.gear.armor!==undefined){state.gear.body=state.gear.armor;state.gearUpgrades.body=state.gearUpgrades.armor||0;delete state.gear.armor;delete state.gearUpgrades.armor;}
 for(const slot of SLOTS){state.gear[slot.key]??=-1;state.gearUpgrades[slot.key]??=0;}
 state.equipmentBag??=[];state.lastExpedition??=null;state.items??={};for(const k of Object.keys(MATERIALS))state.items[k]??=0;
 return state;
}
function storageCost(k){const level=s.buildings[k+'Storage']||0;return {wood:35+level*40,stone:25+level*30};}
function canAfford(c){return Object.entries(c).every(([k,v])=>s[k]>=v);}
function gearItem(k,tier=s.gear[k],upgrade=s.gearUpgrades[k]||0){
 const slot=SLOTS.find(x=>x.key===k);if(!slot||tier<0)return null;
 const prefix=tier===0?'Worn':tier===1?'Iron':tier===2?'Gravewarden':tier===3?'Duskforged':'Ancient '+tier;
 const noun={head:'helm',cape:'cloak',neck:'pendant',weapon:'blade',body:'cuirass',shield:'shield',legs:'greaves',hands:'gloves',feet:'boots',ring:'signet'}[k];
 const value=slot.stat==='health'?2+tier*7+upgrade*2:slot.stat==='attack'?(k==='weapon'?3+tier*6:1+tier*2)+upgrade*2:1+tier*2+upgrade;
 const stats={[slot.stat]:value};
 if(tier>0&&k==='ring')stats.crit=tier*.02;
 if(tier>0&&k==='cape')stats.evade=tier*.015;
 if(tier>0&&k==='neck')stats.leech=tier*.015;
 return {name:prefix+' '+noun,tier,upgrade,stats};
}
function heroStats(){
 const total={attack:9,defense:0,health:75,crit:.05,evade:0,leech:0};
 for(const slot of SLOTS){const item=gearItem(slot.key);if(item)for(const[k,v]of Object.entries(item.stats))total[k]+=v;}
 total.crit=Math.min(.5,total.crit);total.evade=Math.min(.35,total.evade);total.leech=Math.min(.25,total.leech);return total;
}
function statText(stats){return Object.entries(stats).map(([k,v])=>`${['crit','evade','leech'].includes(k)?Math.round(v*100)+'%':v} ${k==='health'?'HP':k==='leech'?'life steal':k}`).join(' · ');}
function forgeCost(k){const n=Math.max(0,s.gear[k]);return {iron:18+n*8,rivets:12+n*6,gold:600+n*400,...(['cape','hands','feet'].includes(k)?{leather:10+n*5}:{}),...(['ring','neck'].includes(k)?{essence:6+n*3}: {})};}
function upgradeCost(k){const n=s.gearUpgrades[k]||0,t=Math.max(0,s.gear[k]);return {gold:150+t*50+n*100+n*n*25,iron:8+t*2+n*4};}
function canCraft(k){const c=forgeCost(k);return s.gear[k]>=0&&s.blueprints>0&&Object.entries(c).every(([key,v])=>(key==='gold'?s.gold:s.items[key])>=v);}
function recruitCost(){const n=s.recruits.length;return {wood:500+n*300,stone:400+n*250,food:450+n*250};}
function equipItem(index){const item=s.equipmentBag[index];if(!item||battle)return false;const old=gearItem(item.slot);s.equipmentBag.splice(index,1);if(old)s.equipmentBag.push({slot:item.slot,tier:old.tier,upgrade:old.upgrade});s.gear[item.slot]=item.tier;s.gearUpgrades[item.slot]=item.upgrade||0;selectedSlot=item.slot;riskCache.clear();log('Equipped '+gearItem(item.slot).name+'.');return true;}
function equipmentList(items,equip=false){return items.length?items.map((item,i)=>{const info=gearItem(item.slot,item.tier,item.upgrade||0),slot=SLOTS.find(x=>x.key===item.slot);return `<div class="equipment-find"><span>${slot.icon}</span><div><strong>${info.name}</strong><small>${slot.label} · ${statText(info.stats)}</small></div>${equip?btn('Equip','equip:'+i,!!battle):'<span class="badge">RARE FIND</span>'}</div>`}).join(''):'<p class="muted">No equipment found yet. Every fifth cleared wave offers a small chance.</p>';}
function inventory(open=true){
 const dialog=$('#inventory');if(!dialog)return;
 const held=Object.entries(s.items).filter(([k,v])=>v>0||MATERIALS[k]);
 dialog.innerHTML=`<div class="row"><div><div class="eyebrow">Secured supplies</div><h2>Inventory</h2></div>${btn('Close','close')}</div><p class="muted">Only loot brought home is stored here. Farm resources stay in the top bar.</p><div class="inventory-grid">${held.map(([k,v])=>`<div class="inventory-item"><span class="icon">${MATERIALS[k]?.icon||'◇'}</span><strong>${Math.floor(v)}</strong><span>${escapeHtml(MATERIALS[k]?.name||k)}</span></div>`).join('')}<div class="inventory-item"><span class="icon">▤</span><strong>${s.blueprints}</strong><span>Consumable blueprints</span></div></div><p class="muted">Blueprints and materials drop separately. Use blueprints and materials to improve equipment you have already found.</p><h3>Equipment</h3>${equipmentList(s.equipmentBag,true)}${battle?'<div class="notice">Current dungeon rewards are unsecured. See the spoils tracker in your expedition.</div>':''}`;
 if(open&&!dialog.open)dialog.showModal();
}
const initial=()=>migrate({wood:0,stone:0,food:0,gold:0,buildings:{},workers:{},recruits:[],gear:{},gearUpgrades:{},items:{iron:0,rivets:0,leather:0,essence:0},blueprints:0,seen:[],last:Date.now(),gather:null,heroDead:false,recover:0,debt:0,interest:0,expeditions:0,loanRuns:0,log:['Your story begins at the edge of the woods.'],choices:null});
let s=migrate(JSON.parse(localStorage.getItem('gravehold')||'null')||initial()),tab='Settlement',email=null,battle=s.activeBattle||null;if(battle)tab='Expeditions';
const topics={Settlement:['A foothold in the dark','Gather wood, stone and food by starting a short task, then collect it. Build your first production site to unlock dungeons. Hire workers to automate production; workers level as they work. Storage can be upgraded; each level costs more. Build a site, then use its highlighted Hire worker panel to automate gathering. Offline production is 50% of normal and stops when storage fills.'],Expeditions:['Beyond the gates','Choose one of three newly generated dungeons. The risk meter simulates your current team against all 15 waves to estimate a clear chance. Random attacks and critical hits mean it is a forecast, not a guarantee. Combat is automatic. Extract after waves 5 and 10 to secure your loot, or continue to the final boss. Defeat forfeits this run’s rewards.'],Loadout:['Found, then reforged','Start with empty equipment slots. Cleared waves 5, 10, and 15 have a slim equipment-drop chance. Extract to keep a find, then equip it in Inventory. Blueprints and materials are rare, separate drops. Forging consumes a blueprint and upgrades an existing item; it cannot fill an empty slot. Upgrade equipment with substantial gold and iron costs that grow with item tier and upgrade level. Craft the next tier using your current equipment, a new blueprint, and ingredients. Owned equipment survives defeat. Select one of ten equipment slots (no arrow slot). Bonuses such as critical chance, evasion, and life steal affect real combat. Inventory in the top bar tracks all secured materials.'],Recruits:['No one walks alone','Develop your workers and expand storage before saving up to hire warriors, archers, or healers. Their resource costs are high and rise with each recruit. They are small supporting troops: they act every other turn and contribute less damage and healing than the hero. Warriors give the hero a small defense bonus. They level slowly through expeditions. Fallen recruits remain unavailable until revived with gold and food.'],Treasury:['A costly second chance','Revive your hero with gold and food, or borrow the missing cost. Only one loan can be outstanding. Every five completed expeditions adds 1% interest on remaining principal. Repay manually; payments cover interest first. While indebted, free hero recovery takes five minutes.']};
function log(t){s.log.unshift(t);s.log=s.log.slice(0,8)}
function save(){
 if(resetting)return;s.activeBattle=battle;s.last=Date.now();localStorage.setItem('gravehold',JSON.stringify(s));
 if(email){const body=JSON.stringify({state:s});syncPromise=syncPromise.catch(()=>{}).then(()=>fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body})).catch(()=>{});}
}
function cap(k){return 100+(s.buildings[k+'Storage']||0)*150}
function accrue(){const now=Date.now(),seconds=(now-s.last)/1000;for(const [k,w]of Object.entries(s.workers)){const amount=seconds*(seconds>5?.5:1)*(1+Math.floor(w.xp/300)*.2);s[k]=Math.min(cap(k),s[k]+amount);w.xp+=seconds} s.last=now;if(s.heroDead&&s.recover&&now>=s.recover){s.heroDead=false;s.recover=0;log('Your hero has recovered.')}}
function pay(cost){if(Object.entries(cost).some(([k,v])=>s[k]<v))return false;for(const[k,v]of Object.entries(cost))s[k]-=v;return true}
function costText(c){return Object.entries(c).map(([k,v])=>`${v} ${k}`).join(' · ')}
function btn(label,action,disabled=false){return `<button data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
const scene=`<svg viewBox="0 0 1000 240" preserveAspectRatio="xMidYMid slice"><defs><pattern id="rain" width="60" height="50" patternUnits="userSpaceOnUse"><path d="M10 0l-4 12" stroke="#577165" opacity=".2"/></pattern></defs><circle cx="750" cy="47" r="26" fill="#a8b299" opacity=".5"/><path d="M0 155L90 65l70 90L240 45l115 130L450 70l95 100L660 35l100 140L880 55l120 105V240H0" fill="#192d28"/><path d="M0 175L100 100l75 85L300 100l90 80L560 95l120 95L850 110l150 65V240H0" fill="#11201c"/><path d="M400 190V130h110v60M382 130l74-65 74 65" fill="#594d39" stroke="#242a20" stroke-width="8"/><path d="M447 190v-44h22v44" fill="#151c17"/><path d="M415 140h15v20h-15m69-20h15v20h-15" fill="#d5ae60"/><path d="M535 187h75v-42h-75m-8 0l46-37 45 37" fill="#3c4431" stroke="#20271e" stroke-width="6"/><path d="M0 207Q200 170 350 212T700 205T1000 190V240H0" fill="#35412a"/><path d="M430 240l19-50h20l39 50" fill="#706345"/><path d="M100 218v-100m-40 65l40-80 40 80m-31 35V95" stroke="#17231b" stroke-width="14" fill="#243a29"/><rect width="1000" height="240" fill="url(#rain)"/></svg>`;
function settlement(){return `<div class="banner">${scene}<div class="banner-label"><div class="eyebrow">Your sanctuary</div><h2 style="margin:3px 0">A light against the dark</h2></div></div><div class="grid">${['wood','stone','food'].map((k,i)=>{
 const built=s.buildings[k],w=s.workers[k],cost={wood:20,stone:10},profession=['woodcutter','miner','farmer'][i],storage=storageCost(k);
 return `<section class="card"><div class="row"><span class="icon">${['♧','◆','❧'][i]}</span><span class="badge">${built?'BUILT':'UNBUILT'}</span></div><h3>${['Woodcutting camp','Stone quarry','Homestead'][i]}</h3><p>${w?`Worker level ${1+Math.floor(w.xp/300)} · ${(1+Math.floor(w.xp/300)*.2).toFixed(1)}/sec`:'Gather by hand to establish your first production site.'}</p><div class="bar"><span style="width:${s[k]/cap(k)*100}%"></span></div><div class="muted">${Math.floor(s[k])} / ${cap(k)} stored</div>
 ${s.gather?.kind===k?btn(Date.now()>=s.gather.end?'Collect +12':`Gathering… ${Math.ceil((s.gather.end-Date.now())/1000)}s`,'collect',Date.now()<s.gather.end):btn('Gather '+k,'gather:'+k,!!s.gather)}
 ${!built?`<div class="hiring"><strong>1. Build your production site</strong><p>${costText(cost)}</p>${btn('Build site →','build:'+k,!canAfford(cost))}<small>Building unlocks a ${profession} position.</small></div>`:!w?`<div class="hiring"><span class="badge">VACANT POSITION · 0 / 1</span><h3>Hire a ${profession}</h3><p>Automatically gathers ${k}, even while you are away.<br>Cost: 20 wood · 15 food</p>${btn('Hire '+profession+' →','worker:'+k,!canAfford({wood:20,food:15}))}<small>${canAfford({wood:20,food:15})?'Ready to hire':'Gather more wood and food to hire.'}</small></div>`:`<div class="hiring"><span class="badge">${profession.toUpperCase()} EMPLOYED · 1 / 1</span><p>Your worker is gathering ${k}.</p>${btn('Train · '+(30+Math.floor(w.xp/300)*15)+' '+k,'train:'+k)}</div>`}
 <div class="storage-info"><span class="muted">Storage level ${s.buildings[k+'Storage']||0} → ${(s.buildings[k+'Storage']||0)+1}</span><p>+150 capacity · ${costText(storage)}</p>${btn('Upgrade storage','storage:'+k,!canAfford(storage))}</div></section>`;
 }).join('')}</div>`;}
function choices(){if(!s.choices)s.choices=[0,1,2].map((d)=>({d,name:[['Hollow Crypt','Ashen Chapel','Forgotten Tomb'],['Bleak Catacombs','Widow’s Keep','Sunken Abbey'],['Blood Cathedral','Throne of Cinders','The Black Ossuary']][d][Math.floor(Math.random()*3)],mod:.9+Math.random()*.2}));}
function power(){const h=heroStats();return h.attack*2+h.defense*2+h.health/5+s.recruits.filter(r=>!r.dead).reduce((a,r)=>a+3+Math.floor(r.level/4),0);}
function chance(d,mod=1){
 const key=JSON.stringify([heroStats(),s.recruits.map(r=>[r.cls,r.level,r.dead]),d,mod]);if(riskCache.has(key))return riskCache.get(key);
 const originalState=s,originalBattle=battle;let wins=0;
 try{estimating=true;for(let run=0;run<24;run++){
  s=JSON.parse(JSON.stringify(originalState));startBattle({d,mod,name:'Forecast'});
  for(let beat=0;beat<750&&!battle.result;beat++){
   if(battle.checkpoint)continueBattle();tickBattle();
  }
  if(battle.result==='win')wins++;
 }}finally{s=originalState;battle=originalBattle;estimating=false;}
 const result=Math.round(wins/24*100/5)*5;if(riskCache.size>40)riskCache.clear();riskCache.set(key,result);return result;
}

function expeditions(){if(!Object.keys(s.buildings).some(k=>['wood','stone','food'].includes(k)))return `<div class="notice">Build your first settlement production building to unlock the dungeon gates.</div>${settlement()}`;if(battle)return arena();choices();return `${expeditionResult()}<div class="banner">${scene}<div class="banner-label"><div class="eyebrow">Beyond the safe walls</div><h2>Choose your descent</h2></div></div><div class="grid">${s.choices.map(c=>`<section class="card"><span class="badge">${['EASY','MEDIUM','HARD'][c.d]} · 15 WAVES</span><h3>${c.name}</h3><p>${['Restless bones haunt the shallow chambers.','Armored horrors wait beneath the ruined halls.','Only the prepared return from this darkness.'][c.d]}</p><div class="row"><span>Full dungeon clear chance</span><strong class="gold">${chance(c.d,c.mod)}%</strong></div><div class="bar"><span style="width:${chance(c.d,c.mod)}%"></span></div><p>Reward multiplier ×${c.d+1}<br>Extracting at an early checkpoint can be safer.<br>${power()<50?'Concern: limited gear and support.':'Includes your gear, living recruits, and enemy strength.'}</p>${btn('Enter dungeon →','enter:'+c.d,s.heroDead)}</section>`).join('')}</div>${s.heroDead?'<div class="notice">Your hero needs revival. Visit the treasury.</div>':''}`}
function sprite(kind){
 const palettes={hero:['#b6bcc1','#b89d65'],Warrior:['#7b8e9b','#c3c6b4'],Archer:['#688463','#b8a182'],Healer:['#d5d0ad','#91bda1'],enemy:['#756774','#dccea8'],enemyArcher:['#786254','#dccea8'],boss:['#6e4662','#dc9a68']};const [armor,skin]=kind==='hero'&&s.gear.body<0?['#71674e','#b89d65']:palettes[kind]||palettes.hero;
 const tool=kind==='hero'&&s.gear.weapon<0?'':(kind==='Archer'||kind==='enemyArcher')?'<path d="M2 7l-2 4 2 5h1l-2-5 2-4m-1 0v9" fill="#b29b67"/><path d="M0 11h5v1H0" fill="#d9d5b9"/>':kind==='Healer'?'<path d="M1 5h1v13H1" fill="#987c53"/><path d="M0 4h3v3H0" fill="#ade0b8"/>':'<path d="M1 7h1v9H1m-1-4h4v1H0" fill="#d9d5b9"/>';
 const shield=kind==='Warrior'?'<path d="M12 10h4v5l-2 2-2-2z" fill="#989f9a"/>':'';
 const crown=kind==='boss'?'<path d="M5 0h1v2h1V0h2v2h1V0h2v4H5" fill="#d1b67b"/>':'';
 return `<svg width="64" height="88" viewBox="0 0 16 22" shape-rendering="crispEdges"><path d="M6 1h5v2H5v5h7V3h-1" fill="${kind==='hero'&&s.gear.head<0?'#443d32':armor}"/><path d="M6 4h5v4H6z" fill="${skin}"/><path d="M7 5h1v1H7m3-1h1v1h-1" fill="#1b1c24"/><path d="M5 8h8v8H5zM3 9h2v6H3m10-6h2v6h-2M5 16h3v5H4v-2h1m5-3h3v5H9v-2h1" fill="${armor}"/><path d="M6 9h1v6H6m-1 0h8v2H5" fill="${skin}"/>${tool}${shield}${crown}</svg>`;
}

function unitCard(u,enemy=false){
 const event=u.event,dead=u.hp<=0,active=event&&event.beat===battle.beat&&battle.phase==='combat'&&!battle.checkpoint&&u.hp>0,hero=u.role==='Hero',support=!enemy&&!hero;
 return `<div class="combat-unit ${hero?'hero-unit':support?'support-unit':'hostile'} ${dead?'fallen':''}" data-unit="${u.id}" data-hp="${u.hp}" title="${escapeHtml(u.name)}: ${Math.ceil(u.hp)}/${u.maxHp} HP · ${u.attack} attack · ${u.defense} defense"><div class="unit-label">${hero?'YOUR HERO':escapeHtml(support?u.role:u.name)}</div><div class="unit-sprite ${active&&event.kind==='attack'?'attacking':''} ${active&&event.kind==='damage'?'struck':''}">${sprite(u.kind)}${active?`<span class="combat-number ${event.kind}">${escapeHtml(event.text)}</span>`:''}</div><div class="unit-hp"><span style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></span></div><strong>${Math.ceil(Math.max(0,u.hp))} / ${u.maxHp}${hero?' HP':''}</strong>${dead?'<small>Fallen</small>':''}</div>`;
}
function lootSummary(loot){return [['gold','Gold'],['wood','Wood'],['stone','Stone'],['food','Food'],...Object.entries(MATERIALS).map(([k,v])=>[k,v.name]),['blueprints','Blueprints']].map(([k,label])=>`<span>${label} <strong>${loot[k]||0}</strong></span>`).join('');}
function spoilsPanel(loot,secured){const finds=loot.equipment||[];return `<section class="spoils-visible ${secured?'secured':''}"><div class="row"><div><span class="eyebrow">${secured?'Brought home':'At risk until extraction'}</span><h3>${secured?'Expedition rewards':'Dungeon spoils'}</h3></div><strong class="spoils-gold">◈ ${loot.gold||0}<small>GOLD</small></strong></div><div class="spoils-counts">${[...Object.entries(MATERIALS).map(([k,v])=>[k,v.name]),['blueprints','Blueprints']].map(([k,name])=>`<span>${name}<strong>${loot[k]||0}</strong></span>`).join('')}</div>${finds.length?`<div class="rare-loot"><span class="badge">${finds.length} RARE EQUIPMENT ${secured?'SECURED':'FOUND'}</span>${equipmentList(finds)}</div>`:''}<details data-panel="farm-spoils"><summary>Farm supplies</summary><div class="loot-grid">${['wood','stone','food'].map(k=>`<span>${k}<strong>${loot[k]||0}</strong></span>`).join('')}</div></details></section>`;}
function expeditionResult(){if(!s.lastExpedition)return '';const r=s.lastExpedition;return r.won?`<div class="last-result">${spoilsPanel(r.loot,true)}${(r.loot.equipment||[]).length?btn('Equip your finds →','inventory'):''}</div>`:`<div class="notice">Your last expedition ended at wave ${r.wave}. Unsecured loot was lost.</div>`;}
function arena(){ensureBattle();const remaining=battle.enemies.filter(u=>u.hp>0).length;
 return `<section class="battle-shell"><div class="battle-heading"><div><div class="eyebrow">${['Easy','Medium','Hard'][battle.d]} expedition</div><h2>${escapeHtml(battle.name)}</h2></div><div class="battle-stage"><strong>Wave ${battle.wave}<span> / 15</span></strong><small>${battle.checkpoint?'Checkpoint':battle.phase==='between'?'Wave cleared':remaining+' enemies remaining'}</small></div></div>
 <div class="wave-track" aria-label="Wave ${battle.wave} of 15">${Array.from({length:15},(_,i)=>`<i class="${i+1<battle.wave?'cleared':i+1===battle.wave?'current':''} ${(i+1)%5===0?'checkpoint-mark':''}"></i>`).join('')}</div>
 <div class="arena battle-scene"><div class="battle-side hero-side"><div class="support-line">${battle.allies.slice(1).map(u=>unitCard(u)).join('')}</div>${unitCard(battle.allies[0])}</div><div class="battle-side enemies">${battle.enemies.map(u=>unitCard(u,true)).join('')}</div></div>
 <div class="combat-caption" aria-live="polite">${escapeHtml(battle.events[0]||'Your hero leads the expedition.')}</div>
 ${battle.checkpoint?`<div class="checkpoint-actions"><span>Rest or retreat? <small>Continuing restores 20% HP to survivors.</small></span><div>${btn('Extract loot','extract')}${btn('Continue →','continue')}</div></div>`:''}
 ${spoilsPanel(battle.loot,false)}<div class="battle-bottom"><details class="combat-log" data-panel="combat-log"><summary>Battle log</summary><div class="battle-events">${battle.events.slice(0,8).map(x=>`<div>${escapeHtml(x)}</div>`).join('')}</div></details></div></section>`;
}
function loadout(){const h=heroStats(),item=gearItem(selectedSlot),slot=SLOTS.find(x=>x.key===selectedSlot),cost=forgeCost(selectedSlot),upgrade=upgradeCost(selectedSlot),next=Math.max(1,s.gear[selectedSlot]+1);
 return `<div class="loadout-layout"><section class="card equipment"><div class="row"><h3>Equipment</h3><span class="badge">${SLOTS.filter(x=>s.gear[x.key]>=0).length} / 10</span></div><div class="equipment-grid">${SLOTS.map(x=>{const it=gearItem(x.key);return `<button class="equipment-slot ${selectedSlot===x.key?'selected':''} ${it?'':'empty'}" style="grid-row:${x.row};grid-column:${x.col}" data-action="slot:${x.key}" aria-label="${x.label} slot: ${it?it.name:'empty'}" title="${it?it.name:'Empty '+x.label}"><span>${x.icon}</span><strong>${x.label}</strong></button>`}).join('')}</div>
 <div class="hero-stats"><span>Attack <strong>${h.attack}</strong></span><span>Defense <strong>${h.defense}</strong></span><span>HP <strong>${h.health}</strong></span><details class="loadout-bonuses" data-panel="bonuses"><summary>Combat bonuses</summary><div class="secondary-stats"><span>Critical <strong>${Math.round(h.crit*100)}%</strong></span><span>Evasion <strong>${Math.round(h.evade*100)}%</strong></span><span>Life steal <strong>${Math.round(h.leech*100)}%</strong></span></div></details></div></section>
 <section class="card item-detail"><div class="eyebrow">${slot.label} slot</div><div class="selected-item"><div class="icon">${slot.icon}</div><div><h2>${item?item.name:'Empty slot'}</h2><span class="badge">${item?'TIER '+item.tier+(item.upgrade?' · +'+item.upgrade:''):'UNEQUIPPED'}</span></div></div><p class="item-stats">${item?statText(item.stats):'Find equipment at a five-wave milestone, then equip it from Inventory.'}</p>
 <div class="item-actions">${item?`<div>${btn('Upgrade item','upgrade:'+selectedSlot,s.gold<upgrade.gold||s.items.iron<upgrade.iron)}<small>${costText(upgrade)}</small></div>`:''}${item?`<div>${btn('Forge tier '+next+' →','craft:'+selectedSlot,!canCraft(selectedSlot))}<small>1 blueprint · ${cost.gold} gold + rare materials</small></div>`:''}</div>
 ${item?`<details class="recipe" data-panel="recipe:${selectedSlot}"><summary>Recipe & next-tier stats</summary><p>${costText(cost)} · 1 blueprint</p><p class="gold">${statText(gearItem(selectedSlot,next,0).stats)}</p><small class="muted">${item?'Replaces this item. Upgrades reset when forging.':'Creates and equips this piece.'}</small></details>`:btn('Open inventory','inventory')}<p class="slot-hint">Choose another slot to inspect it.<br>Materials are stored in your inventory.</p></section></div>`;
}
function recruits(){return `<div class="grid">${['Warrior','Archer','Healer'].map((cls,i)=>{const n=s.recruits.length,c=recruitCost();return `<div class="card"><div class="icon">${['⚒','➶','✚'][i]}</div><h3>${cls}</h3><p>${['Helps guard your hero, adding a small defense bonus.','Fires supporting shots every other combat turn.','Provides small, occasional heals to wounded allies.'][i]}</p>${btn('Hire · '+costText(c),'recruit:'+cls,n>=3||!canAfford(c))}<p class="muted">${Object.entries(c).some(([k,v])=>cap(k)<v)?'Expand your resource storage before hiring.':'An established settlement is needed to support a recruit.'}</p></div>`}).join('')}</div><h2>Your expedition · ${s.recruits.length}/3</h2><div class="grid">${s.recruits.map((r,i)=>`<div class="card"><h3>${r.cls}</h3><p>Level ${r.level} · ${r.xp}/20 experience<br>${r.dead?'Fallen — awaiting revival':'Ready for expedition'}</p>${r.dead?btn('Revive · 15 gold / 10 food','revive:'+i):'<span class="badge">LOYAL COMPANION</span>'}</div>`).join('')}</div>`}
function treasury(){return `<div class="grid"><div class="card"><h3>Hero recovery</h3><p>${s.heroDead?'Your hero fell in the dungeon.':'Your hero is ready to descend.'}</p>${btn('Revive · 25 gold / 15 food','hero',!s.heroDead)}${btn('Emergency revival loan','loan',!s.heroDead||s.debt+s.interest>0)}${s.heroDead&&s.debt+s.interest>0?btn(s.recover?'Recovering · '+Math.max(0,Math.ceil((s.recover-Date.now())/1000))+'s':'Begin free recovery · 5 min','recover',!!s.recover):''}</div><div class="card"><h3>Outstanding loan</h3><p>Principal: ${s.debt.toFixed(2)} gold<br>Interest: ${s.interest.toFixed(2)} gold<br>Expeditions until interest: ${5-s.loanRuns}</p><p>1% of principal every five completed expeditions. No offline interest. Further borrowing is blocked until paid.</p>${btn('Repay up to 10 gold','repay',s.debt+s.interest<=0||s.gold<=0)}</div></div>`}
function render(){for(const d of document.querySelectorAll('#app details[data-panel]'))openPanels[d.dataset.panel]=d.open;accrue();$('#app').innerHTML=`<div class="layout"><aside><div class="brand">✧ GRAVEHOLD</div><div class="subtitle">FROM ASHES, A KINGDOM</div><nav>${['Settlement','Expeditions','Loadout','Recruits','Treasury'].map((t,i)=>`<button data-tab="${t}" class="${tab===t?'active':''}">${['♧','⚔','▣','♙','◈'][i]} &nbsp; ${t}</button>`).join('')}</nav><div class="muted" style="margin-top:50px">The darkness waits.<br>Build something that lasts.</div></aside><main><div class="top"><div class="resources">${['wood','stone','food','gold'].map((k,i)=>`<div class="resource">${['♧','◆','❧','◈'][i]} ${Math.floor(s[k])}<small>${k.toUpperCase()}</small></div>`).join('')}</div><div>${btn('Inventory','inventory')} ${btn('Journal','journal')} ${btn(email?'Account':'Sign in','account')}</div></div><div class="intro"><div><div class="eyebrow">Chapter I · A fragile beginning</div><h1>${tab==='Settlement'?'Your settlement':tab}</h1><span class="muted">${tab==='Settlement'?'Raise a sanctuary. Prepare for what lies below.':topics[tab][0]}</span></div></div>${({Settlement:settlement,Expeditions:expeditions,Loadout:loadout,Recruits:recruits,Treasury:treasury})[tab]()}<div class="feed">${s.log.slice(0,3).map(t=>`<p>✦ ${t}</p>`).join('')}</div><footer>${email?'ACCOUNT SAVE ENABLED':'GUEST PROGRESS · SAVED ON THIS BROWSER'} · GRAVEHOLD ${btn('Save settings','settings')}</footer></main></div>`;for(const d of document.querySelectorAll('#app details[data-panel]'))d.open=!!openPanels[d.dataset.panel];if($('#inventory')?.open)inventory(false);}
function journal(topic=tab){const d=$('#journal');d.innerHTML=`<div class="eyebrow">The survivor’s journal</div><h2>${topics[topic][0]}</h2><p class="muted">${topics[topic][1]}</p><div>${Object.keys(topics).map(t=>`<button data-topic="${t}">${t}</button>`).join(' ')}</div><p>${btn('Understood','close')}</p>`;if(!d.open)d.showModal();if(!s.seen.includes(topic)){s.seen.push(topic);save()}}

function finish(win){
 if(estimating){battle.result=win?'win':'loss';return;}
 s.lastExpedition={won:win,wave:battle.wave||0,loot:JSON.parse(JSON.stringify(battle.loot))};
 if(win){s.equipmentBag.push(...(battle.loot.equipment||[]));for(const k of ['gold','wood','stone','food'])s[k]=k==='gold'?s[k]+(battle.loot[k]||0):Math.min(cap(k),s[k]+(battle.loot[k]||0));
 for(const k of Object.keys(MATERIALS))s.items[k]+=(battle.loot[k]||0);s.blueprints+=battle.loot.blueprints||0;log('Returned safely with '+battle.loot.gold+' gold and crafting supplies.');
 }else{s.heroDead=true;log('The hero fell. Unsecured rewards were lost.');}
 s.expeditions++;if(s.debt>0&&++s.loanRuns>=5){s.interest+=s.debt*.01;s.loanRuns=0;}
 for(const r of s.recruits)if(!r.dead){r.xp++;if(r.xp>=20){r.level++;r.xp=0;}}
 battle=null;s.choices=null;save();render();
}
function recruitUnit(r,i){const level=r.level||1,warrior=r.cls==='Warrior',archer=r.cls==='Archer';const hp=(warrior?23:archer?17:19)+level*2;return {id:'recruit-'+i,name:r.cls+' '+(i+1),kind:r.cls,role:r.cls,index:i,maxHp:hp,hp:r.dead?0:hp,attack:(archer?3:warrior?2:1)+Math.floor(level/4),defense:warrior?2:0,crit:archer?.06:.02,evade:0,leech:0};}
function startBattle(c){const h=heroStats();battle={balance:2,...c,wave:1,beat:0,checkpoint:false,phase:'combat',events:['The expedition enters the dungeon.'],loot:{gold:0,wood:0,stone:0,food:0,iron:0,rivets:0,leather:0,essence:0,blueprints:0,equipment:[]},allies:[{id:'hero',name:'Your hero',kind:'hero',role:'Hero',hp:h.health,maxHp:h.health,attack:h.attack,defense:h.defense,crit:h.crit,evade:h.evade,leech:h.leech},...s.recruits.map(recruitUnit)],enemies:[]};spawnWave();}
function ensureBattle(){
 if(battle)battle.loot.equipment??=[];
 if(battle?.allies&&battle.balance!==2){for(const u of battle.allies.slice(1)){const hpRatio=u.hp/u.maxHp,next=recruitUnit(s.recruits[u.index],u.index);Object.assign(u,next,{hp:Math.round(next.maxHp*hpRatio)});}battle.balance=2;}
 if(battle&&!battle.allies){const old=battle,c={d:old.d,name:old.name,mod:old.mod};startBattle(c);battle.wave=old.wave||1;battle.loot={...battle.loot,...old.loot};battle.checkpoint=old.checkpoint||false;battle.allies[0].hp=Math.max(1,Math.round(battle.allies[0].maxHp*(old.hp||100)/100));spawnWave();}
}
function battleEvent(t){battle.events.unshift(t);battle.events=battle.events.slice(0,12);}
function spawnWave(){
 const d=battle.d,w=battle.wave,m=battle.mod||1,boss=w===15,count=boss?1:Math.min(4,1+Math.floor((w-1)/5)+d);
 battle.enemies=Array.from({length:count},(_,i)=>{const hp=Math.round((boss?70+d*55:13+w*2+d*13)*m);return {id:'enemy-'+i,name:boss?'Ossuary lord':i%2?'Crypt archer':'Bone guard',kind:boss?'boss':i%2?'enemyArcher':'enemy',role:boss?'Boss':i%2?'Archer':'Warrior',hp,maxHp:hp,attack:Math.round((boss?12+d*6:4+w*.35+d*3)*m),defense:boss?3+d*2:Math.floor(w/6)+d,crit:boss?.15:.04,evade:0,leech:0};});
 battle.phase='combat';battleEvent(`Wave ${w}: ${boss?'the dungeon lord awakens':count+' enemies approach'}.`);
}
function healUnit(source,target,amount){const actual=Math.min(amount,target.maxHp-target.hp);if(actual<=0)return;target.hp+=actual;target.event={beat:battle.beat,kind:'heal',text:'+'+actual};source.event={beat:battle.beat,kind:'attack',text:'Heal'};battleEvent(`${source.name} restores ${actual} HP to ${target.name}.`);}
function hit(source,target){
 source.event={beat:battle.beat,kind:'attack',text:source.role==='Archer'?'➶':source.role==='Hero'&&s.gear.weapon<0?'Strike':'⚔'};
 if(Math.random()<(target.evade||0)){target.event={beat:battle.beat,kind:'damage',text:'Dodge'};battleEvent(`${target.name} dodges ${source.name}.`);return;}
 const critical=Math.random()<(source.crit||0),damage=Math.max(1,Math.round((source.attack*(.9+Math.random()*.2)-(target.defense+(target.role==='Hero'&&battle.allies.some(u=>u.role==='Warrior'&&u.hp>0)?2:0))*.55)*(critical?1.7:1)));
 const actual=Math.min(target.hp,damage);target.hp=Math.max(0,target.hp-damage);target.event={beat:battle.beat,kind:'damage',text:(critical?'Crit ':'−')+actual};battleEvent(`${source.name} hits ${target.name} for ${actual}${critical?' (critical)':''}.`);
 if(source.leech&&source.hp>0){const healing=Math.min(source.maxHp-source.hp,Math.ceil(actual*source.leech));source.hp+=healing;if(healing)battleEvent(`${source.name} steals ${healing} HP.`);}
 if(target.hp<=0){battleEvent(`${target.name} falls.`);if(target.index!==undefined){s.recruits[target.index].dead=true;log(s.recruits[target.index].cls+' fell in battle.');}}
}
function clearCombatEffects(){for(const u of [...battle.allies,...battle.enemies])delete u.event;}
function rewardWave(){
 clearCombatEffects();
 const m=battle.d+1;battle.loot.gold+=m*(4+Math.floor(Math.random()*6));for(const k of ['wood','stone','food'])battle.loot[k]+=m*2;
 for(const[k,prob]of Object.entries({iron:.08,rivets:.06,leather:.05,essence:.025}))if(Math.random()<prob+battle.d*.01)battle.loot[k]+=1;
 if(Math.random()<.015+battle.d*.005)battle.loot.blueprints++;
 if(battle.wave%5===0&&Math.random()<.08+battle.d*.02){const roll=Math.random(),slot=roll<.3?'weapon':roll<.45?'body':SLOTS[Math.floor(Math.random()*SLOTS.length)].key,item={slot,tier:1+battle.d,upgrade:0};battle.loot.equipment.push(item);battleEvent('Rare equipment found: '+gearItem(slot,item.tier,0).name+'.');}battleEvent('Wave cleared. Rewards added to unsecured spoils.');
 if(battle.wave===15){finish(true);return;}
 if(battle.wave%5===0){battle.checkpoint=true;battle.phase='checkpoint';}
 else{battle.phase='between';battle.nextAt=battle.beat+2;}
}
function updateBattle(){if(!estimating){save();render();}}
function continueBattle(){clearCombatEffects();battle.checkpoint=false;battle.wave++;for(const u of battle.allies)if(u.hp>0)u.hp=Math.min(u.maxHp,u.hp+Math.round(u.maxHp*.2));spawnWave();}
function tickBattle(){
 if(!battle||battle.checkpoint||battle.result||(!estimating&&(document.hidden||resetting)))return;ensureBattle();battle.beat++;
 if(battle.phase==='between'){if(battle.beat>=battle.nextAt){battle.wave++;spawnWave();}updateBattle();return;}
 for(const unit of battle.allies.filter(u=>u.hp>0)){
  if(unit.role!=='Hero'&&battle.beat%2!==0)continue;
  if(unit.role==='Healer'&&battle.beat%2===0){const injured=battle.allies.filter(u=>u.hp>0&&u.hp<u.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(injured){healUnit(unit,injured,3+Math.floor(s.recruits[unit.index].level/4));continue;}}
  const target=battle.enemies.find(u=>u.hp>0);if(target)hit(unit,target);
 }
 if(battle.enemies.every(u=>u.hp<=0)){rewardWave();if(battle){updateBattle();}return;}
 for(const unit of battle.enemies.filter(u=>u.hp>0)){
  const alive=battle.allies.filter(u=>u.hp>0);const target=unit.role==='Archer'?alive[alive.length-1]:alive.find(u=>u.role==='Hero')||alive[0];if(target)hit(unit,target);
  if(battle.allies[0].hp<=0){finish(false);return;}
 }
 updateBattle();
}
function settings(confirm=false){
 const d=$('#settings');d.innerHTML=confirm?`<div class="eyebrow">Start over</div><h2>Reset your progress?</h2><p class="muted">This clears your hero, settlement, items, recruits, dungeon progress, and debt${email?' from this account’s server save':''}. Your account remains.</p><label for="reset-word">Type RESET to confirm</label><input id="reset-word" placeholder="RESET" autocomplete="off"><p id="reset-error" class="muted"></p><div class="row">${btn('Cancel','settings')}${btn('Reset progress','reset-confirm',true)}</div>`:`<div class="row"><h2>Save settings</h2>${btn('Close','close')}</div><p class="muted">${email?'Your progress is saved to your account.':'Your progress is saved in this browser.'}</p><div class="reset-section"><h3>Start a new adventure</h3><p class="muted">Clear your progress and return to the beginning.</p>${btn('Reset save…','reset-prompt')}</div>`;if(!d.open)d.showModal();
}
async function resetSave(){
 if($('#reset-word')?.value!=='RESET'||resetting)return;resetting=true;for(const b of $('#settings').querySelectorAll('button'))b.disabled=true;$('#settings [data-action="reset-confirm"]').textContent='Resetting…';
 const fresh=initial();try{if(email){await syncPromise;const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:fresh})});if(!r.ok)throw new Error('The account save could not be reset. Please try again.');}
 s=fresh;battle=null;selectedSlot='weapon';tab='Settlement';riskCache.clear();for(const k of Object.keys(openPanels))delete openPanels[k];resetting=false;save();$('#settings').close();render();journal();
 }catch(e){resetting=false;$('#reset-error').textContent=e.message;for(const b of $('#settings').querySelectorAll('button'))b.disabled=false;$('#settings [data-action="reset-confirm"]').textContent='Reset progress';}
}

async function account(){const d=$('#account');if(standalone){d.innerHTML='<h2>Local adventure</h2><p class="muted">Your progress saves in this browser. Accounts and cross-device saves are available when this same HTML file is served by the Gravehold server.</p>'+btn('Close','close');d.showModal();return;}d.innerHTML=email?`<h2>Your account</h2><p>Signed in. Progress syncs to this server.</p>${btn('Sign out','logout')}${btn('Close','close')}`:`<h2>Return to Gravehold</h2><p class="muted">Save your settlement across devices on the same host.</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password · at least 8 characters" autocomplete="current-password"><p id="auth-error"></p>${btn('Sign in','login')}${btn('Create account','register')}${btn('Continue with Google','google')}<p class="muted">Google sign-in requires the host’s OAuth configuration.</p>${btn('Close','close')}`;d.showModal()}
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab){if(battle&&el.dataset.tab!=='Expeditions'){log('Finish or extract from the current expedition first.');render();return}tab=el.dataset.tab;render();if(!s.seen.includes(tab))journal();return}if(el.dataset.topic){journal(el.dataset.topic);return}const[a,k]=String(el.dataset.action).split(':');let ok=true;
if(a==='equip'){if(!equipItem(Number(k)))return;save();render();if($('#inventory').open)inventory(false);return;}if(a==='settings')return settings();if(a==='reset-prompt')return settings(true);if(a==='reset-confirm')return resetSave();if(a==='inventory')return inventory();if(a==='slot'){selectedSlot=k;render();return;}if(a==='journal')return journal();if(a==='account')return account();if(a==='close'){el.closest('dialog').close();return}
if(a==='login'||a==='register'){const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const v=await r.json();if(!r.ok){$('#auth-error').textContent=v.error;return}email=v.email;if(v.state){s=migrate(v.state);battle=s.activeBattle||null;}else save();save();$('#account').close();render();return}
if(a==='google'){location.href='/auth/google';return}
if(a==='logout'){await fetch('/api/logout',{method:'POST'});email=null;$('#account').close();render();return}
if(a==='gather')s.gather={kind:k,end:Date.now()+8000};if(a==='collect'&&s.gather&&Date.now()>=s.gather.end){s[s.gather.kind]=Math.min(cap(s.gather.kind),s[s.gather.kind]+12);log('Gathered 12 '+s.gather.kind+'.');s.gather=null}
if(a==='build'){ok=pay({wood:20,stone:10});if(ok){s.buildings[k]=1;log('Built a production site. Dungeon gates are now open.')}}
if(a==='worker'){ok=pay({food:15,wood:20});if(ok)s.workers[k]={xp:0}}
if(a==='train'){ok=pay({[k]:30+Math.floor(s.workers[k].xp/300)*15});if(ok)s.workers[k].xp+=300}
if(a==='storage'){ok=pay(storageCost(k));if(ok)s.buildings[k+'Storage']=(s.buildings[k+'Storage']||0)+1;}
if(a==='recruit'&&s.recruits.length<3){ok=pay(recruitCost());if(ok)s.recruits.push({cls:k,level:1,xp:0,dead:false})}
if(a==='revive'){ok=pay({gold:15,food:10});if(ok)s.recruits[k].dead=false}
if(a==='upgrade'){const c=upgradeCost(k);ok=s.gear[k]>=0&&s.items.iron>=c.iron&&pay({gold:c.gold});if(ok){s.items.iron-=c.iron;s.gearUpgrades[k]++;}}
if(a==='craft'){const c=forgeCost(k);ok=canCraft(k);if(ok){s.blueprints--;for(const[key,v]of Object.entries(c)){if(key==='gold')s.gold-=v;else s.items[key]-=v;}s.gear[k]=Math.max(1,s.gear[k]+1);s.gearUpgrades[k]=0;log('Forged '+gearItem(k).name+'.');}}
if(a==='hero'&&s.heroDead){ok=pay({gold:25,food:15});if(ok){s.heroDead=false;s.recover=0}}
if(a==='loan'&&s.heroDead&&s.debt+s.interest===0){s.debt=Math.max(0,25-s.gold)+Math.max(0,15-s.food)*2;s.gold=Math.max(0,s.gold-25);s.food=Math.max(0,s.food-15);s.heroDead=false;s.loanRuns=0;log('Emergency loan secured. The hero has been revived.')}
if(a==='recover'&&s.heroDead&&s.debt+s.interest>0&&!s.recover)s.recover=Date.now()+300000;
if(a==='repay'){const amount=Math.min(10,s.gold,s.debt+s.interest),i=Math.min(amount,s.interest);s.gold-=amount;s.interest-=i;s.debt=Math.max(0,s.debt-(amount-i));}
if(a==='enter'&&!s.heroDead){startBattle(s.choices[Number(k)]);}
if(a==='extract'&&battle?.checkpoint)return finish(true);if(a==='continue'&&battle?.checkpoint)continueBattle();
if(!ok)log('Not enough resources yet. Gather, work, or return with dungeon loot.');save();render();});
document.addEventListener('input',e=>{if(e.target.id==='reset-word')$('#settings [data-action="reset-confirm"]').disabled=e.target.value!=='RESET'||resetting;});
async function boot(){try{if(!standalone){const r=await fetch('/api/me');if(r.ok){const v=await r.json();email=v.email;if(v.state){s=migrate(v.state);battle=s.activeBattle||null;if(battle)tab='Expeditions';}}}}catch{}render();if(!s.seen.includes(tab))journal();}
setInterval(()=>{if(!document.hidden){render();save()}},1000);setInterval(tickBattle,650);boot();

</script>
</body>
