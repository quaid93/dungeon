function arena(){ensureBattle();const remaining=battle.enemies.filter(u=>u.hp>0).length,resting=battle.checkpoint||battle.phase==='between',h=battle.allies[0];return `<section class="battle-shell ${resting?'at-rest':'in-combat'}"><div class="battle-heading"><div><h2>${escapeHtml(battle.name)}</h2><div class="encounter-tags"><span>${['Easy','Medium','Hard'][battle.d]}</span><span title="${MODIFIERS[battle.modifier||'none'].help}">${MODIFIERS[battle.modifier||'none'].name}</span><span>${battle.focus||'balanced'} loot</span>${battle.path&&battle.path!=='balanced'?`<span>${pathInfo(battle.path).name}</span>`:''}</div></div><div class="battle-stage"><strong>${battle.wave}<span> / 15</span></strong><small>WAVE</small></div></div><div class="wave-track" aria-label="Wave ${battle.wave} of 15">${Array.from({length:15},(_,i)=>`<i title="Wave ${i+1}${(i+1)%5===0?' · extraction checkpoint':''}" class="${i+1<battle.wave?'cleared':i+1===battle.wave?'current':''} ${(i+1)%5===0?'checkpoint-mark':''}">${(i+1)%5===0?uiIcon(i===14?'skull':'flag',12):''}</i>`).join('')}</div><div class="arena battle-scene"><div class="scene-status"><span class="combat-state ${resting?'resting':''}">${uiIcon(resting?'check':'sword',14)} ${battle.checkpoint?'Checkpoint reached':battle.phase==='between'?'Wave cleared':'In combat'}</span><span>${remaining} ${remaining===1?'enemy':'enemies'}</span></div><div class="crypt-backdrop" aria-hidden="true">${cryptScene()}</div><div class="battle-side hero-side"><div class="support-line">${battle.allies.slice(1).map(u=>unitCard(u)).join('')}</div>${unitCard(h)}</div><div class="battle-side enemies">${battle.enemies.map(u=>unitCard(u,true)).join('')}</div></div><div class="battle-hud"><span>${uiIcon('sword',16)} ${h.attack}<small>ATK</small></span><span>${uiIcon('shield',16)} ${h.defense}<small>DEF</small></span><span>${uiIcon('party',16)} ${battle.allies.slice(1).filter(u=>u.hp>0).length}<small>ALLIES</small></span><div class="combat-caption" aria-live="polite">${escapeHtml(battle.events[0]||'The descent begins.')}</div></div>${battle.checkpoint?`<div class="checkpoint-actions"><span>${uiIcon('flag',20)} Wave ${battle.wave} cleared <small>Next leg · survivors recover 20% HP.</small></span><div>${btn('Extract loot','extract')}${btn('Continue','continue')}</div><div class="checkpoint-paths">${['safe',battle.wave===5?'rich':'material'].map(key=>`<button data-action="path:${key}" class="${battle.pendingPath===key?'chosen':''}" aria-pressed="${battle.pendingPath===key}" title="${key==='safe'?'15% weaker enemies; 15% less gold and farm supplies':key==='rich'?'10% stronger enemies; 20% more gold and farm supplies':'5% stronger enemies; 75% higher favored-material chance'}">${uiIcon(key==='safe'?'shield':key==='rich'?'gold':familyInfo(battle).material,16)} ${pathInfo(key).name}<small>${key==='safe'?'Enemies −15% · supplies −15%':key==='rich'?'Enemies +10% · supplies +20%':'Enemies +5% · '+familyInfo(battle).label+' chance +75%'}</small></button>`).join('')}</div></div>`:''}${battle.objective&&battle.objective!=='none'?`<div class="battle-objective">${uiIcon('flag',14)} ${objectiveInfo(battle.objective).name} · ${objectiveStatus(battle)?'Complete — extract to claim':objectiveInfo(battle.objective).help}</div>`:''}${battle.rescue?`<div class="battle-objective">${uiIcon('user',14)} ${specialistInfo(battle.rescue).name} rescued · extract to bring home</div>`:''}${spoilsPanel(battle.loot,false)}<div class="battle-bottom"><details class="combat-log" data-panel="combat-log"><summary>${uiIcon('book',15)} Battle log</summary><div class="battle-events">${battle.events.slice(0,8).map(x=>`<div>${escapeHtml(x)}</div>`).join('')}</div></details></div></section>`;}
function equipmentIcon(key,tier=-1,rarity="common",variant=s.gearVariants[key]||"balanced"){
 const metal=tier<=0?'#99896a':tier===1?'#9caabc':tier===2?'#76899b':tier===3?'#8b739b':'#b59a66',shadow=tier<=0?'#665946':'#505d72',edge=tier<=0?'#ddc58c':'#d2d6c6',gem={common:'#b6bec5',uncommon:'#8ab38a',rare:'#7aaff2',epic:'#bc90e5',legendary:'#edd082'}[rarity]||'#b6bec5';
 const shapes={head:`<path d="M7 3h10v2h3v13h-4v-7H8v7H4V5h3" fill="${metal}"/><path d="M4 7h16v3H4M7 3h10v2H7" fill="${edge}"/><path d="M8 11h8v8H8" fill="${shadow}"/><path d="M9 12h2v2H9m4-2h2v2h-2" fill="#192432"/><path d="M11 10h2v8h-2" fill="${edge}"/>`,body:`<path d="M7 4h10v3h4v6h-4v8H7v-8H3V7h4" fill="${metal}"/><path d="M3 7h5v5H3m13-5h5v5h-5M8 7h8v2H8" fill="${edge}"/><path d="M7 18h10v3H7" fill="${shadow}"/><path d="M10 18h4v2h-4" fill="#dbc18d"/>`,weapon:`<path d="M11 2h2v2h2v11h-4V4H9" fill="${metal}"/><path d="M11 4h2v11h-2" fill="${edge}"/><path d="M6 15h12v2H6m5 2h2v4h-2" fill="#d9bf85"/><path d="M11 17h2v3h-2" fill="#6f5040"/>`,shield:`<path d="M4 4h16v12h-2v3h-3v2H9v-2H6v-3H4" fill="${edge}"/><path d="M6 6h12v9h-2v3H8v-3H6" fill="${shadow}"/><path d="M11 6h2v12h-2" fill="${metal}"/>`,cape:'<path d="M8 3h8v3h2v7h2v8H4v-8h2V6h2" fill="#633d45"/><path d="M8 6h3v13H6v-6h2" fill="#88606a"/><path d="M8 3h8v3H8" fill="#d9c18b"/>',neck:`<path d="M5 3h2v6h2v2h6V9h2V3h2v7h-2v3H7v-3H5" fill="#d9c18b"/><path d="M9 14h6v6H9" fill="${edge}"/><path d="M10 15h4v4h-4" fill="${gem}"/>`,legs:`<path d="M6 3h12v8h-1v10h-5V10h-1v11H6" fill="${metal}"/><path d="M6 3h12v3H6m1 7h3v3H7m6-3h3v3h-3" fill="${edge}"/><path d="M6 19h5v3H6m6-3h5v3h-5" fill="${shadow}"/>`,hands:`<path d="M4 4h6v8h2v8H3V9h1m11-5h6v5h1v11h-9v-8h2" fill="${metal}"/><path d="M4 4h6v3H4m11-3h6v3h-6" fill="${edge}"/><path d="M3 17h9v3H3m10-3h12v3H13" fill="${shadow}"/>`,feet:`<path d="M4 3h6v13h2v5H2v-7h2m11-11h6v11h2v7H13v-5h2" fill="${metal}"/><path d="M4 3h6v3H4m11-3h6v3h-6" fill="${edge}"/><path d="M2 19h10v3H2m11-3h12v3H13" fill="${shadow}"/>`,ring:`<path d="M7 7h10v2h3v10h-3v2H7v-2H4V9h3m1 3v6h8v-6" fill="#c7a363" fill-rule="evenodd"/><path d="M9 3h6v6H9" fill="${edge}"/><path d="M10 4h4v4h-4" fill="${gem}"/>`};
 if(key==='weapon'&&variant!=='balanced'){const weapons={swift:`<path d="M11 8h3v9h-3M12 4h1v4h-1" fill="${metal}"/><path d="M8 17h10v2H8m4 2h2v2h-2" fill="${edge}"/>`,heavy:`<path d="M11 7h3v16h-3" fill="#947047"/><path d="M4 4h16v7H4" fill="${metal}"/><path d="M4 4h4v7H4m8-7h8v2h-8" fill="${edge}"/>`,warden:`<path d="M11 9h2v14h-2" fill="#ad8753"/><path d="M11 1h2v2h2v5h-2v3h-2V8H9V3h2" fill="${metal}"/>`,blood:`<path d="M11 10h3v13h-3" fill="#755443"/><path d="M8 3h10v3h3v8h-3v3h-4v-3h3V7H8" fill="${metal}"/><path d="M8 3h10v2H8" fill="#c2848b"/>`,precise:`<path d="M11 3h2v8h-2V3m2 8h2v6h-2" fill="${edge}"/><path d="M8 17h10v2H8m4 2h2v3h-2" fill="${metal}"/>`};shapes.weapon=weapons[variant]||shapes.weapon;}
 return `<svg class="item-icon pixel-item" viewBox="0 0 24 24" width="40" height="40" shape-rendering="crispEdges" aria-hidden="true"><ellipse cx="12" cy="22" rx="9" ry="1" fill="#080d16" opacity=".5"/><g opacity="${tier<0?.45:1}">${shapes[key]||shapes.body}${tier>=2&&['head','body','shield'].includes(key)?`<path d="M11 6h2v2h-2" fill="${gem}"/>`:''}</g></svg>`;
}

function itemComparison(item){const before=heroStats(),key=item.slot,old=[s.gear[key],s.gearUpgrades[key],s.gearRarities[key],s.gearVariants[key],s.gearMastery.weapon];let after;try{if(key==='weapon')s.gearMastery.weapon=replacementMastery(item);s.gearVariants[key]=item.variant||"balanced";s.gear[key]=item.tier;s.gearUpgrades[key]=item.upgrade||0;s.gearRarities[key]=item.rarity||defaultRarity(item.tier);after=heroStats();}finally{[s.gear[key],s.gearUpgrades[key],s.gearRarities[key],s.gearVariants[key],s.gearMastery.weapon]=old;}const delta={};for(const k of Object.keys(before)){const v=Math.round((after[k]-before[k])*1000)/1000;if(v)delta[k]=v;}return delta;}
function comparisonText(delta){return Object.entries(delta).map(([k,v])=>`${v>0?'+':'−'}${['crit','evade','leech','speed'].includes(k)?Number((Math.abs(v)*100).toFixed(1))+'%':Math.abs(v)} ${k==='health'?'HP':k==='leech'?'life steal':k==='speed'?'attack speed':k}`).join(' · ')||'Same combat stats';}
function itemScore(delta){return (delta.attack||0)*2+(delta.defense||0)*2+(delta.health||0)/5+(delta.crit||0)*80+(delta.evade||0)*100+(delta.leech||0)*80+(delta.speed||0)*30;}
function rankedItems(slot){return s.equipmentBag.map((item,index)=>({item,index,delta:itemComparison(item)})).filter(x=>x.item.slot===slot).sort((a,b)=>itemScore(b.delta)-itemScore(a.delta)||Object.keys(RARITIES).indexOf(b.item.rarity)-Object.keys(RARITIES).indexOf(a.item.rarity)||b.item.tier-a.item.tier);}
function armoryFind(item,index,recent=false){const info=gearItem(item.slot,item.tier,item.upgrade||0,item.variant||"balanced"),delta=itemComparison(item),score=itemScore(delta);return `<article class="armory-find rarity-${item.rarity||defaultRarity(item.tier)}"><button class="find-icon" data-action="slot:${item.slot}" aria-label="Inspect ${info.name}">${equipmentIcon(item.slot,item.tier,item.rarity,item.variant||"balanced")}</button><button class="find-info" data-action="slot:${item.slot}"><strong>${info.name}${info.upgrade?' +'+info.upgrade:''}</strong><small>${RARITIES[item.rarity||defaultRarity(item.tier)].label} · ${SLOTS.find(x=>x.key===item.slot).label}</small><span class="stat-comparison ${score>0?'gain':score<0?'loss':''}">${comparisonText(delta)}</span></button><div class="find-actions">${btn(recent?'Equip now':'Equip','equip:'+index,!!battle||!!s.offlineQueue)}${btn(goalDetails()&&(s.pinnedGoal?.kind!=='spare-upgrade'||s.pinnedGoal.itemId!==item.id)?'Salvage → goal':'Salvage','salvage:'+index,!!battle||!!s.offlineQueue)}${recent?btn('Dismiss','dismiss:'+index):''}${btn('Upgrade later','pin-item:'+index)}</div></article>`;}
function newFinds(){const items=s.equipmentBag.map((item,index)=>({item,index})).filter(x=>x.item.newFind!==false).reverse().slice(0,5);return `<section class="card new-finds"><div class="row"><h3>New finds</h3><span class="badge">${items.length} / 5</span></div>${items.length?items.map(x=>armoryFind(x.item,x.index,true)).join(''):'<p class="muted">No new finds.</p>'}</section>`;}
function slotOptions(){const options=rankedItems(selectedSlot);return `<section class="card slot-options"><div class="row"><h3>${SLOTS.find(x=>x.key===selectedSlot).label} items</h3><span class="badge">${options.length} ITEMS</span></div>${options.length?'<p class="muted">Best gains first.</p>':''}${options.length?options.map(x=>armoryFind(x.item,x.index)).join(''):'<p class="muted">No spare items.</p>'}</section>`;}
function weaponPoolPanel(){return `<details class="history-panel" data-panel="weapon-pool"><summary>Weapon collection · six fighting styles</summary><p class="muted">Rare drops at waves 5, 10 & 15.</p><div class="grid">${Object.entries(WEAPON_POOL).map(([id,definition])=>{const item=gearItem('weapon',1,0,id);return `<div class="inventory-item">${equipmentIcon('weapon',1,'common',id)}<strong>${item.name}</strong><span>${definition.style}</span><small>${statText(item.stats)}</small><small>${definition.help}</small></div>`;}).join('')}</div></details>`;}
function loadout(){const active=selectedSlot||"weapon",h=heroStats(),item=gearItem(active),slot=SLOTS.find(x=>x.key===active),cost=forgeCost(active),upgrade=upgradeCost(active),next=Math.max(1,s.gear[active]+1);
 return `<div class="loadout-layout">${newFinds()}<section class="card equipment"><div class="row"><h3>Equipment</h3><span class="badge">${SLOTS.filter(x=>s.gear[x.key]>=0).length} / 10</span></div><div class="equipment-grid"><div class="loadout-portrait">${sprite("hero")}<span>THE WARDEN</span></div>${SLOTS.map(x=>{const it=gearItem(x.key);return `<button class="equipment-slot rarity-${s.gearRarities[x.key]} ${selectedSlot===x.key?'selected':''} ${it?'':'empty'}" style="grid-row:${({neck:2,body:3,legs:4,shield:4})[x.key]||x.row};grid-column:${({neck:3,body:3,legs:3,shield:1})[x.key]||x.col}" data-action="slot:${x.key}" aria-label="${x.label} slot: ${it?it.name:'empty'}" title="${it?it.name:'Empty '+x.label}"><span>${equipmentIcon(x.key,it?.tier??-1,s.gearRarities[x.key])}</span><strong>${x.label}</strong></button>`}).join('')}</div>
 <p class="set-status">Gravewarden set: ${SLOTS.filter(x=>s.gear[x.key]===2).length}/3 · ${SLOTS.filter(x=>s.gear[x.key]===2).length>=3?'active +10% HP':'3 pieces grant +10% HP'}</p><div class="hero-stats"><span>Attack <strong>${h.attack}</strong></span><span>Defense <strong>${h.defense}</strong></span><span>HP <strong>${h.health}</strong></span><details class="loadout-bonuses" data-panel="bonuses"><summary>Combat bonuses</summary><div class="secondary-stats"><span>Attack speed <strong>${((1+h.speed)/.65).toFixed(2)}/sec</strong></span><span>Critical <strong>${Math.round(h.crit*100)}%</strong></span><span>Evasion <strong>${Math.round(h.evade*100)}%</strong></span><span>Life steal <strong>${Math.round(h.leech*100)}%</strong></span></div></details></div></section>
 ${selectedSlot?`${slotOptions()}<section class="card item-detail"><div class="eyebrow"></div><div class="eyebrow">${slot.label} slot</div><div class="selected-item"><div class="icon">${equipmentIcon(slot.key,item?.tier??-1,s.gearRarities[active])}</div><div><h2>${item?item.name:'Empty slot'}</h2><span class="badge rarity-${s.gearRarities[selectedSlot]}">${item?RARITIES[s.gearRarities[selectedSlot]].label+' · TIER '+item.tier+(item.upgrade?' · +'+item.upgrade:''):'UNEQUIPPED'}</span></div></div><p class="muted">${item?.help||''}</p><p class="item-stats">${item?statText(item.stats):'Find gear at waves 5, 10 & 15.'}</p>
 <div class="item-actions">${item?`<div>${btn('Upgrade item','upgrade:'+selectedSlot,s.gold<upgrade.gold||s.items.iron<upgrade.iron)}${btn('Track upgrade','pin:upgrade:'+selectedSlot)}<small>${costMarkup(upgrade)}</small><small class="effect-preview">After upgrade: ${statText(gearItem(selectedSlot,item.tier,item.upgrade+1,item.variant).stats)}</small></div>`:''}${item?`<div>${btn('Forge tier '+next+' →','craft:'+selectedSlot,!canCraft(selectedSlot))}${btn('Track forge','pin:craft:'+selectedSlot)}<small>1 blueprint · ${cost.gold} gold + rare materials</small><small class="effect-preview">Next tier: ${statText(gearItem(selectedSlot,next,0,item?.variant).stats)}</small></div>`:''}</div>
 ${item?`<details class="recipe" data-panel="recipe:${selectedSlot}"><summary>Forge recipe</summary><p>${costMarkup(cost)} · <span tabindex="0" title="${materialTooltip('blueprints')}">1 blueprint</span></p><p class="gold">${statText(gearItem(selectedSlot,next,0,item?.variant).stats)}</p><small class="muted">${item?'Replaces this item. Upgrades reset when forging.':'Creates and equips this piece.'}</small></details>`:btn('Open inventory','inventory')}<p class="slot-hint">Choose another slot to inspect it.<br>Materials are stored in your inventory.</p></section>`:'<section class="card slot-options empty-options"><h3>Available equipment</h3><p class="muted">Select a slot.</p></section>'}</div>${masteryPanel()}${weaponPoolPanel()}${workshopPanel()}`;
}
function recruits(){return `<div class="row"><h2>Companions</h2><span class="badge">${s.recruits.length} / 3</span></div>${!s.recruits.length?'<p class="muted">Build barracks → prepare quarters → hire.</p>':''}<div class="grid recruit-grid">${s.recruits.map((r,i)=>{const u=recruitUnit(r,i),next=recruitUnit({...r,level:r.level+1},i);return `<section class="card"><div class="recruit-portrait">${sprite(r.cls)}</div><h3>${escapeHtml(r.name||recruitName(r.cls,i))}</h3><span class="badge">${r.cls} · LEVEL ${r.level}</span><p>${u.maxHp} HP · ${u.attack} attack · ${u.defense} defense<br>${r.cls==='Healer'?3+Math.floor(r.level/4)+(r.level>=5?1:0)+' healing / cast':Math.round(u.crit*100)+'% personal crit'}</p><div class="bar"><span style="width:${r.xp/20*100}%"></span></div><small class="muted">${r.xp}/20 expeditions toward level ${r.level+1}</small><p class="effect-preview">Next level: +2 HP${next.attack>u.attack?' · +1 attack':''}${r.cls==='Healer'&&((r.level+1)%4===0)?' · +1 healing':''}${r.level===4?' · unlock '+recruitTrait(r):''}</p><details data-panel="recruit:${i}"><summary>Specialization & growth</summary><p>${{Warrior:'+5% hero defense · guards and bosses',Archer:'+3% hero crit · prioritizes enemy healers',Healer:'+5 hero HP · heals injured allies'}[r.cls]} while alive.<br>Every level: +2 personal HP. Every fourth level: +1 personal attack.${r.cls==='Healer'?' Healing also improves every fourth level.':''}<br>${r.level>=5?'✓':'Level 5 unlock:'} ${recruitTrait(r)}</p><div class="bond-status"><span class="badge">LOYALTY ${r.loyalty||0}/30</span><p>${bondStory(r)}</p><small class="muted">One loyalty per survived return after wave 5. At 30: +2 personal HP, once.</small></div></details>${r.dead?btn('Instant revive · '+costText(reviveCost(r)),'revive:'+i,!!s.infirmaryPatient)+freeRevivalButton(i):'<p class="badge">READY TO MARCH</p>'}</section>`;}).join('')}</div><details class="history-panel" data-panel="hiring"><summary>Recruit companions · ${s.buildings.barracks?'barracks ready':'barracks required'}</summary>${quartersPanel()}${btn('Track recruitment','pin:quarters')}<div class="grid recruit-grid">${['Warrior','Archer','Healer'].map(cls=>`<section class="card"><div class="recruit-portrait">${sprite(cls)}</div><h3>${cls}</h3><p>${{Warrior:'+5% hero defense · holds against guards',Archer:'+3% hero crit · targets enemy healers',Healer:'+5 hero HP · sustains longer runs'}[cls]}</p>${btn('Hire · '+recruitCost().gold+' gold','recruit:'+cls,s.recruits.length>=3||!s.buildings.barracks||s.quarters.stage<3||s.gold<recruitCost().gold||!!battle||!!s.offlineQueue)}</section>`).join('')}</div></details><details class="history-panel" data-panel="recruit-support"><summary>Barracks & settlement requirements</summary>${connectionPanel()}</details>`;}

function treasury(){return `${infirmaryReady()?btn('Queue all fallen · hero first','queue-fallen',!!battle||!!s.offlineQueue||!['hero',...s.recruits.map((r,i)=>i)].some(target=>patientDead(target)&&!queueHas(target))):''}<div class="grid"><div class="card"><h3>Hero recovery</h3><p>${s.heroDead?'Hero fallen.':'Ready to descend.'}</p>${btn('Revive · '+costText(reviveCost()),'hero',!s.heroDead||!!s.infirmaryPatient)}${s.heroDead?freeRevivalButton('hero'):''}<p class="muted">${s.heroRevives} revivals · costs rise each time.</p>${btn('Emergency revival loan','loan',!s.heroDead||s.debt+s.interest>0||!!s.infirmaryPatient)}${s.heroDead&&!infirmaryReady()?btn(s.recover?'Recovering · '+Math.max(0,Math.ceil((s.recover-Date.now())/1000))+'s':'Begin free recovery · 5 min','recover',!!s.recover||!!s.infirmaryPatient):''}</div><div class="card"><h3>Outstanding loan</h3><p>Principal: ${s.debt.toFixed(2)} gold<br>Interest: ${s.interest.toFixed(2)} gold<br>Expeditions until interest: ${5-s.loanRuns}</p><details data-panel="loan-info"><summary>Loan terms</summary><p>1% of principal every five completed expeditions. No offline interest. Further borrowing is blocked until paid.</p></details>${btn('Repay up to 10 gold','repay',s.debt+s.interest<=0||s.gold<=0)}</div></div>`}
function render(){const focusedResource=document.activeElement?.dataset?.resource,focusedAction=document.activeElement?.dataset?.action,focusedTab=document.activeElement?.dataset?.tab;for(const d of document.querySelectorAll('#app details[data-panel]'))openPanels[d.dataset.panel]=d.open;accrue();const navs=[['Settlement','home'],['Expeditions','sword'],['Loadout','shield'],['Recruits','party'],['Treasury','gold'],['Progression','star']];$('#app').innerHTML=`<div class="layout"><aside><div class="brand">${uiIcon('crown',30)}<span>GRAVEHOLD</span></div><nav aria-label="Game sections">${navs.map(([t,i])=>`<button data-tab="${t}" class="${tab===t?'active':''}" ${tab===t?'aria-current="page"':''}>${uiIcon(i)}<span>${t}</span>${t==='Expeditions'&&battle?'<i class="live-dot"></i>':''}</button>`).join('')}</nav><div class="rail-footer">${uiIcon('skull',28)}<span>Hold against the dark.</span></div></aside><main><div class="top"><div class="resources">${['wood','stone','food','gold'].map(k=>`<div class="resource" data-resource="${k}" tabindex="0" aria-label="${resourceTooltip(k)}" aria-describedby="resource-tip-${k}">${uiIcon(k,22)}<div><span>${Math.floor(s[k]).toLocaleString()}${k==='gold'?'':`<em> / ${cap(k)}</em>`}</span><small>${k[0].toUpperCase()+k.slice(1)} ${k==='gold'?'':s[k]>=cap(k)?'· FULL':`· +${incomeRate(k).toFixed(1)}/s`}</small></div><span class="resource-tip" id="resource-tip-${k}" role="tooltip">${resourceTooltip(k)}</span></div>`).join('')}</div><div class="toolbar"><button class="combat-score-button" data-action="combat-score" title="Combat score · view breakdown" aria-label="Combat score ${combatScore()}: view breakdown">${uiIcon('sword',17)}<strong>${combatScore()}</strong><small>CS</small></button>${iconButton('Inventory','inventory','bag')}${iconButton('Journal','journal','book')}${iconButton(email?'Account':'Sign in','account','user')}</div></div>${capacityWarnings()}${goalPanel()}${patientPanel()}${lootNotification()}<div class="intro"><h1>${tab}</h1><span class="page-status">${tab==='Expeditions'?battle?'Expedition in progress':'15 waves · extract every 5':tab==='Loadout'?'The Warden':tab==='Settlement'?Object.keys(s.workers).length+' / 3 workers':tab==='Recruits'?s.recruits.length+' / 3 companions':tab==='Progression'?s.meta.essence+' prestige essence':s.debt+s.interest>0?'Loan outstanding':'Recovery & gold'}</span></div>${({Settlement:settlement,Expeditions:expeditions,Loadout:loadout,Recruits:recruits,Treasury:treasury,Progression:progression})[tab]()}<details class="feed" data-panel="activity"><summary>Activity${s.log.length?' · '+s.log[0]:''}</summary>${s.log.slice(0,6).map(t=>`<p>${t}</p>`).join('')}</details><footer><span class="save-status">${uiIcon('check',12)} ${email?'Cloud save':'Autosaved on this browser'}</span>${btn('Save settings','settings')}</footer></main></div>`;for(const d of document.querySelectorAll('#app details[data-panel]'))d.open=!!openPanels[d.dataset.panel];if(focusedResource)document.querySelector('[data-resource="'+focusedResource+'"]')?.focus({preventScroll:true});if(!focusedResource&&(focusedAction||focusedTab)){const next=[...document.querySelectorAll('#app button')].find(el=>focusedTab?el.dataset.tab===focusedTab:el.dataset.action===focusedAction);if(next&&!next.disabled)next.focus({preventScroll:true});}if($('#inventory')?.open)inventory(false);}
function lootNotification(){const a=s.lootAlert;return a&&a.until>Date.now()?`<div class="loot-notification rarity-${a.rarity}"><span>${uiIcon('star',16)} EQUIPMENT FOUND · ${RARITIES[a.rarity].label.toUpperCase()}</span><strong>${escapeHtml(a.name)}</strong><small>${a.stats} · wave ${a.wave} · extract to secure</small></div>`:'';}
function journal(topic=tab){const d=$('#journal');d.innerHTML=`<div class="eyebrow">The survivor’s journal</div><h2>${topics[topic][0]}</h2><p class="muted">${topics[topic][1]}</p><div>${Object.keys(topics).map(t=>`<button data-topic="${t}">${t}</button>`).join(' ')}</div><p>${btn('Understood','close')}</p><label class="tutorial-toggle"><input type="checkbox" id="tutorials-off" ${s.tutorialsDisabled?'checked':''}> Don’t show tutorials again</label>`;if(!d.open)d.showModal();if(!s.seen.includes(topic)){s.seen.push(topic);save()}}

function finish(win){
 if(estimating){battle.result=win?'win':'loss';return;}
 awardObjective(battle,win);settleRescue(battle,win);s.lastExpedition={objective:win&&battle.objectiveAwarded?objectiveInfo(battle.objective).name:null,rescue:win?battle.rescue:null,report:battleReport(win),won:win,wave:battle.wave||0,loot:JSON.parse(JSON.stringify(battle.loot))};
 if(win){s.equipmentBag.push(...(battle.loot.equipment||[]));for(const k of ['gold','wood','stone','food'])s[k]=k==='gold'?s[k]+(battle.loot[k]||0):Math.min(cap(k),s[k]+(battle.loot[k]||0));
 for(const k of Object.keys(MATERIALS))s.items[k]+=(battle.loot[k]||0);s.blueprints+=battle.loot.blueprints||0;log('Returned safely with '+battle.loot.gold+' gold and crafting supplies.');
 }else{s.heroDead=true;log('The hero fell. Unsecured rewards were lost.');}
 recordRun(win,battle.wave||0,battle.loot,battle);
 battle=null;s.choices=null;if(!win&&infirmaryReady()&&!estimating)queueFallen();save();render();
}
function recruitName(cls,i){return ({Warrior:['Aldric','Bran','Oswin'],Archer:['Mira','Rowan','Ash'],Healer:['Elara','Sable','Iona']}[cls]||['Traveler'])[i%3];}
function recruitTrait(r){return r.cls==='Warrior'?'Steadfast · +1 personal defense':r.cls==='Archer'?'Keen eye · +2% personal crit':'Mercy · +1 healing per cast';}
function recruitUnit(r,i){const level=r.level||1,warrior=r.cls==='Warrior',archer=r.cls==='Archer';const hp=(warrior?23:archer?17:19)+level*2+((r.loyalty||0)>=30?2:0);return {id:'recruit-'+i,name:r.name||recruitName(r.cls,i),kind:r.cls,role:r.cls,index:i,maxHp:hp,hp:r.dead?0:hp,attack:(archer?3:warrior?2:1)+Math.floor(level/4),defense:(warrior?2:0)+(warrior&&level>=5?1:0),crit:(archer?.06:.02)+(archer&&level>=5?.02:0),evade:0,leech:0};}
function combatNumber(value){return Math.round((value||0)*100)/100;}
function combatStats(){return battle.stats??={damage:{},healing:{},taken:0,lastHit:null};}
function battleReport(won){const t=combatStats(),role=Object.entries(t.takenByRole||{}).sort((a,b)=>b[1]-a[1])[0]?.[0];let recommendation='Invest rewards in your next upgrade.';if(!won){recommendation=(t.enemyHealing||0)>0?'Enemy healing prolonged the fight. An Archer prioritizes enemy healers.':role==='Guard'||role==='Boss'?'Armor absorbed sustained attacks. Improve defense or recruit a Warrior.':battle.allies.slice(1).some(u=>u.hp<=0)?'Archers threaten companions. Improve survival and recover fallen recruits.':'Long fights drained HP. A Healer provides sustain; try an easier route.';}return {...JSON.parse(JSON.stringify(t)),won,recommendation};}
function reportPanel(r){if(!r)return '';return `<section class="report-panel"><span class="eyebrow">Expedition debrief</span><div class="history-stats"><span>Hero damage<strong>${combatNumber(r.damage.hero)}</strong></span><span>Support damage<strong>${combatNumber(Object.entries(r.damage).filter(([k])=>k!=='hero').reduce((a,[,v])=>a+v,0))}</strong></span><span>Healing<strong>${combatNumber(Object.values(r.healing).reduce((a,v)=>a+v,0))}</strong></span><span>Damage received<strong>${combatNumber(r.taken)}</strong></span></div><details data-panel="report-contributions"><summary>Individual contributions</summary>${[...new Set([...Object.keys(r.damage),...Object.keys(r.healing)])].map(k=>`<p>${escapeHtml(k==='hero'?'Hero':s.recruits[Number(k.split('-')[1])]?.name||'Companion')}: ${combatNumber(r.damage[k])} damage · ${combatNumber(r.healing[k])} healing</p>`).join('')}</details><p>${r.won?'Returned safely.':r.lastHit?`Defeated by ${escapeHtml(r.lastHit.name)} · ${r.lastHit.damage} final damage.`:'Your hero fell.'} ${r.recommendation}</p></section>`;}

function startBattle(c){const h=heroStats(c.objective!=="solo");battle={balance:4,...c,wave:1,beat:0,checkpoint:false,phase:'combat',clearedWave:0,objectiveAwarded:false,events:['The expedition enters the dungeon.'],loot:{gold:0,wood:0,stone:0,food:0,iron:0,rivets:0,leather:0,essence:0,blueprints:0,equipment:[]},allies:[{id:'hero',name:'Your hero',kind:'hero',role:'Hero',hp:h.health,maxHp:h.health,attack:h.attack,defense:h.defense,crit:h.crit,evade:h.evade,leech:h.leech},...(c.objective==='solo'?[]:s.recruits.map(recruitUnit))],enemies:[]};if(c.modifier==='wounded')battle.allies[0].hp=Math.round(h.health*.75);spawnWave();}
function ensureBattle(){
 if(battle)battle.loot.equipment??=[];
 if(battle?.allies&&battle.balance!==4){for(const u of battle.allies.slice(1)){const hpRatio=u.hp/u.maxHp,next=recruitUnit(s.recruits[u.index],u.index);Object.assign(u,next,{hp:Math.round(next.maxHp*hpRatio)});}battle.balance=4;}
 if(battle&&!battle.allies){const old=battle,c={d:old.d,name:old.name,mod:old.mod};startBattle(c);battle.wave=old.wave||1;battle.loot={...battle.loot,...old.loot};battle.checkpoint=old.checkpoint||false;battle.allies[0].hp=Math.max(1,Math.round(battle.allies[0].maxHp*(old.hp||100)/100));spawnWave();}
}
function battleEvent(t){battle.events.unshift(t);battle.events=battle.events.slice(0,12);}
function spawnWave(){const d=battle.d,w=battle.wave,m=(battle.mod||1)*(battle.modifier==='elite'?1.25:1)*pathInfo(battle.path).enemy,boss=w===15,count=boss?1:Math.min(4,1+Math.floor((w-1)/5)+d);battle.enemies=Array.from({length:count},(_,i)=>{const healer=!boss&&w>=6&&i===count-1,archer=!boss&&!healer&&i%2===1,role=boss?'Boss':healer?'Healer':archer?'Archer':'Guard',hp=Math.round((boss?70+d*55:13+w*2+d*13)*m*(healer?.65:archer?.75:1));return {id:'enemy-'+i,name:boss?'Ossuary lord':healer?'Hollow healer':archer?'Crypt archer':'Armored guard',kind:boss?'boss':healer?'enemyHealer':archer?'enemyArcher':'enemy',role,hp,maxHp:hp,attack:Math.round((boss?12+d*6:4+w*.35+d*3)*m*(healer?.55:archer?.85:1)),defense:boss?3+d*2:healer||archer?0:Math.floor(w/6)+d+1,crit:boss?.15:archer?.08:.04,evade:0,leech:0};});battle.phase='combat';battleEvent(`Wave ${w}: ${boss?'the dungeon lord awakens':count+' enemies approach'}.`);}
function healUnit(source,target,amount){const actual=Math.min(amount,target.maxHp-target.hp);if(actual<=0)return;const stats=combatStats();if(source.id==='hero'||source.index!==undefined)stats.healing[source.id]=(stats.healing[source.id]||0)+actual;else stats.enemyHealing=(stats.enemyHealing||0)+actual;target.hp+=actual;target.event={beat:battle.beat,kind:'heal',text:'+'+combatNumber(actual)};source.event={beat:battle.beat,kind:'attack',text:'Heal'};battleEvent(`${source.name} restores ${combatNumber(actual)} HP to ${target.name}.`);}
function hit(source,target){
 source.event={beat:battle.beat,kind:'attack',text:source.role==='Archer'?'➶':source.role==='Hero'&&s.gear.weapon<0?'Strike':'⚔'};
 if(Math.random()<(target.evade||0)){target.event={beat:battle.beat,kind:'damage',text:'Dodge'};battleEvent(`${target.name} dodges ${source.name}.`);return;}
 const critical=Math.random()<(source.crit||0),damage=Math.max(source.role==='Hero'?.1:1,((source.attack*(.9+Math.random()*.2)-(target.defense)*.55*(source.role==='Hero'&&s.gearVariants.weapon==='heavy'?.8:1))*(critical?1.7:1)));
 const actual=Math.round(Math.min(target.hp,damage)*100)/100;const stats=combatStats();if(source.id==='hero'||source.index!==undefined)stats.damage[source.id]=(stats.damage[source.id]||0)+actual;if(target.id==='hero'){stats.taken+=actual;stats.takenByRole??={};stats.takenByRole[source.role]=(stats.takenByRole[source.role]||0)+actual;stats.lastHit={name:source.name,role:source.role,damage:actual};}target.hp=Math.max(0,Math.round((target.hp-actual)*100)/100);target.event={beat:battle.beat,kind:'damage',text:(critical?'Crit ':'−')+actual};battleEvent(`${source.name} hits ${target.name} for ${actual}${critical?' (critical)':''}.`);
 if(source.leech&&source.hp>0){const healing=Math.min(source.maxHp-source.hp,actual*source.leech);source.hp+=healing;if(healing){const stats=combatStats();stats.healing[source.id]=(stats.healing[source.id]||0)+healing;}if(combatNumber(healing)>0)battleEvent(`${source.name} steals ${combatNumber(healing)} HP.`);}
 if(target.hp<=0){battleEvent(`${target.name} falls.`);if(target.index!==undefined){s.recruits[target.index].dead=true;log(s.recruits[target.index].cls+' fell in battle.');}}
}
function clearCombatEffects(){for(const u of [...battle.allies,...battle.enemies])delete u.event;}
function objectiveInfo(key){return ({none:{name:'No objective',help:'Standard rewards.',reward:{}},solo:{name:'Lone descent',help:'Travel alone, clear wave 10, then extract. Companions stay home.',reward:{gold:25}},elite:{name:'Elite hunter',help:'Clear wave 5 on an Elite Enemies route, then extract.',reward:{iron:1}},safe:{name:'Bring everyone home',help:'Clear wave 10 with at least one recruit and all companions alive, then extract.',reward:{food:30,rivets:1}}})[key]||objectiveInfo('none');}
function objectiveStatus(b){const key=b.objective||'none';if(key==='none')return false;const cleared=b.clearedWave||0;return key==='solo'?cleared>=10&&b.allies.length===1:key==='elite'?cleared>=5&&b.modifier==='elite':cleared>=10&&b.allies.length>1&&b.allies.every(u=>u.hp>0);}
function awardObjective(b,won){if(!won||b.objectiveAwarded||!objectiveStatus(b))return false;const info=objectiveInfo(b.objective);for(const[k,v]of Object.entries(info.reward))b.loot[k]=(b.loot[k]||0)+v;b.objectiveAwarded=true;s.objectivesCompleted++;return true;}
function objectivePanel(){const info=objectiveInfo(s.objective);return `<details class="history-panel objective-picker" data-panel="objective"><summary>Optional objective · ${info.name}</summary><div class="objective-choices">${['none','solo','elite','safe'].map(k=>`<button data-action="objective:${k}" class="${s.objective===k?'chosen':''}" ${s.offlineQueue?'disabled':''}>${objectiveInfo(k).name}</button>`).join('')}</div><p>${info.help} ${Object.keys(info.reward).length?'Bonus: '+costText(info.reward)+'.':''}</p><small class="muted">Fixed bonus on extraction.</small></details>`;}
function bondStory(r){const name=r.name||r.cls,l=r.loyalty||0;const memories={Warrior:['reveals how their old watchtower fell.','entrusts you with the badge of their lost regiment.','swears to guard the home you have built.'],Archer:['speaks of a forest they can never return to.','shows you a map drawn by their missing sibling.','plants a sapling in Gravehold and calls it home.'],Healer:['recalls keeping a candle lit through the plague.','shares the names of those they could not save.','plants healing herbs and chooses to stay.']};if(l<10)return 'Trust grows with every safe return.';return name+' '+(memories[r.cls]||memories.Warrior)[l>=30?2:l>=20?1:0]+(l>=30?' Bond complete: +2 personal HP.':'');}

function specialistInfo(key){return ({blacksmith:{name:'Varric',role:'Blacksmith',help:'Build a workshop to reduce item-upgrade gold costs by 10%. Materials and forging costs stay the same.'},quartermaster:{name:'Nessa',role:'Quartermaster',help:'Buy 25 food for 20 gold, once per completed expedition. Needs storage space.'},scout:{name:'Corvin',role:'Scout',help:'Spend 20 gold to survey three new dungeon routes. Difficulty and loot rules stay the same.'}})[key];}
function rescueSpecialist(b){if(b.queued||b.rescue)return;const missing=['blacksmith','quartermaster','scout'].filter(k=>!s.specialists[k]);if(!missing.length)return;if(b.wave===15||(b.wave===10&&Math.random()<.08)){b.rescue=missing[0];battleEvent(specialistInfo(b.rescue).name+' is freed. Extract safely to bring them home.');}}
function settleRescue(b,won){if(!won||!b.rescue||s.specialists[b.rescue])return false;s.specialists[b.rescue]=true;log(specialistInfo(b.rescue).name+' settles in Gravehold as your '+specialistInfo(b.rescue).role.toLowerCase()+'.');return true;}
function specialistService(key){if(battle||s.offlineQueue||!s.specialists[key])return false;if(key==='blacksmith'){if(s.buildings.workshop||!pay({wood:300,stone:250,gold:150}))return false;s.buildings.workshop=1;}else if(key==='quartermaster'){if(s.quartermasterRun===s.expeditions||s.food+25>cap('food')||!pay({gold:20}))return false;s.food+=25;s.quartermasterRun=s.expeditions;}else if(key==='scout'){if(!pay({gold:20}))return false;s.choices=null;choices();}else return false;return true;}
function specialistsPanel(){const keys=Object.keys(s.specialists).filter(k=>s.specialists[k]&&specialistInfo(k));return `<details class="history-panel" data-panel="specialists"><summary>Settlement specialists · ${keys.length}/3 rescued</summary><p class="muted">Rescue at wave 10 or the boss. Extract to bring them home.</p><div class="grid specialist-grid">${keys.map(k=>{const x=specialistInfo(k),disabled=battle||s.offlineQueue||(k==='blacksmith'?s.buildings.workshop||!canAfford({wood:300,stone:250,gold:150}):k==='quartermaster'?s.quartermasterRun===s.expeditions||s.food+25>cap('food')||s.gold<20:s.gold<20);return `<section class="card"><div class="specialist-portrait">${sprite(k==='blacksmith'?'Miner':k==='quartermaster'?'Farmer':'Archer')}</div><h3>${x.name}</h3><span class="badge">${x.role}</span><p>${x.help}</p>${btn(k==='blacksmith'?s.buildings.workshop?'Workshop ready':'Build workshop · 300 wood · 250 stone · 150 gold':k==='quartermaster'?'Buy 25 food · 20 gold':'Survey routes · 20 gold','specialist:'+k,disabled)}</section>`;}).join('')||'<p class="muted">No specialists yet. Look for captives deeper in the dungeon.</p>'}</div></details>`;}
function rewardWave(){
 clearCombatEffects();battle.clearedWave=battle.wave;rescueSpecialist(battle);
 const m=(battle.d+1)*(battle.modifier==='double'?2:1)*pathInfo(battle.path).loot,hunter=1+s.talents.treasure*.05,quantity=battle.modifier==='double'?2:1,focus=battle.focus||'balanced';battle.loot.gold+=Math.floor(m*(4+Math.floor(Math.random()*6))*hunter*(focus==='gold'?1.6:1));for(const k of ['wood','stone','food'])battle.loot[k]+=Math.floor(m*2*hunter);
 for(const[k,prob]of Object.entries({iron:.08,rivets:.06,leather:.05,essence:.025}))if(Math.random()<Math.min(.35,(prob+battle.d*.01)*hunter*(focus==='materials'?2:1)*(familyInfo(battle).material===k?1.5:1)*(battle.path==='material'&&familyInfo(battle).material===k?1.75:1)))battle.loot[k]+=quantity;
 if(Math.random()<(.015+battle.d*.005)*hunter*(focus==='materials'?1.5:1))battle.loot.blueprints+=quantity;
 if(battle.wave%5===0&&Math.random()<Math.min(.18,(.08+battle.d*.02)*hunter*(focus==='equipment'?1.75:1))){const roll=Math.random(),slot=roll<.3?'weapon':roll<.45?'body':SLOTS[Math.floor(Math.random()*SLOTS.length)].key,rarityRoll=Math.random(),rarity=battle.d===0?(rarityRoll<.8?'common':rarityRoll<.98?'uncommon':'rare'):battle.d===1?(rarityRoll<.45?'common':rarityRoll<.85?'uncommon':rarityRoll<.99?'rare':'epic'):(rarityRoll<.5?'uncommon':rarityRoll<.9?'rare':rarityRoll<.99?'epic':'legendary'),item={id:'gear-'+s.nextItemId++,slot,tier:1+battle.d,upgrade:0,rarity,variant:slot==='weapon'?Object.keys(WEAPON_POOL)[Math.floor(Math.random()*Object.keys(WEAPON_POOL).length)]:'balanced'};battle.loot.equipment.push({...item});if(!estimating)notifyLoot(item,battle.wave);battleEvent('Rare equipment found: '+gearItem(slot,item.tier,0,item.variant||"balanced").name+'.');}battleEvent('Wave cleared. Rewards added to unsecured spoils.');
 if(battle.wave===15){finish(true);return;}
 if(battle.wave%5===0){battle.checkpoint=true;battle.phase='checkpoint';battle.pendingPath='safe';}
 else{battle.phase='between';battle.nextAt=battle.beat+2;}
}
function updateBattle(){if(!estimating){save();render();}}
function continueBattle(path=null){if(!battle?.checkpoint)return false;const selected=path||battle.pendingPath||'balanced';if(!['balanced','safe',battle.wave===5?'rich':'material'].includes(selected))return false;clearCombatEffects();battle.path=selected;battle.pendingPath=null;battle.checkpoint=false;battle.wave++;for(const u of battle.allies)if(u.hp>0)u.hp=Math.min(u.maxHp,u.hp+Math.round(u.maxHp*.2));spawnWave();return true;}
function tickBattle(){
 if(!battle||battle.checkpoint||battle.result||(!estimating&&(document.hidden||resetting)))return;ensureBattle();const hs=heroStats(battle.objective!=="solo"),hero=battle.allies[0];hero.attack=hs.attack;hero.defense=hs.defense;hero.crit=hs.crit;hero.evade=hs.evade;hero.leech=hs.leech;hero.maxHp=hs.health;hero.hp=Math.min(hero.hp,hero.maxHp);battle.beat++;
 if(battle.phase==='between'){if(battle.beat>=battle.nextAt){battle.wave++;spawnWave();}updateBattle();return;}
 for(const unit of battle.allies.filter(u=>u.hp>0)){
  if(unit.role!=='Hero'&&battle.beat%2!==0)continue;
  if(unit.role==='Healer'&&battle.beat%2===0){const injured=battle.allies.filter(u=>u.hp>0&&u.hp<u.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(injured){healUnit(unit,injured,3+Math.floor(s.recruits[unit.index].level/4)+(s.recruits[unit.index].level>=5?1:0));continue;}}
  let swings=1;if(unit.role==='Hero'){unit.actionCharge=(unit.actionCharge??.25)+1+hs.speed;swings=Math.min(2,Math.floor(unit.actionCharge+1e-8));unit.actionCharge-=swings;}
  for(let swing=0;swing<swings;swing++){const target=(unit.role==='Archer'?battle.enemies.find(u=>u.hp>0&&u.role==='Healer'):null)||battle.enemies.find(u=>u.hp>0);if(target)hit(unit,target);}
 }
 if(battle.enemies.every(u=>u.hp<=0)){rewardWave();if(battle){updateBattle();}return;}
 for(const unit of battle.enemies.filter(u=>u.hp>0)){
  if(unit.role==='Healer'&&battle.beat%3===0){const injured=battle.enemies.filter(u=>u.hp>0&&u.hp<u.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(injured){healUnit(unit,injured,3+battle.d);continue;}}const alive=battle.allies.filter(u=>u.hp>0);const target=unit.role==='Archer'?alive[alive.length-1]:alive.find(u=>u.role==='Hero')||alive[0];if(target)hit(unit,target);
  if(battle.allies[0].hp<=0){finish(false);return;}
 }
 updateBattle();
}
function settings(confirm=false){
 const d=$('#settings');d.innerHTML=confirm?`<div class="eyebrow">Start over</div><h2>Reset your progress?</h2><p class="muted">This clears your hero, settlement, items, recruits, dungeon progress, debt, prestige, talents, and lifetime history${email?' from this account’s server save':''}. Your account remains.</p><label for="reset-word">Type RESET to confirm</label><input id="reset-word" placeholder="RESET" autocomplete="off"><p id="reset-error" class="muted"></p><div class="row">${btn('Cancel','settings')}${btn('Reset progress','reset-confirm',true)}</div>`:`<div class="row"><h2>Save settings</h2>${btn('Close','close')}</div><p class="muted">${email?'Your progress is saved to your account.':'Your progress is saved in this browser.'}</p>${btn('Export save for Godot','export-save')}<div class="reset-section"><h3>Start a new adventure</h3><p class="muted">Clear your progress and return to the beginning.</p>${btn('Reset save…','reset-prompt')}</div>`;if(!d.open)d.showModal();

async function resetSave(){
 if($('#reset-word')?.value!=='RESET'||resetting)return;resetting=true;for(const b of $('#settings').querySelectorAll('button'))b.disabled=true;$('#settings [data-action="reset-confirm"]').textContent='Resetting…';
 const fresh=initial();try{if(email){await syncPromise;const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:fresh})});if(!r.ok)throw new Error('The account save could not be reset. Please try again.');}
 s=fresh;battle=null;selectedSlot=null;tab='Settlement';riskCache.clear();for(const k of Object.keys(openPanels))delete openPanels[k];resetting=false;save();$('#settings').close();render();journal();
 }catch(e){resetting=false;$('#reset-error').textContent=e.message;for(const b of $('#settings').querySelectorAll('button'))b.disabled=false;$('#settings [data-action="reset-confirm"]').textContent='Reset progress';}

if(a==='prestige-confirm'){ok=doPrestige();if(ok){$('#prestige').close();tab='Settlement';save();render();return;}}
if(s.offlineQueue&&['upgrade','craft','recruit','revive','enter'].includes(a)){log('Your expedition is away. Wait for its return before changing the team.');render();return;}
if(a==='objective'&&['none','solo','elite','safe'].includes(k)&&!battle&&!s.offlineQueue)s.objective=k;
if(a==='specialist')ok=specialistService(k);
if(a==='dismiss'){const item=s.equipmentBag[Number(k)];if(item)item.newFind=false;save();render();return;}if(a==='salvage')return salvagePrompt(Number(k));if(a==='salvage-confirm'){if(salvageItem(s.equipmentBag.indexOf(salvageTarget))){$('#salvage').close();save();render();if($('#inventory').open)inventory(false);}return;}if(a==='equip'){if(!equipItem(Number(k)))return;save();render();if($('#inventory').open)inventory(false);return;}if(a==='export-save'){const url=URL.createObjectURL(new Blob([JSON.stringify({...s,activeBattle:battle})],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='gravehold-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}if(a==='settings')return settings();if(a==='reset-prompt')return settings(true);if(a==='reset-confirm')return resetSave();if(a==='inventory')return inventory();if(a==='slot'){selectedSlot=k;render();return;}if(a==='journal')return journal();if(a==='account')return account();if(a==='close'){el.closest('dialog').close();return}
if(a==='login'||a==='register'){const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const v=await r.json();if(!r.ok){$('#auth-error').textContent=v.error;return}email=v.email;if(v.state){s=migrate(v.state);battle=s.activeBattle||null;}else save();save();$('#account').close();render();return}
if(a==='google'){location.href='/auth/google';return}
if(a==='logout'){await fetch('/api/logout',{method:'POST'});email=null;$('#account').close();render();return}
if(a==='gather'&&!s.gather)s.gather={kind:k,end:Date.now()+8000,amount:gatherYield(k)};if(a==='collect')collectGather();
if(a==='build'){ok=pay({wood:20,stone:10});if(ok){s.buildings[k]=1;log('Built a production site. Dungeon gates are now open.')}}
if(a==='worker'){ok=pay({food:15,wood:20});if(ok)s.workers[k]={xp:0}}
if(a==='train'){ok=pay({[k]:30+Math.floor(s.workers[k].xp/300)*15});if(ok)s.workers[k].xp+=300}
if(a==='storage'){ok=pay(storageCost(k));if(ok)s.buildings[k+'Storage']=(s.buildings[k+'Storage']||0)+1;}
if(a==='focus'&&['balanced','gold','materials','equipment'].includes(k)&&!battle&&!s.offlineQueue)s.rewardFocus=k;
if(a==='barracks')ok=buildBarracks();
if(a==='recruit')ok=hireRecruit(k);
if(a==='revive')ok=reviveRecruit(Number(k));
if(a==='upgrade'){const c=upgradeCost(k);ok=s.gear[k]>=0&&s.items.iron>=c.iron&&pay({gold:c.gold});if(ok){s.items.iron-=c.iron;s.gearUpgrades[k]++;}}
if(a==='craft'){const c=forgeCost(k);ok=canCraft(k);if(ok){s.blueprints--;for(const[key,v]of Object.entries(c)){if(key==='gold')s.gold-=v;else s.items[key]-=v;}s.gear[k]=Math.max(1,s.gear[k]+1);s.gearUpgrades[k]=0;log('Forged '+gearItem(k).name+'.');}}
if(a==='hero')ok=reviveHero();
if(a==='loan'){ok=reviveHero(true);if(ok)log('Emergency loan secured. The hero has been revived.');}
if(a==='recover'&&!s.infirmaryPatient&&s.heroDead&&!s.recover)s.recover=Date.now()+300000;
if(a==='repay'){const amount=Math.min(10,s.gold,s.debt+s.interest),i=Math.min(amount,s.interest);s.gold-=amount;s.interest-=i;s.debt=Math.max(0,s.debt-(amount-i));}
if(a==='enter'&&!s.heroDead&&!s.offlineQueue&&!s.infirmaryPatient){startBattle({...s.choices[Number(k)],focus:s.rewardFocus,objective:s.objective});}
if(a==='path')ok=choosePath(k);if(a==='extract'&&battle?.checkpoint)return finish(true);if(a==='continue'&&battle?.checkpoint)continueBattle();
if(!ok)log('Not enough resources yet. Gather, work, or return with dungeon loot.');save();render();});
document.addEventListener('change',e=>{if(e.target.id==='tutorials-off'){s.tutorialsDisabled=e.target.checked;save();}});
document.addEventListener('input',e=>{if(e.target.id==='reset-word')$('#settings [data-action="reset-confirm"]').disabled=e.target.value!=='RESET'||resetting;});
async function boot(){try{if(!standalone){const r=await fetch('/api/me');if(r.ok){const v=await r.json();email=v.email;if(v.state){s=migrate(v.state);battle=s.activeBattle||null;if(battle)tab='Expeditions';}}}}catch{}render();if(!s.tutorialsDisabled&&!s.seen.includes(tab))journal();}
setInterval(()=>{if(!document.hidden){render();save()}},1000);setInterval(tickBattle,650);boot();

</script>
</body>
