:root{color-scheme:dark;--bg:#101716;--panel:#19221f;--panel-high:#222d27;--line:#36433a;--gold:#d6bb83;--muted:#a2b0a3;--ink:#eee9d9;--green:#9bbd92;--red:#df9c85;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;font-size:14px;line-height:1.45}button,input{font:inherit}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#2c372c;border:1px solid #55614a;border-radius:6px;padding:10px 14px;color:var(--ink);cursor:pointer;min-height:40px;transition:background .15s ease,color .15s ease}button:hover{background:#3c4937;border-color:#a28e61}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:4px}input{width:100%;padding:12px;margin:8px 0;background:#101916;border:1px solid var(--line);color:var(--ink);border-radius:6px;caret-color:var(--gold)}::selection{background:#665a3d;color:#fff5db}*{scrollbar-width:thin;scrollbar-color:#58624d #141c18}
h1,h2,h3,.brand{font-family:'Cinzel',Georgia,serif;font-weight:600;text-wrap:balance}h1{font-size:28px;line-height:1.2;margin:0}h2{font-size:23px;margin:0 0 12px}h3{font-size:18px;margin:0 0 8px}h4{font-size:14px;margin:18px 0 8px}p{margin:10px 0;max-width:72ch}small{font-size:12px}.ui-icon{display:inline-block;flex:none;vertical-align:middle}button>.ui-icon{pointer-events:none}.muted{color:var(--muted)}.gold{color:var(--gold)}.gain{color:var(--green)}.loss{color:var(--red)}.eyebrow{display:none}.badge{font-size:10px;font-weight:600;color:var(--gold);letter-spacing:.07em;text-transform:uppercase}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.icon{display:inline-flex;color:var(--gold)}
.layout{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:100vh}aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:#121b17;padding:30px 14px;display:flex;flex-direction:column;min-width:0}.brand{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--gold);font-size:18px;letter-spacing:.09em}.brand>.ui-icon{color:#bea06c}.subtitle{display:none}nav{display:grid;gap:8px;margin-top:44px}nav button{width:100%;background:transparent;border:0;justify-content:flex-start;padding:13px 12px;font-size:14px;color:#bbc3b5}nav button .ui-icon{color:#89967e}nav button:hover{background:#202c22}nav button.active{background:#30382b;color:#efdba8}nav button.active .ui-icon{color:#d6bb83}.live-dot{height:6px;width:6px;background:#c7b77e;border-radius:50%;margin-left:auto}.rail-footer{margin-top:auto;display:flex;align-items:center;flex-direction:column;gap:12px;font-size:11px;color:#8b9e8c}.rail-footer .ui-icon{color:#617360}main{min-width:0;width:100%;max-width:1690px;padding:22px 30px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}.resources{display:flex;gap:28px;min-width:0}.resource{position:relative;display:flex;align-items:center;gap:10px;cursor:help;font-variant-numeric:tabular-nums}.resource>.ui-icon{color:var(--gold)}.resource>div>span{font-size:16px;font-weight:600;white-space:nowrap}.resource em{font-style:normal;font-size:12px;color:var(--muted);font-weight:400}.resource small{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap}.resource-tip{display:none;position:absolute;left:0;top:calc(100% + 12px);width:250px;background:#26342b;border:1px solid #7c8767;padding:14px;border-radius:8px;color:#e2e5d6;font-size:12px;line-height:1.5;z-index:30;box-shadow:0 8px 24px #0006}.resource:hover .resource-tip,.resource:focus .resource-tip{display:block}.toolbar{display:flex;align-items:center;gap:7px;flex:none}.icon-button{width:38px;padding:8px;min-height:38px;background:transparent;border-color:var(--line);color:#b7c3ac}.combat-score-button{gap:6px;color:var(--gold);padding:8px 10px;min-height:38px;background:#293126;margin-right:5px}.combat-score-button small{font-size:9px;color:#b9c2ae}.intro{margin:26px 0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.page-status{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}.card p{color:var(--muted);font-size:13px}.card button{margin:6px 5px 0 0}.card>.row{margin-bottom:12px}.card .icon{margin-bottom:10px}.bar{height:5px;background:#303d31;overflow:hidden;border-radius:2px;margin:10px 0}.bar>span{height:100%;display:block;background:#b8ad75}.notice{padding:13px 16px;background:#2c3325;color:#d7d7b8;border:1px solid #525c3f;border-radius:8px;margin:14px 0;font-size:12px}.action-reason{display:block;color:#cab997;font-size:11px;margin:6px 0 0;overflow-wrap:anywhere}.effect-preview{display:block;color:#b0c6a1;font-size:11px;margin:7px 0}.history-panel,.queue-panel{background:#18231e;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}.history-panel>summary,.queue-panel>summary{font-size:12px;color:#d7c39b}summary{cursor:pointer;color:#c6bc9d;font-size:12px;min-height:20px}summary>.ui-icon{margin-right:6px}details[open]>summary{margin-bottom:14px}details p{font-size:12px;color:var(--muted)}.history-panel .card{border:0;background:transparent;padding:10px 0}.history-panel .grid{gap:20px}.history-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px 0}.history-stats>span{font-size:11px;color:var(--muted)}.history-stats strong{display:block;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums;margin-top:3px}.capacity-warnings{display:flex;gap:8px;flex-wrap:wrap}.capacity-warning{background:#302c20;color:#e0c48b;border-radius:6px;padding:8px 12px;font-size:11px;margin-top:10px;display:flex;align-items:center;gap:7px}.capacity-warning>span{color:#c3bb9e}.goal-resources{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.goal-resources>div{min-width:90px;flex:1}.goal-resources strong{display:block}.goal-resources .bar{height:4px}.campaign-link{display:grid;grid-template-columns:1fr 1fr;gap <script type="module">
const standalone=location.protocol==='file:';
const $=s=>document.querySelector(s);
const SLOTS=[
 {key:'head',label:'Head',icon:'♜',row:1,col:2,stat:'defense'},
 {key:'cape',label:'Cape',icon:'⚑',row:2,col:1,stat:'health'},
 {key:'neck',label:'Neck',icon:'◇',row:2,col:2,stat:'attack'},
 {key:'weapon',label:'Weapon',icon:'⚔',row:3,col:1,stat:'attack'},
 {key:'body',label:'Body',icon:'▣',row:3,col:2,stat:'defense'},
 {key:'shield',label:'Shield',icon:'◈',row:3,col:3,stat:'defense'},
 {key:'legs',label:'Legs',icon:'Ⅱ',row:4,col:2,stat:'defense'},
 {key:'hands',label:'Hands',icon:'✥',row:5,col:1,stat:'attack'},
 {key:'feet',label:'Feet',icon:'♟',row:5,col:2,stat:'health'},
 {key:'ring',label:'Ring',icon:'○',row:5,col:3,stat:'attack'}
];
const MATERIALS={iron:{name:'Iron fragments',icon:'◆'},rivets:{name:'Binding rivets',icon:'✣'},leather:{name:'Worn leather',icon:'▧'},essence:{name:'Grave essence',icon:'✧'}};
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let resetting=false,syncPromise=Promise.resolve();const openPanels={};
let estimating=false;const riskCache=new Map();
let selectedSlot=null;
const RARITIES={common:{label:'Common',gold:20,iron:1},uncommon:{label:'Uncommon',gold:50,iron:2,rivets:1},rare:{label:'Rare',gold:120,iron:4,rivets:2,essence:1},epic:{label:'Epic',gold:250,iron:8,rivets:4,essence:2},legendary:{label:'Legendary',gold:600,iron:15,rivets:8,essence:5}};
const defaultRarity=tier=>['common','common','uncommon','rare','epic','legendary'][Math.min(5,Math.max(0,tier))];
let salvageTarget=null;
// Weapon identities survive equipping, upgrading, forging, saving, and salvage.
const WEAPON_POOL={balanced:{name:'blade',style:'Balanced',attack:1,speed:0,help:'Reliable damage on every combat beat.'},swift:{name:'dirk',style:'Swift',attack:.74,speed:.35,help:'Smaller strikes; 35% faster attacks.'},heavy:{name:'war maul',style:'Heavy',attack:1.33,speed:-.25,help:'Harder strikes; 25% slower attacks.'},warden:{name:'guard spear',style:'Guardian',attack:.8,speed:0,help:'Trades damage for defense.'},blood:{name:'blood sickle',style:'Bloodbound',attack:.8,speed:0,help:'Trades damage for a little life steal.'},precise:{name:'dueling sabre',style:'Precise',attack:.9,speed:0,help:'Trades damage for critical chance.'}};
const INFIRMARY_STAGES=[{name:'Clear the foundations',seconds:60,cost:{wood:300,stone:250,food:100,gold:100,iron:3,rivets:2}},{name:'Restore the ward',seconds:120,cost:{wood:800,stone:700,food:500,gold:300,iron:12,rivets:6,leather:4}},{name:'Stock the recovery room',seconds:180,cost:{wood:1200,stone:1000,food:900,gold:600,iron:20,rivets:12,leather:8,essence:3}}];
function projectAffordable(cost){return Object.entries(cost).every(([key,amount])=>(key in MATERIALS?s.items[key]:s[key])>=amount);}
function startInfirmaryProject(){const p=s.projects.infirmary,stage=INFIRMARY_STAGES[p.stage];if(!stage||p.until||!s.buildings.barracks||!projectAffordable(stage.cost))return false;for(const[key,amount]of Object.entries(stage.cost)){if(key in MATERIALS)s.items[key]-=amount;else s[key]-=amount;}p.until=Date.now()+stage.seconds*1000;log('Infirmary project: '+stage.name+'.');return true;}
function infirmaryReady(){return s.projects.infirmary.stage>=INFIRMARY_STAGES.length;}
function patientName(target){return target==='hero'?'Your hero':s.recruits[target]?.name||s.recruits[target]?.cls||'Companion';}
function patientDead(target){return target==='hero'?s.heroDead:!!s.recruits[target]?.dead;}
function queueHas(target){return s.infirmaryPatient?.target===target||s.recoveryQueue.includes(target);}
function admitPatient(target){target=target==='hero'?'hero':Number(target);if(!infirmaryReady()||battle||s.offlineQueue||!patientDead(target)||queueHas(target))return false;if(s.infirmaryPatient)s.recoveryQueue.push(target);else{s.infirmaryPatient={target,until:Date.now()+60000};if(target==='hero')s.recover=0;}log(patientName(target)+' enters the recovery queue.');return true;}
function queueFallen(){let added=false;for(const target of ['hero',...s.recruits.map((r,i)=>i)])if(patientDead(target)&&!queueHas(target))added=admitPatient(target)||added;return added;}
function completePatient(target){if(!patientDead(target))return;if(target==='hero'){s.heroDead=false;s.recover=0;s.heroRevives++;}else{const r=s.recruits[target];r.dead=false;r.revives=(r.revives||0)+1;}riskCache.clear();log(patientName(target)+' recovered in the infirmary.');}
function startNextPatient(at=Date.now()){s.infirmaryPatient=null;while(s.recoveryQueue.length){const target=s.recoveryQueue.shift();if(patientDead(target)){s.infirmaryPatient={target,until:at+60000};if(target==='hero')s.recover=0;break;}}}
function reorderRecovery(index,direction){const next=index+direction;if(!Number.isInteger(index)||![-1,1].includes(direction)||index<0||next<0||index>=s.recoveryQueue.length||next>=s.recoveryQueue.length)return false;[s.recoveryQueue[index],s.recoveryQueue[next]]=[s.recoveryQueue[next],s.recoveryQueue[index]];return true;}
function rushCost(){const p=s.infirmaryPatient;if(!p)return {};const base=reviveCost(p.target==='hero'?null:s.recruits[p.target]),fraction=Math.max(0,Math.min(1,(p.until-Date.now())/60000));return {gold:Math.ceil(base.gold*fraction),food:Math.ceil(base.food*fraction)};}
function rushRecovery(){if(!s.infirmaryPatient||battle||s.offlineQueue||!pay(rushCost()))return false;completePatient(s.infirmaryPatient.target);startNextPatient();return true;}
function settleInfirmary(){const p=s.projects.infirmary;if(p.until&&Date.now()>=p.until){p.stage++;p.until=0;log(p.stage===3?'Infirmary restored. Free one-minute revivals are available.':'Infirmary phase completed. The next phase is ready.');}if(battle||s.offlineQueue)return;if(!s.infirmaryPatient&&s.recoveryQueue.length)startNextPatient();for(let i=0;i<4&&s.infirmaryPatient&&Date.now()>=s.infirmaryPatient.until;i++){const end=s.infirmaryPatient.until;completePatient(s.infirmaryPatient.target);startNextPatient(end);}}
function patientPanel(){const p=s.infirmaryPatient;return !p?'':`<details class="history-panel" data-panel="recovery-queue"><summary>Infirmary · ${escapeHtml(patientName(p.target))} · ${Math.max(0,Math.ceil((p.until-Date.now())/1000))}s · ${s.recoveryQueue.length} waiting</summary><p>One bed · 60s each · runs offline.</p>${btn('Finish early · '+costText(rushCost()),'rush',!canAfford(rushCost()))}${s.recoveryQueue.map((target,i)=>`<div class="row"><span>${i+1}. ${escapeHtml(patientName(target))}</span><div>${btn('↑','reorder:'+i+':-1',i===0)}${btn('↓','reorder:'+i+':1',i===s.recoveryQueue.length-1)}</div></div>`).join('')}<small>Reorder waiting patients.</small></details>`;}
function freeRevivalButton(target){const id=target==='hero'?'hero':Number(target);return infirmaryReady()?btn(queueHas(id)?'Already in recovery queue':s.infirmaryPatient?'Queue recovery · 1 min':'Free infirmary revival · 1 min','infirmary:'+target,queueHas(id)||!!battle||!!s.offlineQueue):'<small class="muted">Restore the infirmary in Settlement to unlock free one-minute revival.</small>';}
function projectsPanel(){const p=s.projects.infirmary,stage=INFIRMARY_STAGES[p.stage];return `<details class="history-panel" data-panel="settlement-projects"><summary>Settlement projects · Infirmary ${infirmaryReady()?'ready':p.stage+'/3 phases'}</summary><section class="card"><span class="badge">LONG-TERM SETTLEMENT PROJECT</span><h3>Restore the infirmary</h3>${btn('Track this project','pin:infirmary')}<p>One bed. Free recovery in 60s; pay to finish early.</p>${!s.buildings.barracks?'<p class="muted">Requires barracks.</p>':''}${stage?`<h4>${p.stage+1}. ${stage.name}</h4><p>${costMarkup(stage.cost)}</p><small>${stage.seconds/60} minute construction · ${p.stage+1===3?'Unlocks free one-minute revivals':'Unlocks the next construction phase'}</small>${p.until?`<p class="gold">Construction · ${Math.max(0,Math.ceil((p.until-Date.now())/1000))}s remaining</p>`:btn('Fund this phase','project:infirmary',!s.buildings.barracks||!projectAffordable(stage.cost))}`:'<p class="gold">✓ Fully restored · one recovery bed</p>'+(!s.infirmaryPatient?`${s.heroDead?freeRevivalButton('hero'):''}${s.recruits.map((r,i)=>r.dead?`<p>${escapeHtml(r.name||r.cls)} ${freeRevivalButton(i)}</p>`:'').join('')}`:'')}</section></details>`;}
// Shared campaign goals connect prices, farm preparation, loot, and the workshop.
function itemUpgradeCost(item){const n=item.upgrade||0,t=Math.max(0,item.tier);return {gold:Math.ceil((150+t*50+n*100+n*n*25)*(s.buildings.workshop?.9:1)),iron:8+t*2+n*4};}
function pinSpare(index){const item=s.equipmentBag[index];if(!item)return false;item.id??='gear-'+s.nextItemId++;s.pinnedGoal={kind:'spare-upgrade',itemId:item.id,slot:item.slot};return true;}
function heldResource(key){if(key==='prestigeEssence')return s.meta.essence;return key in MATERIALS?s.items[key]||0:s[key]||0;}
function missingResources(cost){return Object.entries(cost).filter(([key,n])=>heldResource(key)<n).map(([key,n])=>`${Math.ceil(n-heldResource(key))} ${MATERIALS[key]?.name||key}`).join(' · ');}
function quartersPhaseCost(){const c=recruitCost(),stage=s.quarters.stage;return stage===0?{wood:Math.ceil(c.wood/2),stone:Math.ceil(c.stone/2)}:stage===1?{wood:Math.floor(c.wood/2),stone:Math.floor(c.stone/2),food:Math.ceil(c.food/2)}:stage===2?{food:Math.floor(c.food/2)}:{};}
function prepareQuarters(){if(!s.buildings.barracks||s.recruits.length>=3||s.quarters.stage>=3||battle||s.offlineQueue||!pay(quartersPhaseCost()))return false;s.quarters.stage++;log('Recruit quarters: '+s.quarters.stage+'/3 preparation milestones complete.');return true;}
function quartersPanel(){if(s.recruits.length>=3)return '<p class="muted">All three companion quarters are occupied.</p>';const phase=s.quarters.stage,cost=quartersPhaseCost(),total=recruitCost();return `<section class="campaign-link"><div><span class="eyebrow"></span><h3>Quarters ${s.recruits.length+1} · ${phase}/3 prepared</h3><div class="bar"><span style="width:${phase/3*100}%"></span></div><p>${['Build the frame','Stock the quarters','Prepare provisions','Ready to hire'][phase]}</p>${phase<3?resourceProgress(cost)+btn('Prepare next milestone','quarters',!s.buildings.barracks||battle||s.offlineQueue||!canAfford(cost)): '<p class="gold">Prepared · '+total.gold+' gold to hire.</p>'}</div><small class="muted">Total preparation: ${costText({wood:total.wood,stone:total.stone,food:total.food})}. </small></section>`;}
function resourceProgress(cost){return `<div class="goal-resources">${Object.entries(cost).map(([key,n])=>`<div tabindex="0" title="${materialTooltip(key)}"><span>${MATERIALS[key]?.name||key}</span><strong>${Math.min(n,Math.floor(heldResource(key)))}/${n}</strong><div class="bar"><span style="width:${Math.min(100,heldResource(key)/n*100)}%"></span></div></div>`).join('')}</div>`;}
function goalDetails(){const g=s.pinnedGoal;if(!g)return null;if(g.kind==='spare-upgrade'){const item=s.equipmentBag.find(x=>x.id===g.itemId);return item?{name:'Upgrade '+gearItem(item.slot,item.tier,item.upgrade||0,item.variant||'balanced').name,cost:itemUpgradeCost(item),ready:false,equipFirst:true}:null;}if(g.kind==='infirmary'){const phase=INFIRMARY_STAGES[s.projects.infirmary.stage];return phase?{name:'Infirmary: '+phase.name,cost:phase.cost,ready:s.buildings.barracks&&!s.projects.infirmary.until}:null;}if(g.kind==='quarters')return s.recruits.length<3?{name:s.quarters.stage<3?'Next recruit quarters':'Hire your next recruit',cost:s.quarters.stage<3?quartersPhaseCost():{gold:recruitCost().gold},ready:!!s.buildings.barracks}:null;if(['upgrade','craft'].includes(g.kind)&&s.gear[g.slot]>=0)return {name:(g.kind==='craft'?'Forge ':'Upgrade ')+gearItem(g.slot).name,cost:g.kind==='craft'?{...forgeCost(g.slot),blueprints:1}:upgradeCost(g.slot),ready:!battle&&!s.offlineQueue};return null;}
function pinGoal(kind,slot=''){if(!['infirmary','quarters','upgrade','craft'].includes(kind))return false;s.pinnedGoal={kind,slot};return true;}
function goalPanel(){const g=goalDetails();return !g?'':`<details class="history-panel" data-panel="tracked-goal"><summary>Tracked goal · ${escapeHtml(g.name)} ${missingResources(g.cost)?'':'· supplies ready'}</summary>${resourceProgress(g.cost)}<p>${goalRecommendation()}</p>${btn('Unpin goal','unpin')}</details>`;}
function goalRecommendation(){const g=goalDetails();if(g){const material=Object.entries(g.cost).find(([key,n])=>(key in MATERIALS||key==='blueprints')&&heldResource(key)<n);if(material)return `Materials route recommended${Object.values(DUNGEON_FAMILIES).some(f=>f.material===material[0])?' · '+Object.values(DUNGEON_FAMILIES).find(f=>f.material===material[0]).name:''}: ${escapeHtml(g.name)} needs ${Math.ceil(material[1]-heldResource(material[0]))} more ${MATERIALS[material[0]]?.name||material[0]}.`;if(g.cost.gold>s.gold)return `Gold route recommended: ${Math.ceil(g.cost.gold-s.gold)} more gold toward ${escapeHtml(g.name)}.`;if(missingResources(g.cost))return 'Gather and train workers: your goal needs '+missingResources(g.cost)+'.';if(g.equipFirst)return 'Equip the tracked item from Loadout or the workshop before upgrading it.';return g.ready?'Your tracked goal has its supplies. Visit Settlement or the workshop.':'Supplies ready. Finish construction or unlock the required building first.';}if(!infirmaryReady()&&s.buildings.barracks){const stage=INFIRMARY_STAGES[s.projects.infirmary.stage],missing=Object.entries(stage.cost).find(([key,n])=>key in MATERIALS&&heldResource(key)<n);if(missing)return 'Materials route recommended: the infirmary needs '+Math.ceil(missing[1]-heldResource(missing[0]))+' more '+MATERIALS[missing[0]].name+'.';}return 'Choose gold for hiring, materials for projects and upgrades, or equipment to build your loadout.';}
function materialTooltip(key){const family=Object.values(DUNGEON_FAMILIES).find(f=>f.material===key);return (MATERIAL_HELP[key]||RESOURCE_HELP[key]||'Blueprints forge owned equipment to the next tier.')+((key in MATERIALS||key==='blueprints')?` Source: rare, separate dungeon drops.${family?' '+family.name+' favors '+family.label+'.':''} Choose Materials focus for more supplies; stronger dungeons award larger quantities.`:'');}
function costMarkup(cost){return Object.entries(cost).map(([key,n])=>`<span tabindex="0" title="${escapeHtml(materialTooltip(key))}">${uiIcon(key==='prestigeEssence'?'essence':key,13)} ${n} ${MATERIALS[key]?.name||key}</span>`).join(' · ');}
function nextDecision(won){if(!won){if(infirmaryReady())return s.infirmaryPatient?'Your party is queued for free recovery. '+goalRecommendation()+' Review defense and HP before your next descent.':'Queue fallen party members in the infirmary; then review defense and HP in the combat-score breakdown before returning.';const c=reviveCost();if(s.heroDead&&missingResources(c))return 'Gather food and seek gold: hero revival needs '+missingResources(c)+'. Consider an easier dungeon after recovery.';const defensive=SLOTS.find(x=>x.stat==='defense'&&s.gear[x.key]>=0);if(defensive){const missing=missingResources(upgradeCost(defensive.key));return missing?'After recovery, farm supplies for a defense upgrade: '+missing+'.':'After recovery, upgrade '+gearItem(defensive.key).name+' at the workshop or try an easier route.';}return 'After recovery, build worker support (+1 defense and +5 HP) and seek armor on an easier equipment route.';}const goal=goalDetails();if(goal&&!missingResources(goal.cost))return goal.equipFirst?'You have the upgrade supplies; equip your tracked item from the workshop first.':'You now have the supplies for '+goal.name+'.';if(!infirmaryReady()&&s.buildings.barracks&&!s.projects.infirmary.until&&projectAffordable(INFIRMARY_STAGES[s.projects.infirmary.stage].cost))return 'You can fund the next infirmary phase in Settlement.';if(s.quarters.stage===3&&s.recruits.length<3&&s.gold>=recruitCost().gold)return 'Your prepared quarters and dungeon gold can welcome another recruit.';const slot=SLOTS.find(x=>s.gear[x.key]>=0&&projectAffordable(upgradeCost(x.key)));if(slot)return 'You have enough gold and iron to upgrade '+gearItem(slot.key).name+' in the workshop.';if(s.equipmentBag.some(x=>x.newFind!==false))return 'Inspect your finds: equip an improvement, pin an upgrade, or salvage toward your project.';return goalRecommendation();}
function scoreHero(h){const offense=h.attack*(1+h.speed)*(1+.7*h.crit);return offense*2+h.defense*2+h.health*.2/(1-h.evade)+offense*h.leech*3;}
function companionScore(include=true){if(!include)return 0;return s.recruits.filter(r=>!r.dead).reduce((sum,r,i)=>{const u=recruitUnit(r,i);return sum+u.attack*(1+.7*u.crit)+u.maxHp*.04+u.defense*.5+(r.cls==='Healer'?(3+Math.floor(r.level/4)+(r.level>=5?1:0))*.75:0);},0);}
function combatScore(include=s.objective!=='solo'){return s.heroDead?0:Math.round(scoreHero(heroStats(include))+companionScore(include));}
function recommendedScore(c){return Math.round([100,180,260][c.d]*(c.mod||1)*(c.modifier==='elite'?1.25:c.modifier==='wounded'?1.15:1));}
function combatBreakdown(include=s.objective!=='solo'){if(s.heroDead)return [{label:'Hero unavailable: revive to restore combat readiness',value:0}];const original=s,rows=[];try{s=JSON.parse(JSON.stringify(original));s.gear=Object.fromEntries(SLOTS.map(x=>[x.key,-1]));s.workers={};s.meta={...s.meta,prestiges:0};s.talents={...s.talents,warrior:0,survivor:0};s.recruits=[];let prior=0;const add=label=>{const next=scoreHero(heroStats());rows.push({label,value:next-prior});prior=next;};add('Base hero');s.gear=original.gear;add('Equipment: attack, armor, speed, crit, life steal, evasion, mastery & set bonus');s.workers=original.workers;add('Settlement worker bonuses');s.meta=original.meta;s.talents=original.talents;add('Prestige & combat talents');if(include)s.recruits=original.recruits;add('Living recruit passive bonuses');rows.push({label:include?'Companion damage, defense, HP, healing, levels & bonds':'Companions stay home for Lone descent',value:companionScore(include)});}finally{s=original;}const total=combatScore(include);for(const row of rows)row.value=Math.round(row.value);rows[rows.length-1].value+=total-rows.reduce((sum,r)=>sum+r.value,0);return rows;}
function showCombatScore(){const d=$('#combat-score'),include=s.objective!=='solo',h=heroStats(include);d.innerHTML=`<div class="row"><h2>Combat score · ${combatScore()}</h2>${btn('Close','close')}</div><p class="muted">Full-health expedition readiness, not a guaranteed clear. Current battle damage is shown in HP bars. Speed does not multiply base and other-slot damage for free. Loot-only bonuses do not increase score.</p><p>${h.attack} attack per hit · ${((1+h.speed)/.65).toFixed(2)} attacks/sec · ${h.defense} defense · ${h.health} max HP<br>${statText({crit:h.crit,evade:h.evade,leech:h.leech})}</p>${combatBreakdown(include).map(r=>`<div class="row score-row"><span>${r.label}</span><strong>${r.value}</strong></div>`).join('')}<details><summary>Individual equipment contributions</summary>${SLOTS.filter(x=>s.gear[x.key]>=0).map(x=>`<p><strong>${escapeHtml(gearItem(x.key).name)}</strong> · ${statText(gearItem(x.key).stats)}</p>`).join('')||'<p>All equipment slots are empty.</p>'}<p>Three tier-two Gravewarden pieces: ${SLOTS.filter(x=>s.gear[x.key]===2).length>=3?'active +10% HP':'inactive'}.</p></details><details><summary>Settlement and recruit contributions</summary><p>Worker support: ${statText(settlementSupport())}. Prestige: +${s.meta.prestiges*5}% attack and HP. Warrior talent: +${s.talents.warrior*5}% attack. Survivor talent: +${s.talents.survivor*5}% HP.</p>${s.recruits.map((r,i)=>{const u=recruitUnit(r,i);return `<p><strong>${escapeHtml(r.name||r.cls)}</strong> · ${r.dead?'fallen: no contribution':!include?'stays home: no contribution':`${u.attack} attack every other beat · ${u.defense} defense · ${u.maxHp} HP · ${Math.round(u.crit*100)}% crit · ${{Warrior:'+5% hero defense',Archer:'+3% hero crit',Healer:'+5 hero HP and '+(3+Math.floor(r.level/4)+(r.level>=5?1:0))+' healing per cast'}[r.cls]}`}</p>`;}).join('')||'<p>No companions recruited.</p>'}</details><small>Points apply in the order shown, including interactions and caps. Solo objectives exclude companions. Dungeon recommendations summarize full 15-wave completion; simulated clear chance captures enemy-specific risk.</small>`;if(!d.open)d.showModal();}
function workshopPanel(){const slots=SLOTS.filter(x=>s.gear[x.key]>=0);return `<details class="history-panel" data-panel="workshop"><summary>Blacksmith workshop · ${s.buildings.workshop?'10% upgrade gold discount':'equipment planning'}</summary><p class="muted">Upgrade, forge or salvage. Varric’s workshop: −10% upgrade gold.</p><p>${goalDetails()?'Tracked: '+escapeHtml(goalDetails().name):'Pin an upgrade or project to track it.'}</p><div class="workshop-items">${slots.map(x=>`<div class="row"><span>${equipmentIcon(x.key,s.gear[x.key],s.gearRarities[x.key])}${escapeHtml(gearItem(x.key).name)}</span><div>${btn('Inspect & improve','workshop-slot:'+x.key)}${btn('Track upgrade','pin:upgrade:'+x.key)}${btn('Track forge','pin:craft:'+x.key)}</div></div>`).join('')||'<p>No equipped gear yet. Find equipment at five-wave milestones.</p>'}</div><h4>Spare equipment</h4>${equipmentList(s.equipmentBag,true)}<small>Salvage spares for crafting supplies.</small></details>`;}
function blockedReason(action){const parts=action.split(':'),key=parts[1],busy=battle?'Finish or extract from the current expedition.':s.offlineQueue?'Your party is away on an expedition.':'';let cost=null;if(['equip','salvage','upgrade','craft','recruit','quarters','infirmary'].includes(parts[0])&&busy)return busy;switch(parts[0]){case 'build':cost={wood:20,stone:10};break;case 'worker':cost={wood:20,food:15};break;case 'train':cost=actionCost(action);break;case 'talent':if(s.talents[key]>=5)return 'Maximum talent rank reached.';cost=actionCost(action);break;case 'storage':cost=storageCost(key);break;case 'barracks':if(!barracksReady())return 'Requires all three worker professions and dungeon wave five.';cost=BARRACKS_COST;break;case 'project':if(!s.buildings.barracks)return 'Requires barracks.';if(s.projects.infirmary.until)return 'Construction is already underway.';cost=INFIRMARY_STAGES[s.projects.infirmary.stage]?.cost;break;case 'quarters':if(!s.buildings.barracks)return 'Requires barracks.';if(s.recruits.length>=3)return 'All three quarters occupied.';cost=quartersPhaseCost();break;case 'recruit':if(!s.buildings.barracks)return 'Requires barracks.';if(s.recruits.length>=3)return 'Expedition is full: three recruits maximum.';if(s.quarters.stage<3)return 'Prepare the next recruit quarters: '+s.quarters.stage+'/3 milestones.';cost={gold:recruitCost().gold};break;case 'upgrade':cost=upgradeCost(key);break;case 'craft':cost={...forgeCost(key),blueprints:1};break;case 'queue-fallen':return ['hero',...s.recruits.map((r,i)=>i)].some(patientDead)?'All fallen party members are already being treated or queued.':'No fallen party members need recovery.';case 'repay':return s.debt+s.interest<=0?'No outstanding loan.':'Earn dungeon gold or salvage equipment to repay debt.';case 'recover':return s.infirmaryPatient?'Recovery bed occupied. Your hero is in the recovery queue.':s.recover?'Recovery is already underway.':'Requires a fallen hero.';case 'reorder':return 'This patient is already at that end of the waiting queue.';case 'infirmary':if(!infirmaryReady())return 'Restore all three infirmary phases first.';return 'Already being treated or queued, or this character is alive.';case 'rush':cost=rushCost();break;case 'hero':case 'loan':if(!s.heroDead)return 'Your hero is already alive.';if(s.infirmaryPatient)return 'Recovery bed occupied. Use Finish early for the current patient.';if(parts[0]==='loan'&&s.debt+s.interest>0)return 'Repay the outstanding loan before borrowing again.';cost=reviveCost();break;case 'revive':if(s.infirmaryPatient)return 'Recovery bed occupied. Use Finish early for the current patient.';cost=reviveCost(s.recruits[Number(key)]);break;case 'enter':case 'queue':case 'queue3':if(s.heroDead)return 'Your hero requires revival.';if(s.infirmaryPatient)return 'Recovery bed occupied: finish treatment before departure.';if(busy)return busy;break;case 'foreman':if(Object.keys(s.workers).length<3)return 'Hire all three worker professions first.';cost={wood:300,stone:200,food:250};break;}return cost&&missingResources(cost)?'Missing '+missingResources(cost)+'.':'Requirements not met yet.';}
function migrate(state){
 state.gearMastery??={weapon:0};state.gearMastery.weapon=Math.min(300,Math.max(0,Number(state.gearMastery.weapon)||0));state.nextItemId??=1;state.recoveryQueue??=[];state.quarters??={stage:0};state.pinnedGoal??=null;
 state.projects??={};state.projects.infirmary??={stage:0,until:0};state.infirmaryPatient??=null;state.gearVariants??={};
 state.specialists??={};state.objective??='none';state.quartermasterRun??=-1;state.objectivesCompleted??=0;state.meta??={prestiges:0,essence:0};state.talents??={warrior:0,survivor:0,treasure:0};state.history??={runs:state.expeditions||0,best:state.lastExpedition?.wave||0,bosses:0,gold:0,recent:[]};state.cycleBosses??=state.history.bosses;state.clearedDungeons??={};state.offlineQueue??=null;state.foreman??=false;state.tutorialsDisabled??=false;state.lootAlert??=null;state.heroRevives??=0;state.gatherCounts??={};state.gearRarities??={};state.gear??={};state.gearUpgrades??={};
 if(state.gear.armor!==undefined){state.gear.body=state.gear.armor;state.gearUpgrades.body=state.gearUpgrades.armor||0;delete state.gear.armor;delete state.gearUpgrades.armor;}
 for(const slot of SLOTS){state.gear[slot.key]??=-1;state.gearUpgrades[slot.key]??=0;state.gearRarities[slot.key]??=defaultRarity(state.gear[slot.key]);state.gearVariants[slot.key]=WEAPON_POOL[state.gearVariants[slot.key]]?state.gearVariants[slot.key]:'balanced';}
 state.equipmentBag??=[];state.lastExpedition??=null;for(const [i,r] of state.recruits.entries()){r.revives??=0;r.name??=recruitName(r.cls,i);r.loyalty??=0;}state.rewardFocus??='balanced';for(const x of state.equipmentBag){x.rarity??=defaultRarity(x.tier);x.id??="gear-"+state.nextItemId++;x.masteryXP=Math.min(300,Math.max(0,Number(x.masteryXP)||0));x.newFind??=true;x.variant=WEAPON_POOL[x.variant]?x.variant:'balanced';}state.items??={};for(const k of Object.keys(MATERIALS))state.items[k]??=0;
 return state;
}
const DUNGEON_FAMILIES={crypt:{name:'Crypt',material:'iron',label:'Iron',names:['Hollow Crypt','Forgotten Tomb','Black Ossuary']},keep:{name:'Ruined keep',material:'rivets',label:'Rivets',names:['Widow’s Keep','Cinder Fortress','Fallen Citadel']},woods:{name:'Haunted woods',material:'leather',label:'Leather',names:['Whispering Grove','Widow’s Thicket','Hollowwood']}};
function familyInfo(c){return DUNGEON_FAMILIES[c?.family]||(/keep|fortress|citadel/i.test(c?.name||'')?DUNGEON_FAMILIES.keep:/wood|grove|thicket|forest/i.test(c?.name||'')?DUNGEON_FAMILIES.woods:DUNGEON_FAMILIES.crypt);}
function pathInfo(key){return {balanced:{name:'Standard path',enemy:1,loot:1},safe:{name:'Sheltered path',enemy:.85,loot:.85},rich:{name:'Plunder path',enemy:1.1,loot:1.2},material:{name:familyInfo(battle).label+' trail',enemy:1.05,loot:1}}[key]||{name:'Standard path',enemy:1,loot:1};}
function choosePath(key){if(!battle?.checkpoint||!['safe',battle.wave===5?'rich':'material'].includes(key))return false;battle.pendingPath=key;return true;}
function masteryBonus(xp=s.gearMastery.weapon||0){return Math.min(3,Math.floor(Math.max(0,xp)/100))*.01;}
function replacementMastery(item,current=s.gearMastery.weapon||0){return Math.min(300,Math.max(item.masteryXP||0,Math.min(150,Math.floor(current/2))));}
function timeLabel(seconds){if(!Number.isFinite(seconds))return 'No worker income';if(seconds<=0)return 'Full';if(seconds<60)return Math.ceil(seconds)+'s';if(seconds<3600)return Math.ceil(seconds/60)+'m';return (seconds/3600).toFixed(1)+'h';}
function storageProjection(k,hours=8){const rate=incomeRate(k),space=Math.max(0,cap(k)-s[k]),production=rate*.5*hours*3600;return {fillsIn:rate>0?space/rate:Infinity,offlineExtra:Math.max(0,Math.min(production,space+150)-Math.min(production,space))};}
function storehousePanel(){return `<details class="history-panel storehouse-panel" data-panel="storehouse"><summary>${uiIcon('bag',17)} Storehouse · resource wings</summary><div class="grid">${['wood','stone','food'].map(k=>{const x=storageProjection(k);return `<section class="storage-wing"><h3>${uiIcon(k,20)} ${k[0].toUpperCase()+k.slice(1)}</h3><strong>${Math.floor(s[k])} / ${cap(k)}</strong><p>${Number.isFinite(x.fillsIn)?'Full in '+timeLabel(x.fillsIn)+' online':'Hire a worker to produce'}<br>Upgrade: +${Math.floor(x.offlineExtra)} retained over 8h offline</p><small class="effect-preview">Capacity ${cap(k)} → ${cap(k)+150} · gather +4</small><p>${costMarkup(storageCost(k))}</p>${btn('Expand '+k+' wing','storage:'+k,!canAfford(storageCost(k)))}</section>`;}).join('')}</div><small class="muted">Estimate at current income, 50% offline rate. Training can increase production.</small></details>`;}
function recoveryPreview(){const c=reviveCost();return `<details class="history-panel" data-panel="departure-recovery"><summary>${uiIcon('heart',17)} Recovery · ${c.gold} gold + ${c.food} food${infirmaryReady()?' · free 1m':''}</summary><p>Hero instant revival. Prices rise after each revival.</p><p>${infirmaryReady()?'Free infirmary: 60s per patient. Queue fallen companions after the hero.':'Without an infirmary: free 5m hero recovery. No loan required. Restore the infirmary for free 1m recovery.'}</p>${s.recruits.length?'<p>Companions: '+s.recruits.map(r=>escapeHtml(r.name||r.cls)+' '+costText(reviveCost(r))).join(' · ')+'</p>':''}<button data-tab="Treasury">${uiIcon('heart',16)} Open recovery</button></details>`;}
function masteryPanel(){if(s.gear.weapon<0)return '';const xp=s.gearMastery.weapon||0,rank=Math.floor(xp/100);return `<details class="history-panel weapon-mastery" data-panel="mastery"><summary>${uiIcon('sword',14)} Weapon mastery · ${rank}/3 · +${Math.round(masteryBonus()*100)}% weapon damage</summary><div class="bar"><span style="width:${xp/300*100}%"></span></div><small>${xp}/300 waves · +1% per 100 cleared waves. Forging retains mastery; replacements inherit up to half (max 150), never added repeatedly.</small></details>`;}

function storageCost(k){const level=s.buildings[k+'Storage']||0;return {wood:35+level*40,stone:25+level*30};}
function canAfford(c){return Object.entries(c).every(([k,v])=>s[k]>=v);}
function gearItem(k,tier=s.gear[k],upgrade=s.gearUpgrades[k]||0,variant=s.gearVariants[k]||"balanced"){
 const slot=SLOTS.find(x=>x.key===k);if(!slot||tier<0)return null;
 const prefix=tier===0?'Worn':tier===1?'Iron':tier===2?'Gravewarden':tier===3?'Duskforged':'Ancient '+tier;
 const noun={head:'helm',cape:'cloak',neck:'pendant',weapon:'blade',body:'cuirass',shield:'shield',legs:'greaves',hands:'gloves',feet:'boots',ring:'signet'}[k];
 const value=slot.stat==='health'?2+tier*7+upgrade*2:slot.stat==='attack'?(k==='weapon'?3+tier*6:1+tier*2)+upgrade*2:1+tier*2+upgrade;
 const stats={[slot.stat]:value},identity=k==='weapon'?(WEAPON_POOL[variant]||WEAPON_POOL.balanced):null;
 if(identity){stats.attack=Math.max(1,Math.round(value*identity.attack));if(identity.speed)stats.speed=identity.speed;if(variant==='warden')stats.defense=1+tier;if(variant==='blood')stats.leech=.025;if(variant==='precise')stats.crit=.035;}
 if(tier>0&&k==='ring')stats.crit=tier*.02;
 if(tier>0&&k==='cape')stats.evade=tier*.015;
 if(tier>0&&k==='neck')stats.leech=tier*.015;
 return {name:prefix+' '+(identity?.name||noun),tier,upgrade,stats,variant,style:identity?.style,help:identity?.help};
}
function heroStats(includeRecruits=true){
 const total={attack:9,defense:0,health:75,crit:.05,evade:0,leech:0,speed:0};
 for(const slot of SLOTS){const item=gearItem(slot.key);if(item)for(const[k,v]of Object.entries(item.stats))total[k]+=v;}
 const support=settlementSupport();total.attack+=support.attack;total.defense+=support.defense;total.health+=support.health;
 const live=includeRecruits?s.recruits.filter(r=>!r.dead):[];total.defense*=1+live.filter(r=>r.cls==='Warrior').length*.05;total.crit+=live.filter(r=>r.cls==='Archer').length*.03;total.health+=live.filter(r=>r.cls==='Healer').length*5;
 // Preserve the DPS contribution of base/other-slot attack across weapon cadences.
 const plainWeapon=gearItem('weapon')?.stats.attack||0,weaponAttack=plainWeapon*(1+masteryBonus()),cadence=1+total.speed;total.attack+=plainWeapon*masteryBonus();
 total.attack=(total.attack-weaponAttack)/cadence+weaponAttack;
 total.attack=Math.round(total.attack*(1+s.meta.prestiges*.05+s.talents.warrior*.05));total.health=Math.round(total.health*(1+s.meta.prestiges*.05+s.talents.survivor*.05)*(SLOTS.filter(x=>s.gear[x.key]===2).length>=3?1.1:1));total.defense=Math.round(total.defense*100)/100;
 total.speed=Math.max(-.25,Math.min(.4,total.speed));total.crit=Math.min(.5,total.crit);total.evade=Math.min(.35,total.evade);total.leech=Math.min(.25,total.leech);return total;
}
function statText(stats){return Object.entries(stats).map(([k,v])=>`${['crit','evade','leech','speed'].includes(k)?Number((v*100).toFixed(1))+'%':v} ${k==='health'?'HP':k==='leech'?'life steal':k==='speed'?'attack speed':k}`).join(' · ');}
function forgeCost(k){const n=Math.max(0,s.gear[k]);return {iron:18+n*8,rivets:12+n*6,gold:600+n*400,...(['cape','hands','feet'].includes(k)?{leather:10+n*5}:{}),...(['ring','neck'].includes(k)?{essence:6+n*3}: {})};}
function upgradeCost(k){const n=s.gearUpgrades[k]||0,t=Math.max(0,s.gear[k]);return {gold:Math.ceil((150+t*50+n*100+n*n*25)*(s.buildings.workshop?.9:1)),iron:8+t*2+n*4};}
function canCraft(k){const c=forgeCost(k);return s.gear[k]>=0&&s.blueprints>0&&Object.entries(c).every(([key,v])=>(key==='gold'?s.gold:s.items[key])>=v);}
function reviveCost(recruit=null){const n=recruit?recruit.revives||0:s.heroRevives||0;return {gold:Math.ceil((recruit?15:25)*Math.pow(1.35,n)),food:Math.ceil((recruit?10:15)*Math.pow(1.25,n))};}
function reviveHero(borrow=false){if(!s.heroDead||s.infirmaryPatient)return false;const c=reviveCost();if(borrow){if(s.debt+s.interest>0)return false;s.debt=Math.max(0,c.gold-s.gold)+Math.max(0,c.food-s.food)*2;s.gold=Math.max(0,s.gold-c.gold);s.food=Math.max(0,s.food-c.food);s.loanRuns=0;}else if(!pay(c))return false;s.heroDead=false;s.recover=0;s.heroRevives++;s.recoveryQueue=s.recoveryQueue.filter(x=>x!=="hero");return true;}
function reviveRecruit(index){const r=s.recruits[index];if(!r?.dead||s.infirmaryPatient||battle||s.offlineQueue||!pay(reviveCost(r)))return false;r.dead=false;r.revives=(r.revives||0)+1;s.recoveryQueue=s.recoveryQueue.filter(x=>x!==index);return true;}
function gatherYield(k){const workerLevel=s.workers[k]?1+Math.floor(s.workers[k].xp/300):0;return Math.floor(12+Math.sqrt(s.gatherCounts[k]||0)*2+(s.buildings[k+'Storage']||0)*4+workerLevel*4);}
function collectGather(){if(!s.gather||Date.now()<s.gather.end)return false;const k=s.gather.kind,amount=s.gather.amount??gatherYield(k),received=Math.min(amount,Math.max(0,cap(k)-s[k]));s[k]+=received;s.gatherCounts[k]=(s.gatherCounts[k]||0)+1;log('Gathered '+Math.floor(received)+' '+k+'.');s.gather=null;return true;}
function salvageReward(item){const r=RARITIES[item.rarity||defaultRarity(item.tier)]||RARITIES.common;return Object.fromEntries(Object.entries(r).filter(([k])=>k!=='label'));}
function salvageItem(index){const item=s.equipmentBag[index];if(!item||battle||s.offlineQueue)return false;const reward=salvageReward(item);s.equipmentBag.splice(index,1);if(item.id&&s.pinnedGoal?.itemId===item.id)s.pinnedGoal=null;s.gold+=reward.gold;for(const[k,v]of Object.entries(reward))if(k!=='gold')s.items[k]+=v;log('Salvaged equipment for '+costText(reward)+'.');return true;}
function salvagePrompt(index){const item=s.equipmentBag[index];if(!item||battle||s.offlineQueue)return;salvageTarget=item;const d=$('#salvage');d.innerHTML=`<h2>Salvage ${gearItem(item.slot,item.tier,item.upgrade||0,item.variant||"balanced").name}?</h2><p class="muted">This permanently removes the spare item. Equipped gear stays safe.</p>${s.pinnedGoal?.kind==='spare-upgrade'&&s.pinnedGoal.itemId===item.id?'<p class="notice">This is your tracked item. Salvaging it also clears its upgrade goal.</p>':''}<p class="gold">${RARITIES[item.rarity||defaultRarity(item.tier)].label} salvage: ${costText(salvageReward(item))}</p>${btn('Cancel','close')}${btn('Salvage item','salvage-confirm')}<p class="muted">${goalDetails()?'Salvage contributes to: '+escapeHtml(goalDetails().name):'Pin a project to see how salvage contributes.'}</p>`;d.showModal();}

function recordRun(won,wave,loot,dungeon){if(s.gear.weapon>=0&&dungeon&&!estimating)s.gearMastery.weapon=Math.min(300,s.gearMastery.weapon+(dungeon.clearedWave??(won?wave:Math.max(0,wave-1))));s.expeditions++;s.history.runs++;s.history.best=Math.max(s.history.best,wave);if(won&&wave===15){s.history.bosses++;s.cycleBosses++;if(dungeon)s.clearedDungeons[dungeon.d]={d:dungeon.d,name:dungeon.name,mod:dungeon.mod||1,modifier:dungeon.modifier||'none',focus:dungeon.focus||'balanced',family:dungeon.family};}s.history.gold+=won?loot.gold||0:0;s.history.recent.unshift({name:dungeon?.name||'Dungeon',wave,won,gold:won?loot.gold||0:0});s.history.recent=s.history.recent.slice(0,8);if(s.debt>0&&++s.loanRuns>=5){s.interest+=s.debt*.01;s.loanRuns=0;}for(const [index,r] of s.recruits.entries())if(!r.dead&&(!dungeon?.allies||dungeon.allies.some(u=>u.index===index))){if(won&&wave>=5){r.loyalty=Math.min(30,(r.loyalty||0)+1);if([10,20,30].includes(r.loyalty))log(r.name+' shares a memory: '+bondStory(r));}r.xp++;if(r.xp>=20){r.level++;r.xp=0;log(r.name+' reached level '+r.level+': +2 HP'+(r.level%4===0?' · +1 attack':'')+(r.level===5?' · class trait unlocked':''));}}}
function secureLoot(loot){s.equipmentBag.push(...(loot.equipment||[]));for(const k of ['gold','wood','stone','food'])s[k]=k==='gold'?s[k]+(loot[k]||0):Math.min(cap(k),s[k]+(loot[k]||0));for(const k of Object.keys(MATERIALS))s.items[k]+=loot[k]||0;s.blueprints+=loot.blueprints||0;}
function startQueue(d,count){if(battle||s.offlineQueue||s.infirmaryPatient||s.heroDead||!s.clearedDungeons[d])return false;s.offlineQueue={dungeon:{...s.clearedDungeons[d]},remaining:Math.min(3,Math.max(1,count)),readyAt:Date.now()+300000};return true;}
function resolveQueue(){let q=s.offlineQueue;if(!q||Date.now()<q.readyAt)return;while(q&&Date.now()>=q.readyAt){
 const original=s,liveBattle=battle;let result;
 try{estimating=true;s=JSON.parse(JSON.stringify(original));startBattle({...q.dungeon,queued:true,objective:"none"});for(let i=0;i<750&&!battle.result;i++){if(battle.checkpoint)continueBattle('balanced');tickBattle();}result={won:battle.result==='win',wave:battle.wave,loot:JSON.parse(JSON.stringify(battle.loot)),report:battleReport(battle.result==='win'),dead:s.recruits.map(r=>!!r.dead)};}finally{s=original;battle=liveBattle;estimating=false;}
 for(const k of ['gold','wood','stone','food',...Object.keys(MATERIALS)])result.loot[k]=Math.floor((result.loot[k]||0)*.5);result.loot.blueprints=Math.random()<.5?result.loot.blueprints:0;result.loot.equipment=result.loot.equipment.filter(()=>Math.random()<.5);
 s.recruits.forEach((r,i)=>r.dead=result.dead[i]);if(result.won){secureLoot(result.loot);if(result.loot.equipment.length)notifyLoot(result.loot.equipment[0],result.wave);}else s.heroDead=true;recordRun(result.won,result.wave,result.loot,q.dungeon);s.lastExpedition={report:result.report,won:result.won,wave:result.wave,loot:result.loot};log('Queued expedition '+(result.won?'returned with half rewards.':'failed; your hero needs revival.'));q.remaining--;q.readyAt+=300000;if(!result.won||q.remaining<=0){s.offlineQueue=null;q=null;if(!result.won&&infirmaryReady())queueFallen();} }
}
function prestigeReward(){return 3+s.cycleBosses*2;}

const topics={Progression:['Beyond one lifetime','Defeat a boss and repay debt to prestige. Prestige resets this adventure, awards permanent bonuses and prestige Grave Essence, and retains talents. Spend that essence on the three talent paths. Crafting essence is separate. Fully cleared dungeons unlock offline queues with half rewards.'],Settlement:['A foothold in the dark','Gather wood, stone and food by starting a short task, then collect it. Manual yields grow with gathering practice, worker levels, and storage upgrades. Build your first production site to unlock dungeons. Hire workers to automate production; workers level as they work. Storage can be upgraded; each level costs more. Build a site, then use its highlighted Hire worker panel to automate gathering. Offline production is 50% of normal and stops when storage fills. Settlement projects combine farm supplies and dungeon materials: restore three infirmary phases after establishing barracks to unlock a single free 60-second recovery bed for hero or recruits. Rescue specialists from deep dungeons and extract to bring them home: the blacksmith offers a paid workshop, the quartermaster sells limited food, and the scout surveys new routes for gold.'],Expeditions:['Beyond the gates','Choose one of three newly generated dungeons. Combat score summarizes full-health loadout and party strength; click its info icon for sources. Each dungeon has a recommended score, but that number is not a guarantee. The risk meter simulates your current team against all 15 waves to estimate a clear chance. Random attacks and critical hits mean it is a forecast, not a guarantee. Combat is automatic. Extract after waves 5 and 10 to secure your loot, or continue to the final boss. Defeat forfeits this run’s rewards. At waves 5 and 10, choose a sheltered path, plunder path, or favored-material trail before continuing. Paths change only the next five waves. The clear forecast assumes standard paths. Crypts favor iron, ruined keeps rivets, and haunted woods leather; Materials focus improves these chances. Pick one optional objective before entering for a small fixed extraction bonus. Lone descent leaves recruits at home; other objectives require elite waves or a safe party return. Equipment chance is capped at 18%, and Double Loot does not duplicate gear. Wave 10 can free a specialist; a final boss frees one missing resident. Rescue rewards require extraction and are unavailable in offline queues.'],Loadout:['Found, then reforged','Start with empty equipment slots. Cleared waves 5, 10, and 15 have a slim equipment-drop chance. Extract to keep a find, then equip it in Inventory. Blueprints and materials are rare, separate drops. Forging consumes a blueprint and upgrades an existing item; it cannot fill an empty slot. Upgrade equipment with substantial gold and iron costs that grow with item tier and upgrade level. Craft the next tier using your current equipment, a new blueprint, and ingredients. Owned equipment survives defeat. Spare or duplicate equipment can be salvaged in Inventory; rarer items return more gold and materials. Salvaging asks for confirmation. Select one of ten equipment slots (no arrow slot). Weapon mastery earns one point per cleared wave at the end of an expedition, even on defeat. Each 100 points grants 1% weapon damage, capped at 3%. Mastery stays on the weapon, survives forging, and replacements inherit up to half (max 150 points) without stacking transfers. Weapons have six identities: balanced blades, fast dirks, heavy mauls, defensive spears, life-stealing sickles, and critical sabres. Faster weapons strike more often but hit softer; heavy weapons strike harder but slower. Weapon identity survives upgrades and forging. Bonuses such as critical chance, evasion, life steal, and attack speed affect real combat. Inventory in the top bar tracks all secured materials; hover materials for their source and recommended reward focus. Pin an upgrade, forge, infirmary phase, or recruit preparation milestone to guide spending. The blacksmith workshop connects equipment inspection, forging, salvage, and goals.'],Recruits:['No one walks alone','Staff all three production sites and reach dungeon wave five, then build the barracks with supplies and dungeon gold. Expand storage and save up to hire warriors, archers, or healers. Prepare a recruit’s quarters in three farm-supply milestones, then hire with dungeon gold. The summed cost is unchanged, scales per recruit, and preparation persists between visits. They are small supporting troops: they act every other turn and contribute less damage and healing than the hero. Warriors give the hero a small defense bonus. They level slowly through expeditions. Fallen recruits remain unavailable until revived with gold and food, or for free after 60 seconds in a restored infirmary. One recovery bed serves hero and recruits; queue all fallen characters with hero first by default, reorder waiting companions, or pay a decreasing gold/food fee to finish the active treatment early. Each queued recovery takes one minute, including while away; departure waits until the queue finishes. Loyalty grows by one after a recruit survives a successful return from wave 5 or beyond. At 10 and 20 they share memories; at 30 their personal story concludes with one permanent +2 personal HP bonus. Companions left at home earn neither loyalty nor experience.'],Treasury:['A costly second chance','Revive your hero with gold and food, or borrow the missing cost. Each completed revival increases that character’s next price; hero recoveries and loan revivals count too. Recruits each have their own revival count. Only one loan can be outstanding. Every five completed expeditions adds 1% interest on remaining principal. Repay manually; payments cover interest first. Free hero recovery takes five minutes and does not require a loan. A fully restored infirmary instead offers one free 60-second recovery bed for hero or recruit, regardless of function chance(d,mod=1,modifier="none"){

()}</span></p><div class="family-yield" title="Favored material has 50% higher drop chance; Materials focus doubles material chances.">${uiIcon(familyInfo(c).material,14)} ${familyInfo(c).name} · favors ${familyInfo(c).label}</div><div class="dungeon-modifier" title="${MODIFIERS[c.modifier||'none'].help}">${uiIcon(c.modifier==='elite'?'skull':c.modifier==='wounded'?'heart':c.modifier==='double'?'gold':'shield',14)} ${MODIFIERS[c.modifier||'none'].name}</div>${btn('Enter dungeon','enter:'+c.d,s.heroDead||s.offlineQueue||s.infirmaryPatient)}</div></section>`;}).join('')}</div><div class="route-planning">${objectivePanel()}<details class="history-panel" data-panel="route-advice"><summary>${uiIcon('pin',16)} Suggested route</summary><p>${goalRecommendation()}</p></details></div></div>${s.heroDead?'<div class="notice">Hero fallen. Visit Treasury to recover.</div>':s.offlineQueue?'<div class="notice">Your expedition is away.</div>':''}<div class="expedition-extras"><details class="history-panel" data-panel="expedition-support"><summary>${uiIcon('home',17)} Settlement support · +${h.attack} ATK · +${h.defense} DEF · +${h.health} HP</summary>${connectionPanel()}</details>${recoveryPreview()}${expeditionHistory()}${queuePanel()}${s.lastExpedition?`<details class="history-panel" data-panel="previous-rewards"><summary>${uiIcon('bag',17)} Last expedition · wave ${s.lastExpedition.wave} · ${s.lastExpedition.won?'extracted':'defeated'}</summary>${expeditionResult()}</details>`:''}</div>`;}

function sprite(kind){
 const hero=kind==='hero',boss=kind==='boss',archer=['Archer','enemyArcher'].includes(kind),healer=['Healer','enemyHealer'].includes(kind),undead=['enemy','enemyArcher','enemyHealer','boss'].includes(kind),worker=['Woodcutter','Miner','Farmer'].includes(kind);

 if(hero&&s.gear.weapon>=0){const v=s.gearVariants.weapon;weapon=({swift:'<path d="M39 24h3v15h-3" fill="#d0dbca"/><path d="M35 39h11v3H35m5 4h2v7h-2" fill="#c4a369"/>',heavy:'<path d="M39 17h3v39h-3" fill="#ac8453"/><path d="M31 13h17v11H31" fill="#7f9895"/><path d="M31 13h4v11h-4m4-11h13v3H35" fill="#c0cbb4"/>',warden:'<path d="M39 13h3v44h-3" fill="#b59863"/><path d="M39 3h3v3h3v7h-3v4h-3v-4h-3V6h3" fill="#ced5bd"/>',blood:'<path d="M39 30h3v25h-3" fill="#a9805b"/><path d="M34 15h10v3h4v16h-7v-4h4V19H34" fill="#b6918b"/>',precise:'<path d="M39 11h2v15h-2m2 0h2v15h-2" fill="#dbe0c7"/><path d="M36 40h10v3H36m4 5h2v7h-2" fill="#c4a369"/>'})[v]||weapon;}
 const head=hero&&s.gear.head<0?'<path d="M16 7h16v5h2v10H14V12h2" fill="#493d36"/><path d="M16 12h15v12H16" fill="#c6a078"/><path d="M16 12h15v3H16m0 0h3v5h-3" fill="#66513d"/>':`<path d="M16 5h15v3h4v15H13V8h3" fill="${armor}"/><path d="M13 10h22v3H13m5-5h11v3H18" fill="${light}"/><path d="M17 14h15v11H17" fill="${skin}"/><path d="M23 12h3v13h-3" fill="${armor}"/><path d="M17 24h15v4H17" fill="${shadow}"/>`;
 return `<svg width="80" height="100" viewBox="0 0 48 64" shape-rendering="crispEdges" role="img" aria-label="${kind} pixel portrait"><ellipse cx="24" cy="61" rx="19" ry="2" fill="#050a09" opacity=".65"/><path d="M13 24h21l6 34H7l3-22" fill="${cape}"/><path d="M10 35h5l-2 23H7m24-26h3l6 26h-6" fill="#362f32"/><path d="M15 44h8v14h-3v3H10v-4h5m12-13h7v13h4v4H26V47" fill="${shadow}"/><path d="M16 47h3v8h-3m12-8h3v8h-3" fill="${armor}"/><path d="M10 57h10v3H10m16-3h12v3H26" fill="#1c2928"/><path d="M13 25h22v22H13" fill="${armor}"/><path d="M16 26h3v15h-3m4-14h11v3H20" fill="${light}"/><path d="M13 31h22v2H13m8-6h2v15h-2" fill="${shadow}" opacity=".7"/><path d="M10 25h7v10H9m24-10h7v10h-7" fill="${armor}"/><path d="M10 25h7v3h-7m24-3h6v3h-6" fill="${light}"/><path d="M10 35h5v8h-5m23-8h6v8h-6" fill="${skin}"/><path d="M10 42h6v4h-6m17-3h19v4H17" fill="${shadow}"/><path d="M22 43h5v4h-5" fill="${light}"/>${head}<path d="M18 17h3v2h-3m10-2h3v2h-3" fill="${undead?'#c37c5f':'#263b35'}"/><path d="M20 22h8v2h-8" fill="${undead?'#727568':'#77583e'}"/>${boss?'<path d="M13 2h3v3h4V1h3v4h4V1h3v4h3V2h3v8H13" fill="#c4a369"/>':''}${weapon}${['Warrior','enemy'].includes(kind)||(hero&&s.gear.shield>=0)?'<path d="M2 32h11v14h-2v4H7v-2H4v-3H2" fill="#a2af9c"/><path d="M4 34h7v10H9v3H7v-2H4" fill="#566b65"/><path d="M7 34h2v10H7" fill="#c4ae7e"/>':''}</svg>`;
}
function unitCard(u,enemy=false){const event=u.event,dead=u.hp<=0,active=event&&event.beat===battle.beat&&battle.phase==='combat'&&!battle.checkpoint&&u.hp>0,hero=u.role==='Hero',support=!enemy&&!hero;return `<div class="combat-unit ${hero?'hero-unit':support?'support-unit':'hostile'} ${u.kind==='boss'?'boss-unit':''} ${dead?'fallen':''}" data-unit="${u.id}" data-hp="${u.hp}" title="${escapeHtml(u.name)}: ${Math.ceil(u.hp)}/${u.maxHp} HP · ${u.attack} attack · ${u.defense} defense${enemy?' · '+({Guard:'Armored front line',Archer:'Fragile; targets companions',Healer:'Heals an injured enemy every third beat',Boss:'Dungeon boss'}[u.role]||'Front line'):''}"><div class="unit-status"><div class="unit-label">${enemy?uiIcon({Guard:'shield',Archer:'arrow',Healer:'heart',Boss:'skull'}[u.role]||'sword',12):''}${hero?'THE WARDEN':escapeHtml(support?u.role:u.name)}</div><div class="unit-hp" role="meter" aria-label="${escapeHtml(u.name)} HP" aria-valuemin="0" aria-valuemax="${u.maxHp}" aria-valuenow="${Math.ceil(Math.max(0,u.hp))}"><span style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></span></div><strong>${Math.ceil(Math.max(0,u.hp))}<span> / ${u.maxHp}</span></strong></div><div class="unit-sprite ${active&&event.kind==='attack'?'attacking':''} ${active&&event.kind==='damage'?'struck':''}">${sprite(u.kind)}${active?`<span class="combat-number ${event.kind}">${event.kind==='attack'&&['⚔','➶'].includes(event.text)?uiIcon(event.text==='➶'?'arrow':'sword',16):escapeHtml(event.text)}</span>`:''}</div>${dead?'<small class="fallen-label">Fallen</small>':''}</div>`;}
function lootSummary(loot){return [['gold','Gold'],['wood','Wood'],['stone','Stone'],['food','Food'],...Object.entries(MATERIALS).map(([k,v])=>[k,v.name]),['blueprints','Blueprints']].map(([k,label])=>`<span>${label} <strong>${loot[k]||0}</strong></span>`).join('');}
function spoilsPanel(loot,secured){const finds=loot.equipment||[];return `<section class="spoils-visible ${secured?'secured':''}"><div class="row spoils-heading"><h3>${uiIcon('bag',20)} ${secured?'Rewards secured':'Spoils'}</h3><span class="spoils-state">${uiIcon(secured?'check':'warning',14)} ${secured?'In your inventory':'Extract to keep'}</span><strong class="spoils-gold">${uiIcon('gold',20)} ${loot.gold||0}</strong></div><div class="spoils-counts">${[...Object.entries(MATERIALS).map(([k,v])=>[k,v.name]),['blueprints','Blueprints']].map(([k,name])=>`<span title="${materialTooltip(k)}">${uiIcon(k,19)}<span>${name}</span><strong>${loot[k]||0}</strong></span>`).join('')}</div>${finds.length?`<div class="rare-loot"><span class="badge">${finds.length} equipment ${secured?'secured':'found'}</span>${equipmentList(finds)}</div>`:''}<details data-panel="farm-spoils"><summary>Farm supplies</summary><div class="loot-grid">${['wood','stone','food'].map(k=>`<span>${uiIcon(k,15)} ${k}<strong>${loot[k]||0}</strong></span>`).join('')}</div></details></section>`;}
function expeditionResult(){if(!s.lastExpedition)return '';const r=s.lastExpedition;return r.won?`<div class="last-result">${reportPanel(r.report)}${r.objective?`<p class="notice">Objective completed: ${r.objective}</p>`:''}${r.rescue?`<p class="notice">${specialistInfo(r.rescue).name} arrived in the settlement.</p>`:''}${spoilsPanel(r.loot,true)}<p class="notice next-decision">${nextDecision(true)}</p>${(r.loot.equipment||[]).length?btn('Equip your finds →','inventory'):''}</div>`:` ${reportPanel(r.report)}<div class="notice">Your last expedition ended at wave ${r.wave}. Unsecured loot was lost.</div><p class="notice next-decision">${nextDecision(false)}</p>`;}
