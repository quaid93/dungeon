let salvageTarget=null;
function migrate(state){
 state.specialists??={};state.objective??='none';state.quartermasterRun??=-1;state.objectivesCompleted??=0;state.meta??={prestiges:0,essence:0};state.talents??={warrior:0,survivor:0,treasure:0};state.history??={runs:state.expeditions||0,best:state.lastExpedition?.wave||0,bosses:0,gold:0,recent:[]};state.cycleBosses??=state.history.bosses;state.clearedDungeons??={};state.offlineQueue??=null;state.foreman??=false;state.tutorialsDisabled??=false;state.lootAlert??=null;state.heroRevives??=0;state.gatherCounts??={};state.gearRarities??={};state.gear??={};state.gearUpgrades??={};

function canAfford(c){return Object.entries(c).every(([k,v])=>s[k]>=v);}
function gearItem(k,tier=s.gear[k],upgrade=s.gearUpgrades[k]||0){
 const slot=SLOTS.find(x=>x.key===k);if(!slot||tier<0)return null;
 const prefix=tier===0?'Worn':tier===1?'Iron':tier===2?'Gravewarden':tier===3?'Duskforged':'Ancient '+tier;
 const noun={head:'helm',cape:'cloak',neck:'pendant',weapon:'blade',body:'cuirass',shield:'shield',legs:'greaves',hands:'gloves',feet:'boots',ring:'signet'}[k];
 const value=slot.stat==='health'?2+tier*7+upgrade*2:slot.stat==='attack'?(k==='weapon'?3+tier*6:1+tier*2)+upgrade*2:1+tier*2+upgrade;
 const stats={[slot.stat]:value};
 if(tier>0&&k==='ring')stats.crit=tier*.02;
 if(tier>0&&k==='cape')stats.evade=tier*.015;

 const total={attack:9,defense:0,health:75,crit:.05,evade:0,leech:0};
 for(const slot of SLOTS){const item=gearItem(slot.key);if(item)for(const[k,v]of Object.entries(item.stats))total[k]+=v;}

 const live=includeRecruits?s.recruits.filter(r=>!r.dead):[];total.defense*=1+live.filter(r=>r.cls==='Warrior').length*.05;total.crit+=live.filter(r=>r.cls==='Archer').length*.03;total.health+=live.filter(r=>r.cls==='Healer').length*5;
 total.attack=Math.round(total.attack*(1+s.meta.prestiges*.05+s.talents.warrior*.05));total.health=Math.round(total.health*(1+s.meta.prestiges*.05+s.talents.survivor*.05)*(SLOTS.filter(x=>s.gear[x.key]===2).length>=3?1.1:1));total.defense=Math.round(total.defense*100)/100;

function upgradeCost(k){const n=s.gearUpgrades[k]||0,t=Math.max(0,s.gear[k]);return {gold:Math.ceil((150+t*50+n*100+n*n*25)*(s.buildings.workshop?.9:1)),iron:8+t*2+n*4};}

function reviveCost(recruit=null){const n=recruit?recruit.revives||0:s.heroRevives||0;return {gold:Math.ceil((recruit?15:25)*Math.pow(1.35,n)),food:Math.ceil((recruit?10:15)*Math.pow(1.25,n))};}
function reviveHero(borrow=false){if(!s.heroDead)return false;const c=reviveCost();if(borrow){if(s.debt+s.interest>0)return false;s.debt=Math.max(0,c.gold-s.gold)+Math.max(0,c.food-s.food)*2;s.gold=Math.max(0,s.gold-c.gold);s.food=Math.max(0,s.food-c.food);s.loanRuns=0;}else if(!pay(c))return false;s.heroDead=false;s.recover=0;s.heroRevives++;return true;}

function gatherYield(k){const workerLevel=s.workers[k]?1+Math.floor(s.workers[k].xp/300):0;return Math.floor(12+Math.sqrt(s.gatherCounts[k]||0)*2+(s.buildings[k+'Storage']||0)*4+workerLevel*4);}
function collectGather(){if(!s.gather||Date.now()<s.gather.end)return false;const k=s.gather.kind,amount=s.gather.amount??gatherYield(k),received=Math.min(amount,Math.max(0,cap(k)-s[k]));s[k]+=received;s.gatherCounts[k]=(s.gatherCounts[k]||0)+1;log('Gathered '+Math.floor(received)+' '+k+'.');s.gather=null;return true;}
function salvageReward(item){const r=RARITIES[item.rarity||defaultRarity(item.tier)]||RARITIES.common;return Object.fromEntries(Object.entries(r).filter(([k])=>k!=='label'));}
function salvageItem(index){const item=s.equipmentBag[index];if(!item||battle||s.offlineQueue)return false;const reward=salvageReward(item);s.equipmentBag.splice(index,1);s.gold+=reward.gold;for(const[k,v]of Object.entries(reward))if(k!=='gold')s.items[k]+=v;log('Salvaged equipment for '+costText(reward)+'.');return true;}
function salvagePrompt(index){const item=s.equipmentBag[index];if(!item||battle||s.offlineQueue)return;salvageTarget=item;const d=$('#salvage');d.innerHTML=`<h2>Salvage ${gearItem(item.slot,item.tier,item.upgrade||0).name}?</h2><p class="muted">This permanently removes the spare item. Equipped gear stays safe.</p><p class="gold">${RARITIES[item.rarity||defaultRarity(item.tier)].label} salvage: ${costText(salvageReward(item))}</p>${btn('Cancel','close')}${btn('Salvage item','salvage-confirm')}`;d.showModal();}
function isDuplicate(item,index){return (s.gear[item.slot]===item.tier)||s.equipmentBag.some((other,i)=>i!==index&&other.slot===item.slot&&other.tier===item.tier);}
const RESOURCE_HELP={wood:'A staffed woodcutting camp grants +1 hero attack. Wood builds sites, expands storage, and hires workers and recruits.',stone:'A staffed quarry grants +1 hero defense. Stone builds sites, expands storage, and hires recruits.',food:'A staffed homestead grants +5 hero HP. Food hires workers and recruits and pays for revivals. Dungeon entry costs no food.',gold:'Gold upgrades equipment, pays for revivals, and repays loans. Earn it in dungeons and by salvaging items.'};
const MODIFIERS={none:{name:'Unmodified',help:'Standard enemies and rewards.'},double:{name:'Double Loot',help:'Twice the gold, supplies, and crafting quantities. Equipment is capped at one item per milestone and an 18% drop chance.'},elite:{name:'Elite Enemies',help:'Enemies have 25% more HP and attack.'},wounded:{name:'Starting Damage',help:'Your hero begins at 75% HP.'}};
function incomeRate(k){return s.workers[k]?(1+Math.floor(s.workers[k].xp/300)*.2)*(1+s.meta.prestiges*.05):0;}
function resourceTooltip(k){return RESOURCE_HELP[k]+(k==='gold'?' No passive gold production.':` Worker income: ${incomeRate(k).toFixed(2)}/sec online, ${(incomeRate(k)*.5).toFixed(2)}/sec offline. Storage: ${Math.floor(s[k])}/${cap(k)}. Production is capped by storage.`);}
function recordRun(won,wave,loot,dungeon){s.expeditions++;s.history.runs++;s.history.best=Math.max(s.history.best,wave);if(won&&wave===15){s.history.bosses++;s.cycleBosses++;if(dungeon)s.clearedDungeons[dungeon.d]={d:dungeon.d,name:dungeon.name,mod:dungeon.mod||1,modifier:dungeon.modifier||'none',focus:dungeon.focus||'balanced'};}s.history.gold+=won?loot.gold||0:0;s.history.recent.unshift({name:dungeon?.name||'Dungeon',wave,won,gold:won?loot.gold||0:0});s.history.recent=s.history.recent.slice(0,8);if(s.debt>0&&++s.loanRuns>=5){s.interest+=s.debt*.01;s.loanRuns=0;}for(const [index,r] of s.recruits.entries())if(!r.dead&&(!dungeon?.allies||dungeon.allies.some(u=>u.index===index))){if(won&&wave>=5){r.loyalty=Math.min(30,(r.loyalty||0)+1);if([10,20,30].includes(r.loyalty))log(r.name+' shares a memory: '+bondStory(r));}r.xp++;if(r.xp>=20){r.level++;r.xp=0;log(r.name+' reached level '+r.level+': +2 HP'+(r.level%4===0?' · +1 attack':'')+(r.level===5?' · class trait unlocked':''));}}}
function secureLoot(loot){s.equipmentBag.push(...(loot.equipment||[]));for(const k of ['gold','wood','stone','food'])s[k]=k==='gold'?s[k]+(loot[k]||0):Math.min(cap(k),s[k]+(loot[k]||0));for(const k of Object.keys(MATERIALS))s.items[k]+=loot[k]||0;s.blueprints+=loot.blueprints||0;}
function startQueue(d,count){if(battle||s.offlineQueue||s.heroDead||!s.clearedDungeons[d])return false;s.offlineQueue={dungeon:{...s.clearedDungeons[d]},remaining:Math.min(3,Math.max(1,count)),readyAt:Date.now()+300000};return true;}
function resolveQueue(){let q=s.offlineQueue;if(!q||Date.now()<q.readyAt)return;while(q&&Date.now()>=q.readyAt){
 const original=s,liveBattle=battle;let result;
 try{estimating=true;s=JSON.parse(JSON.stringify(original));startBattle({...q.dungeon,queued:true,objective:"none"});for(let i=0;i<750&&!battle.result;i++){if(battle.checkpoint)continueBattle();tickBattle();}result={won:battle.result==='win',wave:battle.wave,loot:JSON.parse(JSON.stringify(battle.loot)),report:battleReport(battle.result==='win'),dead:s.recruits.map(r=>!!r.dead)};}finally{s=original;battle=liveBattle;estimating=false;}
 for(const k of ['gold','wood','stone','food',...Object.keys(MATERIALS)])result.loot[k]=Math.floor((result.loot[k]||0)*.5);result.loot.blueprints=Math.random()<.5?result.loot.blueprints:0;result.loot.equipment=result.loot.equipment.filter(()=>Math.random()<.5);
 s.recruits.forEach((r,i)=>r.dead=result.dead[i]);if(result.won){secureLoot(result.loot);if(result.loot.equipment.length)notifyLoot(result.loot.equipment[0],result.wave);}else s.heroDead=true;recordRun(result.won,result.wave,result.loot,q.dungeon);s.lastExpedition={report:result.report,won:result.won,wave:result.wave,loot:result.loot};log('Queued expedition '+(result.won?'returned with half rewards.':'failed; your hero needs revival.'));q.remaining--;q.readyAt+=300000;if(!result.won||q.remaining<=0){s.offlineQueue=null;q=null;} }
}
function prestigeReward(){return 3+s.cycleBosses*2;}
function doPrestige(){if(battle||s.offlineQueue||s.cycleBosses<1||s.debt+s.interest>0)return false;const meta={prestiges:s.meta.prestiges+1,essence:s.meta.essence+prestigeReward()},talents={...s.talents},disabled=s.tutorialsDisabled,history=s.history,seen=[...s.seen];s=initial();s.meta=meta;s.talents=talents;s.tutorialsDisabled=disabled;s.history=history;s.seen=seen;riskCache.clear();return true;}
function buyTalent(k){if(!['warrior','survivor','treasure'].includes(k)||battle||s.offlineQueue||s.talents[k]>=5)return false;const cost=1+s.talents[k];if(s.meta.essence<cost)return false;s.meta.essence-=cost;s.talents[k]++;riskCache.clear();return true;}
function progression(){return `${expeditionHistory()}<div class="grid progression-grid"><section class="card"><span class="eyebrow">Permanent growth</span><h3>Prestige ${s.meta.prestiges}</h3><p>+${s.meta.prestiges*5}% hero attack, HP, and worker income.<br>Prestige Grave Essence: ${s.meta.essence} (separate from crafting essence).</p><details data-panel="prestige-info"><summary>What resets & how to prestige</summary><p>Defeat a boss, repay debt, then begin again for ${prestigeReward()} essence and another permanent 5% bonus. Resets equipment, farm, troops, currency, and current routes. Talents and lifetime history survive.</p></details>${btn('Prestige…','prestige-prompt',battle||s.offlineQueue||s.cycleBosses<1||s.debt+s.interest>0)}</section>${['warrior','survivor','treasure'].map((k,i)=>`<section class="card"><span class="eyebrow">Talent path</span><h3>${['Warrior','Survivor','Treasure Hunter'][i]}</h3><p>Rank ${s.talents[k]} / 5<br>${['+5% hero attack','+5% hero HP','+5% loot value and rare-drop chance'][i]} per rank.</p><div class="talent-track">${Array.from({length:5},(_,n)=>`<i class="${n<s.talents[k]?'learned':''}">${n+1}</i>`).join('')}</div>${btn('Learn · '+(1+s.talents[k])+' prestige essence','talent:'+k,s.talents[k]>=5||s.meta.essence<1+s.talents[k]||battle||s.offlineQueue)}</section>`).join('')}</div>`;}
function expeditionHistory(){return `<details class="history-panel" data-panel="history"><summary>Expedition history · ${s.history.runs} runs · best wave ${s.history.best}</summary><div class="history-stats"><span>Total runs<strong>${s.history.runs}</strong></span><span>Best wave<strong>${s.history.best}</strong></span><span>Bosses defeated<strong>${s.history.bosses}</strong></span><span>Gold earned<strong>${s.history.gold.toLocaleString()}</strong></span></div>${s.history.recent.map(r=>`<p>${escapeHtml(r.name)} · wave ${r.wave} · ${r.won?'returned with '+r.gold+' gold':'defeated'}</p>`).join('')}</details>`;}
function queuePanel(){return `<details class="queue-panel" data-panel="queue"><summary>Offline expeditions ${s.offlineQueue?'· '+s.offlineQueue.remaining+' queued':''}</summary><p class="muted">Only fully cleared dungeons qualify. Each run takes five minutes, simulates combat, and returns 50% rewards. Defeat requires revival and stops the queue. Up to three runs; queue survives closing Chrome.</p>${s.offlineQueue?`<p>${escapeHtml(s.offlineQueue.dungeon.name)} · next return in ${Math.max(0,Math.ceil((s.offlineQueue.readyAt-Date.now())/1000))}s</p>`:Object.values(s.clearedDungeons).map(c=>`<div class="row"><span>${escapeHtml(c.name)}</span><div>${btn('Send 1 run','queue:'+c.d,battle||s.heroDead)}${btn('Send 3 runs','queue3:'+c.d,battle||s.heroDead)}</div></div>`).join('')||'<p>Defeat a final boss to unlock a route.</p>'}</details>`;}
function capacityWarnings(){const full=['wood','stone','food'].filter(k=>s[k]>=cap(k)*.9);return full.length?`<div class="capacity-warnings">${full.map(k=>`<div class="capacity-warning">⚠ ${k[0].toUpperCase()+k.slice(1)} storage ${s[k]>=cap(k)?'full':'nearly full'} <span>Upgrade storage to avoid waste.</span></div>`).join('')}</div>`:'';}

function foremanPanel(){return `<div class="foreman-panel"><div><strong>Camp Foreman</strong><small>${s.foreman?'Collects finished manual tasks automatically.':'Unlock automatic collection of completed manual tasks; start each task yourself.'}</small></div>${s.foreman?'<span class="badge">ON DUTY</span>':btn('Hire · 300 wood / 200 stone / 250 food','foreman',!canAfford({wood:300,stone:200,food:250})||Object.keys(s.workers).length<3)}</div>`;}
const BARRACKS_COST={wood:700,stone:600,food:400,gold:120};
function settlementSupport(){return {attack:s.workers.wood?1:0,defense:s.workers.stone?1:0,health:s.workers.food?5:0};}
function barracksReady(){return ['wood','stone','food'].every(k=>!!s.workers[k])&&s.history.best>=5;}
function buildBarracks(){if(s.buildings.barracks||!barracksReady()||!pay(BARRACKS_COST))return false;s.buildings.barracks=1;log('Barracks established. Your settlement can now house companions.');return true;}
function hireRecruit(cls){if(!['Warrior','Archer','Healer'].includes(cls)||!s.buildings.barracks||s.recruits.length>=3||battle||s.offlineQueue||!pay(recruitCost()))return false;s.recruits.push({cls,name:recruitName(cls,s.recruits.length),level:1,xp:0,dead:false});log(cls+' joins the settlement and your expedition.');return true;}
function connectionPanel(){const h=settlementSupport();return `<section class="campaign-link"><div><span class="eyebrow">Gravehold supports your expedition</span><h3>Build a home worth returning to</h3><p>Woodcutter: +1 attack · Miner: +1 defense · Farmer: +5 HP<br>Active support: ${h.attack} attack · ${h.defense} defense · ${h.health} HP</p></div><div class="campaign-step"><span class="badge">${s.buildings.barracks?'COMPANIONS UNLOCKED':'NEXT SETTLEMENT MILESTONE'}</span><h3>${s.buildings.barracks?'The barracks':'Establish the barracks'}</h3><p>${['wood','stone','food'].filter(k=>!s.workers[k]).length?'Hire all three worker professions.':'✓ All three professions staffed'}<br>${s.history.best>=5?'✓ Wave five reached':'Reach wave five in a dungeon'}<br>${costText(BARRACKS_COST)}</p>${s.buildings.barracks?'<span class="muted">Dungeon gold funds recruitment; settlement supplies house and equip your troops.</span>':btn('Build barracks','barracks',!barracksReady()||!canAfford(BARRACKS_COST))}</div></section>`;}
function recruitCost(){const n=s.recruits.length;return {wood:900+n*450,stone:750+n*350,food:800+n*400,gold:150+n*100};}
function equipItem(index){const item=s.equipmentBag[index];if(!item||battle||s.offlineQueue)return false;const old=gearItem(item.slot);s.equipmentBag.splice(index,1);if(old)s.equipmentBag.push({slot:item.slot,tier:old.tier,upgrade:old.upgrade,rarity:s.gearRarities[item.slot],newFind:false});s.gearRarities[item.slot]=item.rarity||defaultRarity(item.tier);s.gear[item.slot]=item.tier;s.gearUpgrades[item.slot]=item.upgrade||0;selectedSlot=item.slot;riskCache.clear();log('Equipped '+gearItem(item.slot).name+'.');return true;}
function equipmentList(items,equip=false){return items.length?items.map((item,i)=>{const info=gearItem(item.slot,item.tier,item.upgrade||0),slot=SLOTS.find(x=>x.key===item.slot);return `<div class="equipment-find"><span>${equipmentIcon(item.slot,item.tier,item.rarity)}</span><div><strong>${info.name}</strong><small class="rarity-${item.rarity||defaultRarity(item.tier)}">${RARITIES[item.rarity||defaultRarity(item.tier)].label} · ${slot.label} · ${statText(info.stats)}${equip&&isDuplicate(item,i)?' · Duplicate':''}</small></div>${equip?`<div class="spare-actions">${btn('Equip','equip:'+i,!!battle||s.offlineQueue)}${btn('Salvage','salvage:'+i,!!battle||s.offlineQueue)}</div>`:'<span class="badge">RARE FIND</span>'}</div>`}).join(''):'<p class="muted">No equipment found yet. Every fifth cleared wave offers a small chance.</p>';}
const MATERIAL_HELP={iron:'Iron upgrades equipment and forges higher tiers.',rivets:'Rivets forge higher-tier equipment.',leather:'Leather forges capes, gloves, and boots.',essence:'Crafting grave essence forges necklaces and rings. It is separate from prestige Grave Essence.'};
function notifyLoot(item,wave){s.lootAlert={name:gearItem(item.slot,item.tier,item.upgrade||0).name,rarity:item.rarity||defaultRarity(item.tier),stats:statText(gearItem(item.slot,item.tier,item.upgrade||0).stats),wave,until:Date.now()+10000};}
function inventory(open=true){
 const dialog=$('#inventory');if(!dialog)return;const view=JSON.stringify([s.items,s.blueprints,s.equipmentBag,s.gear,s.gearRarities,!!battle,!!s.offlineQueue]);if(!open&&dialog.dataset.view===view)return;dialog.dataset.view=view;

const topics={Progression:['Beyond one lifetime','Defeat a boss and repay debt to prestige. Prestige resets this adventure, awards permanent bonuses and prestige Grave Essence, and retains talents. Spend that essence on the three talent paths. Crafting essence is separate. Fully cleared dungeons unlock offline queues with half rewards.'],Settlement:['A foothold in the dark','Gather wood, stone and food by starting a short task, then collect it. Manual yields grow with gathering practice, worker levels, and storage upgrades. Build your first production site to unlock dungeons. Hire workers to automate production; workers level as they work. Storage can be upgraded; each level costs more. Build a site, then use its highlighted Hire worker panel to automate gathering. Offline production is 50% of normal and stops when storage fills. Rescue specialists from deep dungeons and extract to bring them home: the blacksmith offers a paid workshop, the quartermaster sells limited food, and the scout surveys new routes for gold.'],Expeditions:['Beyond the gates','Choose one of three newly generated dungeons. The risk meter simulates your current team against all 15 waves to estimate a clear chance. Random attacks and critical hits mean it is a forecast, not a guarantee. Combat is automatic. Extract after waves 5 and 10 to secure your loot, or continue to the final boss. Defeat forfeits this run’s rewards. Pick one optional objective before entering for a small fixed extraction bonus. Lone descent leaves recruits at home; other objectives require elite waves or a safe party return. Equipment chance is capped at 18%, and Double Loot does not duplicate gear. Wave 10 can free a specialist; a final boss frees one missing resident. Rescue rewards require extraction and are unavailable in offline queues.'],Loadout:['Found, then reforged','Start with empty equipment slots. Cleared waves 5, 10, and 15 have a slim equipment-drop chance. Extract to keep a find, then equip it in Inventory. function log(t){s.log.unshift(t);s.log=s.log.slice(0,8)}
function save(){
 if(resetting)return;s.activeBattle=battle;s.last=Date.now();localStorage.setItem('gravehold',JSON.stringify(s));
 if(email){const body=JSON.stringify({state:s});syncPromise=syncPromise.catch(()=>{}).then(()=>fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body})).catch(()=>{});}
}
function cap(k){return 100+(s.buildings[k+'Storage']||0)*150}
function accrue(){const now=Date.now(),seconds=Math.max(0,(now-s.last)/1000);for(const [k,w]of Object.entries(s.workers)){s[k]=Math.min(cap(k),s[k]+seconds*(seconds>5?.5:1)*incomeRate(k));w.xp+=seconds;}s.last=now;if(s.heroDead&&s.recover&&now>=s.recover){s.heroDead=false;s.recover=0;s.heroRevives++;log('Your hero has recovered.');}if(s.foreman&&s.gather&&now>=s.gather.end)collectGather();resolveQueue();}

function pay(cost){if(Object.entries(cost).some(([k,v])=>s[k]<v))return false;for(const[k,v]of Object.entries(cost))s[k]-=v;return true}
function costText(c){return Object.entries(c).map(([k,v])=>`${v} ${k}`).join(' · ')}

function settlementScene(){return `<div class="settlement-vista"><div class="vista-sky"></div><div class="village-sites">${['wood','stone','food','barracks'].map((k,i)=>{const built=s.buildings[k],level=s.buildings[k+'Storage']||0;return `<div class="village-site ${built?'built':'planned'}"><span class="badge">${['WOODCUTTING','QUARRY','HOMESTEAD','BARRACKS'][i]}</span><svg viewBox="0 0 100 90" aria-hidden="true"><path d="M5 85h90" stroke="#738069" stroke-width="3"/>${built?`<path d="M20 ${50-Math.min(level,5)*4}h60v35H20z" fill="${['#665b48','#64717d','#6d7352','#635a75'][i]}"/><path d="M12 ${50-Math.min(level,5)*4}l38-30 38 30" fill="#333c48" stroke="#a3997f" stroke-width="3"/><path d="M40 85V65h20v20" fill="#1a202a"/><path d="M26 60h8v9h-8m40-9h8v9h-8" fill="#d6b57b"/>${level>=2?'<path d="M80 85V50h12v35" fill="#777965"/>':''}${level>=4?'<path d="M25 30V5h8v25" fill="#777965"/>':''}`:'<path d="M20 85V50h60v35M10 50l40-30 40 30" fill="none" stroke="#586573" stroke-dasharray="4"/>'}</svg><div class="village-people">${k==='barracks'?s.recruits.map(r=>`<span title="${escapeHtml(r.name||r.cls)}">${sprite(r.cls)}</span>`).join(''):s.workers[k]?`<span title="${k} worker · level ${1+Math.floor(s.workers[k].xp/300)}">${sprite({wood:'Woodcutter',stone:'Miner',food:'Farmer'}[k])}</span>`:''}</div><small>${built?k==='barracks'?s.recruits.length+' companions':'Storage level '+level:'Not built'}</small></div>`;}).join('')}</div><div class="specialist-residents">${['blacksmith','quartermaster','scout'].filter(k=>s.specialists[k]).map(k=>`<span title="${specialistInfo(k).role}">${sprite(k==='blacksmith'?'Miner':k==='quartermaster'?'Farmer':'Archer')}<small>${specialistInfo(k).name}</small></span>`).join('')}</div></div>`;}
function settlement(){return `${settlementScene()}<div class="grid">${['wood','stone','food'].map((k,i)=>{
 const built=s.buildings[k],w=s.workers[k],cost={wood:20,stone:10},profession=['woodcutter','miner','farmer'][i],storage=storageCost(k);
 return `<section class="card"><div class="row"><span class="icon">${['♧','◆','❧'][i]}</span><span class="badge">${built?'BUILT':'UNBUILT'}</span></div><h3>${['Woodcutting camp','Stone quarry','Homestead'][i]}</h3><p>${w?`Worker level ${1+Math.floor(w.xp/300)} · ${incomeRate(k).toFixed(2)}/sec`:'Gather by hand to establish your first production site.'}</p><div class="bar"><span style="width:${s[k]/cap(k)*100}%"></span></div><div class="muted">${Math.floor(s[k])} / ${cap(k)} stored</div>
 ${s.gather?.kind===k?btn(Date.now()>=s.gather.end?'Collect +'+(s.gather.amount??gatherYield(k)):`Gathering… ${Math.ceil((s.gather.end-Date.now())/1000)}s`,'collect',Date.now()<s.gather.end):btn('Gather '+k,'gather:'+k,!!s.gather)}<small class="gather-bonus">Manual gather: +${gatherYield(k)} ${k} / 8 sec · grows with practice, workers & storage</small>
 ${!built?`<div class="hiring"><strong>1. Build your production site</strong><p>${costText(cost)}</p>${btn('Build site →','build:'+k,!canAfford(cost))}<small>Building unlocks a ${profession} position.</small></div>`:!w?`<div class="hiring"><span class="badge">VACANT POSITION · 0 / 1</span><h3>Hire a ${profession}</h3><p>Automatically gathers ${k}, even while you are away.<br>Cost: 20 wood · 15 food</p><small class="effect-preview">+${(1+s.meta.prestiges*.05).toFixed(2)}/sec income · manual gather +4</small>${btn('Hire '+profession+' →','worker:'+k,!canAfford({wood:20,food:15}))}<small>${canAfford({wood:20,food:15})?'Ready to hire':'Gather more wood and food to hire.'}</small></div>`:`<div class="hiring"><span class="badge">${profession.toUpperCase()} EMPLOYED · 1 / 1</span><p>Your worker is gathering ${k}.</p><small class="effect-preview">Income ${incomeRate(k).toFixed(2)} → ${(incomeRate(k)+.2*(1+s.meta.prestiges*.05)).toFixed(2)}/sec · manual gather +4</small>${btn('Train · '+(30+Math.floor(w.xp/300)*15)+' '+k,'train:'+k)}</div>`}
 <details class="storage-info" data-panel="storage:${k}"><summary>Storage · ${cap(k)} capacity</summary><span class="muted">Storage level ${s.buildings[k+'Storage']||0} → ${(s.buildings[k+'Storage']||0)+1}</span><p>+150 capacity · ${costText(storage)}</p><small class="effect-preview">Capacity ${cap(k)} → ${cap(k)+150} · manual gather +4</small>${btn('Upgrade storage','storage:'+k,!canAfford(storage))}</details></section>`;
 }).join('')}</div><details class="history-panel" data-panel="settlement-milestones"><summary>Settlement milestones · ${s.buildings.barracks?'barracks built':'establish your barracks'}</summary>${connectionPanel()}${foremanPanel()}</details>${specialistsPanel()}`;}
function choices(){if(!s.choices)s.choices=[0,1,2].map((d)=>({d,name:[['Hollow Crypt','Ashen Chapel','Forgotten Tomb'],['Bleak Catacombs','Widow’s Keep','Sunken Abbey'],['Blood Cathedral','Throne of Cinders','The Black Ossuary']][d][Math.floor(Math.random()*3)],mod:.9+Math.random()*.2,modifier:['none','double','elite','wounded'][Math.floor(Math.random()*4)]}));}
function power(){const h=heroStats();return h.attack*2+h.defense*2+h.health/5+s.recruits.filter(r=>!r.dead).reduce((a,r)=>a+3+Math.floor(r.level/4),0);}
function chance(d,mod=1,modifier="none"){
 const key=JSON.stringify([heroStats(),s.recruits.map(r=>[r.cls,r.level,r.dead,r.loyalty||0]),d,mod,modifier,s.objective]);if(riskCache.has(key))return riskCache.get(key);
 const originalState=s,originalBattle=battle;let wins=0;
 try{estimating=true;for(let run=0;run<24;run++){
  s=JSON.parse(JSON.stringify(originalState));startBattle({d,mod,modifier,objective:s.objective,name:'Forecast'});
  for(let beat=0;beat<750&&!battle.result;beat++){
   if(battle.checkpoint)continueBattle();tickBattle();
  }
  if(battle.result==='win')wins++;
 }}finally{s=originalState;battle=originalBattle;estimating=false;}
 const result=Math.round(wins/24*100/5)*5;if(riskCache.size>40)riskCache.clear();riskCache.set(key,result);return result;
}

function expeditions(){if(battle)return arena();if(!Object.keys(s.buildings).some(k=>['wood','stone','food'].includes(k)))return `<div class="notice">Build a production site in Settlement to unlock dungeons.</div>`;choices();const h=settlementSupport();return `<div class="dungeon-selection"><div class="row descent-heading"><h2>Choose your descent</h2><span class="muted">15 waves · extract every 5</span></div><div class="reward-focus"><span class="muted">Reward focus</span>${['balanced','gold','materials','equipment'].map(k=>`<button data-action="focus:${k}" class="${s.rewardFocus===k?'chosen':''}" ${s.offlineQueue?'disabled':''}>${{balanced:'Balanced',gold:'Gold +60%',materials:'Materials ×2',equipment:'Gear chance +75%'}[k]}</button>`).join('')}<small>Same enemies. Gear chance is capped at 18%; materials focus boosts blueprint chance by 50%.</small></div>${objectivePanel()}<div class="grid">${s.choices.map(c=>`<section class="card"><span class="badge">${['EASY','MEDIUM','HARD'][c.d]}</span><h3>${escapeHtml(c.name)}</h3><div class="row"><span class="muted">Clear chance</span><strong class="gold">${chance(c.d,c.mod,c.modifier)}%</strong></div><div class="bar"><span style="width:${chance(c.d,c.mod,c.modifier)}%"></span></div><p class="dungeon-modifier"><span title="${MODIFIERS[c.modifier||'none'].help}">${MODIFIERS[c.modifier||'none'].name}</span> · Loot ×${(c.d+1)*(c.modifier==='double'?2:1)}</p>${btn('Enter dungeon →','enter:'+c.d,s.heroDead||s.offlineQueue)}</section>`).join('')}</div></div>${s.heroDead?'<div class="notice">Your hero needs revival. Visit the treasury.</div>':s.offlineQueue?'<div class="notice">Your hero is away on a queued expedition.</div>':''}<div class="expedition-extras"><details class="history-panel" data-panel="expedition-support"><summary>Settlement support · +${h.attack} attack · +${h.defense} defense · +${h.health} HP</summary>${connectionPanel()}</details>${expeditionHistory()}${queuePanel()}${s.lastExpedition?`<details class="history-panel" data-panel="previous-rewards"><summary>Last expedition · wave ${s.lastExpedition.wave} · ${s.lastExpedition.won?'rewards secured':'defeated'}</summary>${expeditionResult()}</details>`:''}</div>`;}

function sprite(kind){
 const hero=kind==='hero',boss=kind==='boss',archer=kind==='Archer'||kind==='enemyArcher',healer=kind==='Healer',undead=['enemy','enemyArcher','boss'].includes(kind);
 const armor=hero?(s.gear.body<0?'#857661':'#9caabc'):kind==='Warrior'?'#788ea5':archer?'#617963':healer?'#b0a7bd':boss?'#785575':'#6c7489',trim=boss?'#edbd75':hero?'#dac28b':'#acb7ba',skin=undead?'#c2c2ae':'#d1a57d';
 const weapon=['Woodcutter','Miner','Farmer'].includes(kind)?`<path d="M31 17v24" stroke="#b59566" stroke-width="2"/><path d="${kind==='Woodcutter'?'M28 17h9v7h-9z':kind==='Miner'?'M24 17l7-3 7 3v3l-7-2-7 2z':'M29 10v10m3-8v8m3-10v10'}" fill="${kind==='Farmer'?'#d6bc70':'#a8b6bf'}" stroke="#a8b6bf"/>`:archer?'<path d="M28 15q12 10 0 22" fill="none" stroke="#bb9057" stroke-width="2"/><path d="M28 15v22m-3-11h13" stroke="#d7ccb0"/>':healer?'<path d="M31 14v28" stroke="#927956" stroke-width="2"/><path d="M31 9l4 6-4 6-4-6z" fill="#93d5c4"/><path d="M31 12v6" stroke="#e5fff3"/>':hero&&s.gear.weapon<0?'<path d="M28 27h5v5h-5" fill="#d1a57d"/>':'<path d="M31 9h3v22h-3z" fill="#c2cfda"/><path d="M31 9h1v21h-1" fill="#eef0df"/><path d="M28 29h9v2h-9m4 2h2v7h-2" fill="#ceb079"/>';
 return `<svg width="80" height="100" viewBox="0 0 40 50" shape-rendering="crispEdges" role="img" aria-label="${kind} pixel portrait"><ellipse cx="20" cy="47" rx="15" ry="2" fill="#050811" opacity=".6"/><path d="M11 19h16l5 24H7z" fill="${boss?'#513d62':hero?'#633d45':'#354456'}"/><path d="M14 35h5v10h-9v-3h4m8-7h5v7h4v3h-9" fill="#343846"/><path d="M14 35h2v7h-2m8-7h2v7h-2" fill="#626573"/><path d="M12 19h16v17H12z" fill="${armor}"/><path d="M14 20h3v12h-3m4-12h9v3h-9" fill="${trim}" opacity=".6"/><path d="M10 19h5v7H9m17-7h5v7h-5" fill="${armor}"/><path d="M10 26h4v7h-4m17-7h4v7h-4" fill="${skin}"/><path d="M12 32h16v3H12" fill="#39313a"/><path d="M18 32h4v3h-4" fill="${trim}"/><path d="M13 6h13v13H13z" fill="${hero&&s.gear.head<0?'#473b3b':armor}"/><path d="M15 11h9v7h-9" fill="${skin}"/><path d="M15 12h3v2h-3m6-2h3v2h-3" fill="${undead?'#d37575':'#222c39'}"/><path d="M16 16h7v2h-7" fill="${undead?'#6a6570':'#735745'}"/><path d="M12 7h15v3H12m2-5h11v2H14" fill="${trim}"/>${boss?'<path d="M12 1l3 4 4-4 3 4 5-4v6H12" fill="#dcb476"/>':''}${weapon}${kind==='Warrior'?'<path d="M3 23h9v12l-4 5-5-5z" fill="#53647c" stroke="#acb7ba"/><path d="M7 25v11" stroke="#c9b580"/>':''}</svg>`;
}

function unitCard(u,enemy=false){
 const event=u.event,dead=u.hp<=0,active=event&&event.beat===battle.beat&&battle.phase==='combat'&&!battle.checkpoint&&u.hp>0,hero=u.role==='Hero',support=!enemy&&!hero;
 return `<div class="combat-unit ${hero?'hero-unit':support?'support-unit':'hostile'} ${dead?'fallen':''}" data-unit="${u.id}" data-hp="${u.hp}" title="${escapeHtml(u.name)}: ${Math.ceil(u.hp)}/${u.maxHp} HP · ${u.attack} attack · ${u.defense} defense"><div class="unit-label">${hero?'YOUR HERO':escapeHtml(support?u.role:u.name)}</div><div class="unit-sprite ${active&&event.kind==='attack'?'attacking':''} ${active&&event.kind==='damage'?'struck':''}">${sprite(u.kind)}${active?`<span class="combat-number ${event.kind}">${escapeHtml(event.text)}</span>`:''}</div><div class="unit-hp"><span style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></span></div><strong>${Math.ceil(Math.max(0,u.hp))} / ${u.maxHp}${hero?' HP':''}</strong>${dead?'<small>Fallen</small>':''}</div>`;
}
function lootSummary(loot){return [['gold','Gold'],['wood','Wood'],['stone','Stone'],['food','Food'],...Object.entries(MATERIALS).map(([k,v])=>[k,v.name]),['blueprints','Blueprints']].map(([k,label])=>`<span>${label} <strong>${loot[k]||0}</strong></span>`).join('');}
function spoilsPanel(loot,secured){const finds=loot.equipment||[];return `<section class="spoils-visible ${secured?'secured':''}"><div class="row"><div><span class="eyebrow">${secured?'Brought home':'At risk until extraction'}</span><h3>${secured?'Expedition rewards':'Dungeon spoils'}</h3></div><strong class="spoils-gold">◈ ${loot.gold||0}<small>GOLD</small></strong></div><div class="spoils-counts">${[...Object.entries(MATERIALS).map(([k,v])=>[k,v.name]),['blueprints','Blueprints']].map(([k,name])=>`<span>${name}<strong>${loot[k]||0}</strong></span>`).join('')}</div>${finds.length?`<div class="rare-loot"><span class="badge">${finds.length} RARE EQUIPMENT ${secured?'SECURED':'FOUND'}</span>${equipmentList(finds)}</div>`:''}<details data-panel="farm-spoils"><summary>Farm supplies</summary><div class="loot-grid">${['wood','stone','food'].map(k=>`<span>${k}<strong>${loot[k]||0}</strong></span>`).join('')}</div></details></section>`;}
function expeditionResult(){if(!s.lastExpedition)return '';const r=s.lastExpedition;return r.won?`<div class="last-result">${reportPanel(r.report)}${r.objective?`<p class="notice">Objective completed: ${r.objective}</p>`:''}${r.rescue?`<p class="notice">${specialistInfo(r.rescue).name} arrived in the settlement.</p>`:''}${spoilsPanel(r.loot,true)}${(r.loot.equipment||[]).length?btn('Equip your finds →','inventory'):''}</div>`:` ${reportPanel(r.report)}<div class="notice">Your last expedition ended at wave ${r.wave}. Unsecured loot was lost.</div>`;}
function arena(){ensureBattle();const remaining=battle.enemies.filter(u=>u.hp>0).length;
 return `<section class="battle-shell"><div class="battle-heading"><div><div class="eyebrow" title="${MODIFIERS[battle.modifier||'none'].help}">${['Easy','Medium','Hard'][battle.d]} · ${battle.focus||'balanced'} rewards · ${MODIFIERS[battle.modifier||'none'].name}</div><h2>${escapeHtml(battle.name)}</h2></div><div class="battle-stage"><strong>Wave ${battle.wave}<span> / 15</span></strong><small>${battle.checkpoint?'Checkpoint':battle.phase==='between'?'Wave cleared':remaining+' enemies remaining'}</small></div></div>
 <div class="wave-track" aria-label="Wave ${battle.wave} of 15">${Array.from({length:15},(_,i)=>`<i class="${i+1<battle.wave?'cleared':i+1===battle.wave?'current':''} ${(i+1)%5===0?'checkpoint-mark':''}"></i>`).join('')}</div>
 <div class="arena battle-scene"><div class="crypt-backdrop" aria-hidden="true"><svg viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="crypt-stone" x2="0" y2="1"><stop stop-color="#24283b"/><stop offset="1" stop-color="#101420"/></linearGradient><radialGradient id="torch-light"><stop stop-color="#ffba57" stop-opacity=".3"/><stop offset="1" stop-color="#ffba57" stop-opacity="0"/></radialGradient><pattern id="crypt-brick" width="100" height="52" patternUnits="userSpaceOnUse"><path d="M0 0h100v52H0zM50 0v26M0 26h100" fill="none" stroke="#404252" stroke-opacity=".3"/></pattern></defs><path fill="url(#crypt-stone)" d="M0 0h1000v400H0z"/><path fill="url(#crypt-brick)" d="M0 0h1000v330H0z"/>${[130,410,690].map(x=>`<path d="M${x} 320V150a90 90 0 0 1 180 0v170" fill="#0b0e18" stroke="#414151" stroke-width="16"/><path d="M${x+30} 320V160a60 60 0 0 1 120 0v160" fill="#121523" stroke="#24283a" stroke-width="5"/>`).join('')}<path d="M0 325h1000v75H0" fill="#292735"/><path d="M0 335h1000M0 365h1000M100 335l-35 65m245-65-20 65m400-65 20 65m245-65 35 65" stroke="#4e4550" stroke-width="2"/>${[80,920].map(x=>`<circle cx="${x}" cy="160" r="160" fill="url(#torch-light)"/><path d="M${x-5} 170h10v40h-10" fill="#665047"/><path d="M${x} 130l-12 28 12 18 12-18z" fill="#e69848"/><path d="M${x} 145l-6 18 6 9 6-9z" fill="#ffe4a0"/>`).join('')}<path d="M0 399h1000" stroke="#827064" stroke-width="4"/></svg></div><div class="battle-side hero-side"><div class="support-line">${battle.allies.slice(1).map(u=>unitCard(u)).join('')}</div>${unitCard(battle.allies[0])}</div><div class="battle-side enemies">${battle.enemies.map(u=>unitCard(u,true)).join('')}</div></div>
 <div class="combat-caption" aria-live="polite">${escapeHtml(battle.events[0]||'Your hero leads the expedition.')}</div>
 ${battle.checkpoint?`<div class="checkpoint-actions"><span>Rest or retreat? <small>Continuing restores 20% HP to survivors.</small></span><div>${btn('Extract loot','extract')}${btn('Continue →','continue')}</div></div>`:''}
 ${battle.objective&&battle.objective!=='none'?`<div class="battle-objective">${objectiveInfo(battle.objective).name} · ${objectiveStatus(battle)?'Ready to claim on extraction':objectiveInfo(battle.objective).help}</div>`:''}${battle.rescue?`<div class="battle-objective">${specialistInfo(battle.rescue).name} rescued · extract to bring them home</div>`:''}${spoilsPanel(battle.loot,false)}<div class="battle-bottom"><details class="combat-log" data-panel="combat-log"><summary>Battle log</summary><div class="battle-events">${battle.events.slice(0,8).map(x=>`<div>${escapeHtml(x)}</div>`).join('')}</div></details></div></section>`;
}
function equipmentIcon(key,tier=-1,rarity="common"){
 const metal=tier<=0?'#99896a':tier===1?'#9caabc':tier===2?'#76899b':tier===3?'#8b739b':'#b59a66',shadow=tier<=0?'#665946':'#505d72',edge=tier<=0?'#ddc58c':'#d2d6c6',gem={common:'#b6bec5',uncommon:'#8ab38a',rare:'#7aaff2',epic:'#bc90e5',legendary:'#edd082'}[rarity]||'#b6bec5';

 return `<svg class="item-icon pixel-item" viewBox="0 0 24 24" width="40" height="40" shape-rendering="crispEdges" aria-hidden="true"><ellipse cx="12" cy="22" rx="9" ry="1" fill="#080d16" opacity=".5"/><g opacity="${tier<0?.45:1}">${shapes[key]||shapes.body}${tier>=2&&['head','body','shield'].includes(key)?`<path d="M11 6h2v2h-2" fill="${gem}"/>`:''}</g></svg>`;
}

function itemComparison(item){const before=heroStats(),key=item.slot,old=[s.gear[key],s.gearUpgrades[key],s.gearRarities[key]];let after;try{s.gear[key]=item.tier;s.gearUpgrades[key]=item.upgrade||0;s.gearRarities[key]=item.rarity||defaultRarity(item.tier);after=heroStats();}finally{[s.gear[key],s.gearUpgrades[key],s.gearRarities[key]]=old;}const delta={};for(const k of Object.keys(before)){const v=Math.round((after[k]-before[k])*1000)/1000;if(v)delta[k]=v;}return delta;}
function comparisonText(delta){return Object.entries(delta).map(([k,v])=>`${v>0?'+':'−'}${['crit','evade','leech'].includes(k)?Math.round(Math.abs(v)*100)+'%':Math.abs(v)} ${k==='health'?'HP':k==='leech'?'life steal':k}`).join(' · ')||'Same combat stats';}
function itemScore(delta){return (delta.attack||0)*2+(delta.defense||0)*2+(delta.health||0)/5+(delta.crit||0)*80+(delta.evade||0)*100+(delta.leech||0)*80;}
function rankedItems(slot){return s.equipmentBag.map((item,index)=>({item,index,delta:itemComparison(item)})).filter(x=>x.item.slot===slot).sort((a,b)=>itemScore(b.delta)-itemScore(a.delta)||Object.keys(RARITIES).indexOf(b.item.rarity)-Object.keys(RARITIES).indexOf(a.item.rarity)||b.item.tier-a.item.tier);}
function armoryFind(item,index,recent=false){const info=gearItem(item.slot,item.tier,item.upgrade||0),delta=itemComparison(item),score=itemScore(delta);return `<article class="armory-find rarity-${item.rarity||defaultRarity(item.tier)}"><button class="find-icon" data-action="slot:${item.slot}" aria-label="Inspect ${info.name}">${equipmentIcon(item.slot,item.tier,item.rarity)}</button><button class="find-info" data-action="slot:${item.slot}"><strong>${info.name}${info.upgrade?' +'+info.upgrade:''}</strong><small>${RARITIES[item.rarity||defaultRarity(item.tier)].label} · ${SLOTS.find(x=>x.key===item.slot).label}</small><span class="stat-comparison ${score>0?'gain':score<0?'loss':''}">${comparisonText(delta)}</span></button><div class="find-actions">${btn('Equip','equip:'+index,!!battle||!!s.offlineQueue)}${btn('Salvage','salvage:'+index,!!battle||!!s.offlineQueue)}${recent?btn('Dismiss','dismiss:'+index):''}</div></article>`;}
function newFinds(){const items=s.equipmentBag.map((item,index)=>({item,index})).filter(x=>x.item.newFind!==false).reverse().slice(0,5);return `<section class="card new-finds"><div class="row"><h3>New finds</h3><span class="badge">${items.length} / 5</span></div>${items.length?items.map(x=>armoryFind(x.item,x.index,true)).join(''):'<p class="muted">No new finds. Extract with gear to fill this list.</p>'}</section>`;}
function slotOptions(){const options=rankedItems(selectedSlot);return `<section class="card slot-options"><div class="row"><h3>Available ${SLOTS.find(x=>x.key===selectedSlot).label.toLowerCase()} equipment</h3><span class="badge">${options.length} ITEMS</span></div>${options.length?'<p class="muted">Best combat gains first. Comparisons include hero bonuses and equipment sets.</p>':''}${options.length?options.map(x=>armoryFind(x.item,x.index)).join(''):'<p class="muted">No spare items for this slot yet.</p>'}</section>`;}
function loadout(){const active=selectedSlot||"weapon",h=heroStats(),item=gearItem(active),slot=SLOTS.find(x=>x.key===active),cost=forgeCost(active),upgrade=upgradeCost(active),next=Math.max(1,s.gear[active]+1);
 return `<div class="loadout-layout">${newFinds()}<section class="card equipment"><div class="row"><h3>Equipment</h3><span class="badge">${SLOTS.filter(x=>s.gear[x.key]>=0).length} / 10</span></div><div class="equipment-grid"><div class="loadout-portrait">${sprite("hero")}<span>THE WARDEN</span></div>${SLOTS.map(x=>{const it=gearItem(x.key);return `<button class="equipment-slot rarity-${s.gearRarities[x.key]} ${selectedSlot===x.key?'selected':''} ${it?'':'empty'}" style="grid-row:${({neck:2,body:3,legs:4,shield:4})[x.key]||x.row};grid-column:${({neck:3,body:3,legs:3,shield:1})[x.key]||x.col}" data-action="slot:${x.key}" aria-label="${x.label} slot: ${it?it.name:'empty'}" title="${it?it.name:'Empty '+x.label}"><span>${equipmentIcon(x.key,it?.tier??-1,s.gearRarities[x.key])}</span><strong>${x.label}</strong></button>`}).join('')}</div>
 <p class="set-status">Gravewarden set: ${SLOTS.filter(x=>s.gear[x.key]===2).length}/3 · ${SLOTS.filter(x=>s.gear[x.key]===2).length>=3?'active +10% HP':'3 pieces grant +10% HP'}</p><div class="hero-stats"><span>Attack <strong>${h.attack}</strong></span><span>Defense <strong>${h.defense}</strong></span><span>HP <strong>${h.health}</strong></span><details class="loadout-bonuses" data-panel="bonuses"><summary>Combat bonuses</summary><div class="secondary-stats"><span>Critical <strong>${Math.round(h.crit*100)}%</strong></span><span>Evasion <strong>${Math.round(h.evade*100)}%</strong></span><span>Life steal <strong>${Math.round(h.leech*100)}%</strong></span></div></details></div></section>
 ${selectedSlot?`${slotOptions()}<section class="card item-detail"><div class="eyebrow">The armory · inspect & improve</div><div class="eyebrow">${slot.label} slot</div><div class="selected-item"><div class="icon">${equipmentIcon(slot.key,item?.tier??-1,s.gearRarities[active])}</div><div><h2>${item?item.name:'Empty slot'}</h2><span class="badge rarity-${s.gearRarities[selectedSlot]}">${item?RARITIES[s.gearRarities[selectedSlot]].label+' · TIER '+item.tier+(item.upgrade?' · +'+item.upgrade:''):'UNEQUIPPED'}</span></div></div><p class="item-stats">${item?statText(item.stats):'Find equipment at five-wave milestones. Available pieces appear above.'}</p>
 <div class="item-actions">${item?`<div>${btn('Upgrade item','upgrade:'+selectedSlot,s.gold<upgrade.gold||s.items.iron<upgrade.iron)}<small>${costText(upgrade)}</small><small class="effect-preview">After upgrade: ${statText(gearItem(selectedSlot,item.tier,item.upgrade+1).stats)}</small></div>`:''}${item?`<div>${btn('Forge tier '+next+' →','craft:'+selectedSlot,!canCraft(selectedSlot))}<small>1 blueprint · ${cost.gold} gold + rare materials</small><small class="effect-preview">Next tier: ${statText(gearItem(selectedSlot,next,0).stats)}</small></div>`:''}</div>
 ${item?`<details class="recipe" data-panel="recipe:${selectedSlot}"><summary>Recipe & next-tier stats</summary><p>${costText(cost)} · 1 blueprint</p><p class="gold">${statText(gearItem(selectedSlot,next,0).stats)}</p><small class="muted">${item?'Replaces this item. Upgrades reset when forging.':'Creates and equips this piece.'}</small></details>`:btn('Open inventory','inventory')}<p class="slot-hint">Choose another slot to inspect it.<br>Materials are stored in your inventory.</p></section>`:'<section class="card slot-options empty-options"><h3>Available equipment</h3><p class="muted">Select a hero slot to compare items.</p></section>'}</div>`;
}
function recruits(){return `<div class="row"><h2>Your companions</h2><span class="badge">${s.recruits.length} / 3</span></div>${!s.recruits.length?'<p class="muted">Build the barracks to welcome your first companion.</p>':''}<div class="grid recruit-grid">${s.recruits.map((r,i)=>{const u=recruitUnit(r,i),next=recruitUnit({...r,level:r.level+1},i);return `<section class="card"><div class="recruit-portrait">${sprite(r.cls)}</div><h3>${escapeHtml(r.name||recruitName(r.cls,i))}</h3><span class="badge">${r.cls} · LEVEL ${r.level}</span><p>${u.maxHp} HP · ${u.attack} attack · ${u.defense} defense<br>${r.cls==='Healer'?3+Math.floor(r.level/4)+(r.level>=5?1:0)+' healing / cast':Math.round(u.crit*100)+'% personal crit'}</p><div class="bar"><span style="width:${r.xp/20*100}%"></span></div><small class="muted">${r.xp}/20 expeditions toward level ${r.level+1}</small><p class="effect-preview">Next level: +2 HP${next.attack>u.attack?' · +1 attack':''}${r.cls==='Healer'&&((r.level+1)%4===0)?' · +1 healing':''}${r.level===4?' · unlock '+recruitTrait(r):''}</p><details data-panel="recruit:${i}"><summary>Specialization & growth</summary><p>${{Warrior:'+5% hero defense',Archer:'+3% hero crit',Healer:'+5 hero HP'}[r.cls]} while alive.<br>Every level: +2 personal HP. Every fourth level: +1 personal attack.${r.cls==='Healer'?' Healing also improves every fourth level.':''}<br>${r.level>=5?'✓':'Level 5 unlock:'} ${recruitTrait(r)}</p><div class="bond-status"><span class="badge">LOYALTY ${r.loyalty||0}/30</span><p>${bondStory(r)}</p><small class="muted">One loyalty per survived return after wave 5. At 30: +2 personal HP, once.</small></div></details>${r.dead?btn('Revive · '+costText(reviveCost(r)),'revive:'+i):'<p class="badge">READY TO MARCH</p>'}</section>`;}).join('')}</div><details class="history-panel" data-panel="hiring"><summary>Recruit companions · ${s.buildings.barracks?'barracks ready':'barracks required'}</summary><div class="grid recruit-grid">${['Warrior','Archer','Healer'].map(cls=>`<section class="card"><div class="recruit-portrait">${sprite(cls)}</div><h3>${cls}</h3><p>${{Warrior:'+5% hero defense',Archer:'+3% hero critical chance',Healer:'+5 hero HP and small heals'}[cls]}</p>${btn('Hire · '+costText(recruitCost()),'recruit:'+cls,s.recruits.length>=3||!s.buildings.barracks||!canAfford(recruitCost()))}</section>`).join('')}</div></details><details class="history-panel" data-panel="recruit-support"><summary>Barracks & settlement requirements</summary>${connectionPanel()}</details>`;}

function treasury(){return `<div class="grid"><div class="card"><h3>Hero recovery</h3><p>${s.heroDead?'Your hero fell in the dungeon.':'Your hero is ready to descend.'}</p>${btn('Revive · '+costText(reviveCost()),'hero',!s.heroDead)}<p class="muted">Revived ${s.heroRevives} times · each revival increases the next cost.</p>${btn('Emergency revival loan','loan',!s.heroDead||s.debt+s.interest>0)}${s.heroDead&&s.debt+s.interest>0?btn(s.recover?'Recovering · '+Math.max(0,Math.ceil((s.recover-Date.now())/1000))+'s':'Begin free recovery · 5 min','recover',!!s.recover):''}</div><div class="card"><h3>Outstanding loan</h3><p>Principal: ${s.debt.toFixed(2)} gold<br>Interest: ${s.interest.toFixed(2)} gold<br>Expeditions until interest: ${5-s.loanRuns}</p><details data-panel="loan-info"><summary>Loan terms</summary><p>1% of principal every five completed expeditions. No offline interest. Further borrowing is blocked until paid.</p></details>${btn('Repay up to 10 gold','repay',s.debt+s.interest<=0||s.gold<=0)}</div></div>`}
function render(){const focusedResource=document.activeElement?.dataset?.resource;for(const d of document.querySelectorAll('#app details[data-panel]'))openPanels[d.dataset.panel]=d.open;accrue();$('#app').innerHTML=`<div class="layout"><aside><div class="brand">✧ GRAVEHOLD</div><div class="subtitle">FROM ASHES, A KINGDOM</div><nav>${['Settlement','Expeditions','Loadout','Recruits','Treasury','Progression'].map((t,i)=>`<button data-tab="${t}" class="${tab===t?'active':''}">${['♧','⚔','▣','♙','◈','✧'][i]} &nbsp; ${t}</button>`).join('')}</nav><div class="muted" style="margin-top:50px">The darkness waits.<br>Build something that lasts.</div></aside><main><div class="top"><div class="resources">${['wood','stone','food','gold'].map((k,i)=>`<div class="resource" data-resource="${k}" tabindex="0" aria-label="${resourceTooltip(k)}" aria-describedby="resource-tip-${k}"><span>${['♧','◆','❧','◈'][i]} ${Math.floor(s[k])}${k==='gold'?'':'/'+cap(k)}</span><small>${k.toUpperCase()} ${k==='gold'?'':s[k]>=cap(k)?'· FULL':`· +${incomeRate(k).toFixed(1)}/s`}</small><span class="resource-tip" id="resource-tip-${k}" role="tooltip">${resourceTooltip(k)}</span></div>`).join('')}</div><div>${btn('Inventory','inventory')} ${btn('Journal','journal')} ${btn(email?'Account':'Sign in','account')}</div></div>${capacityWarnings()}${lootNotification()}<div class="intro"><div><div class="eyebrow">Chapter I · A fragile beginning</div><h1>${tab==='Settlement'?'Your settlement':tab}</h1><span class="muted">${tab==='Settlement'?'Raise a sanctuary. Prepare for what lies below.':topics[tab][0]}</span></div></div>${({Settlement:settlement,Expeditions:expeditions,Loadout:loadout,Recruits:recruits,Treasury:treasury,Progression:progression})[tab]()}<div class="feed">${s.log.slice(0,3).map(t=>`<p>✦ ${t}</p>`).join('')}</div><footer>${email?'ACCOUNT SAVE ENABLED':'GUEST PROGRESS · SAVED ON THIS BROWSER'} · GRAVEHOLD ${btn('Save settings','settings')}</footer></main></div>`;for(const d of document.querySelectorAll('#app details[data-panel]'))d.open=!!openPanels[d.dataset.panel];if(focusedResource)document.querySelector('[data-resource="'+focusedResource+'"]')?.focus({preventScroll:true});if($('#inventory')?.open)inventory(false);}
function lootNotification(){const a=s.lootAlert;return a&&a.until>Date.now()?`<div class="loot-notification rarity-${a.rarity}"><span>✦ EQUIPMENT DISCOVERED · ${RARITIES[a.rarity].label.toUpperCase()}</span><strong>${escapeHtml(a.name)}</strong><small>${a.stats} · wave ${a.wave} · extract to secure</small></div>`:'';}
function journal(topic=tab){const d=$('#journal');d.innerHTML=`<div class="eyebrow">The survivor’s journal</div><h2>${topics[topic][0]}</h2><p class="muted">${topics[topic][1]}</p><div>${Object.keys(topics).map(t=>`<button data-topic="${t}">${t}</button>`).join(' ')}</div><p>${btn('Understood','close')}</p><label class="tutorial-toggle"><input type="checkbox" id="tutorials-off" ${s.tutorialsDisabled?'checked':''}> Don’t show tutorials again</label>`;if(!d.open)d.showModal();if(!s.seen.includes(topic)){s.seen.push(topic);save()}}

function finish(win){
 if(estimating){battle.result=win?'win':'loss';return;}
 awardObjective(battle,win);settleRescue(battle,win);s.lastExpedition={objective:win&&battle.objectiveAwarded?objectiveInfo(battle.objective).name:null,rescue:win?battle.rescue:null,report:battleReport(win),won:win,wave:battle.wave||0,loot:JSON.parse(JSON.stringify(battle.loot))};
 if(win){s.equipmentBag.push(...(battle.loot.equipment||[]));for(const k of ['gold','wood','stone','food'])s[k]=k==='gold'?s[k]+(battle.loot[k]||0):Math.min(cap(k),s[k]+(battle.loot[k]||0));
 for(const k of Object.keys(MATERIALS))s.items[k]+=(battle.loot[k]||0);s.blueprints+=battle.loot.blueprints||0;log('Returned safely with '+battle.loot.gold+' gold and crafting supplies.');
 }else{s.heroDead=true;log('The hero fell. Unsecured rewards were lost.');}
 recordRun(win,battle.wave||0,battle.loot,battle);
 battle=null;s.choices=null;save();render();
}
function recruitName(cls,i){return ({Warrior:['Aldric','Bran','Oswin'],Archer:['Mira','Rowan','Ash'],Healer:['Elara','Sable','Iona']}[cls]||['Traveler'])[i%3];}
function recruitTrait(r){return r.cls==='Warrior'?'Steadfast · +1 personal defense':r.cls==='Archer'?'Keen eye · +2% personal crit':'Mercy · +1 healing per cast';}
function recruitUnit(r,i){const level=r.level||1,warrior=r.cls==='Warrior',archer=r.cls==='Archer';const hp=(warrior?23:archer?17:19)+level*2+((r.loyalty||0)>=30?2:0);return {id:'recruit-'+i,name:r.name||recruitName(r.cls,i),kind:r.cls,role:r.cls,index:i,maxHp:hp,hp:r.dead?0:hp,attack:(archer?3:warrior?2:1)+Math.floor(level/4),defense:(warrior?2:0)+(warrior&&level>=5?1:0),crit:(archer?.06:.02)+(archer&&level>=5?.02:0),evade:0,leech:0};}
function combatStats(){return battle.stats??={damage:{},healing:{},taken:0,lastHit:null};}
function battleReport(won){const t=combatStats();return {...JSON.parse(JSON.stringify(t)),won,recommendation:won?'Invest secured rewards in your next equipment upgrade.':t.lastHit?.role==='Boss'?'More defense and HP would help against the boss.':battle.allies.slice(1).some(u=>u.hp<=0)?'Revive fallen companions and improve hero defense before returning.':'Try an easier route or upgrade hero HP and defense before returning.'};}
function reportPanel(r){if(!r)return '';return `<section class="report-panel"><span class="eyebrow">Expedition debrief</span><div class="history-stats"><span>Hero damage<strong>${r.damage.hero||0}</strong></span><span>Support damage<strong>${Object.entries(r.damage).filter(([k])=>k!=='hero').reduce((a,[,v])=>a+v,0)}</strong></span><span>Healing<strong>${Object.values(r.healing).reduce((a,v)=>a+v,0)}</strong></span><span>Damage received<strong>${r.taken}</strong></span></div><details data-panel="report-contributions"><summary>Individual contributions</summary>${[...new Set([...Object.keys(r.damage),...Object.keys(r.healing)])].map(k=>`<p>${escapeHtml(k==='hero'?'Hero':s.recruits[Number(k.split('-')[1])]?.name||'Companion')}: ${r.damage[k]||0} damage · ${r.healing[k]||0} healing</p>`).join('')}</details><p>${r.won?'Returned safely.':r.lastHit?`Defeated by ${escapeHtml(r.lastHit.name)} · ${r.lastHit.damage} final damage.`:'Your hero fell.'} ${r.recommendation}</p></section>`;}

function startBattle(c){const h=heroStats(c.objective!=="solo");battle={balance:4,...c,wave:1,beat:0,checkpoint:false,phase:'combat',clearedWave:0,objectiveAwarded:false,events:['The expedition enters the dungeon.'],loot:{gold:0,wood:0,stone:0,food:0,iron:0,rivets:0,leather:0,essence:0,blueprints:0,equipment:[]},allies:[{id:'hero',name:'Your hero',kind:'hero',role:'Hero',hp:h.health,maxHp:h.health,attack:h.attack,defense:h.defense,crit:h.crit,evade:h.evade,leech:h.leech},...(c.objective==='solo'?[]:s.recruits.map(recruitUnit))],enemies:[]};if(c.modifier==='wounded')battle.allies[0].hp=Math.round(h.health*.75);spawnWave();}
function ensureBattle(){
 if(battle)battle.loot.equipment??=[];
 if(battle?.allies&&battle.balance!==4){for(const u of battle.allies.slice(1)){const hpRatio=u.hp/u.maxHp,next=recruitUnit(s.recruits[u.index],u.index);Object.assign(u,next,{hp:Math.round(next.maxHp*hpRatio)});}battle.balance=4;}
 if(battle&&!battle.allies){const old=battle,c={d:old.d,name:old.name,mod:old.mod};startBattle(c);battle.wave=old.wave||1;battle.loot={...battle.loot,...old.loot};battle.checkpoint=old.checkpoint||false;battle.allies[0].hp=Math.max(1,Math.round(battle.allies[0].maxHp*(old.hp||100)/100));spawnWave();}
}
function battleEvent(t){battle.events.unshift(t);battle.events=battle.events.slice(0,12);}
function spawnWave(){
 const d=battle.d,w=battle.wave,m=(battle.mod||1)*(battle.modifier==='elite'?1.25:1),boss=w===15,count=boss?1:Math.min(4,1+Math.floor((w-1)/5)+d);
 battle.enemies=Array.from({length:count},(_,i)=>{const hp=Math.round((boss?70+d*55:13+w*2+d*13)*m);return {id:'enemy-'+i,name:boss?'Ossuary lord':i%2?'Crypt archer':'Bone guard',kind:boss?'boss':i%2?'enemyArcher':'enemy',role:boss?'Boss':i%2?'Archer':'Warrior',hp,maxHp:hp,attack:Math.round((boss?12+d*6:4+w*.35+d*3)*m),defense:boss?3+d*2:Math.floor(w/6)+d,crit:boss?.15:.04,evade:0,leech:0};});
 battle.phase='combat';battleEvent(`Wave ${w}: ${boss?'the dungeon lord awakens':count+' enemies approach'}.`);
}
function healUnit(source,target,amount){const actual=Math.min(amount,target.maxHp-target.hp);if(actual<=0)return;const stats=combatStats();stats.healing[source.id]=(stats.healing[source.id]||0)+actual;target.hp+=actual;target.event={beat:battle.beat,kind:'heal',text:'+'+actual};source.event={beat:battle.beat,kind:'attack',text:'Heal'};battleEvent(`${source.name} restores ${actual} HP to ${target.name}.`);}
function hit(source,target){
 source.event={beat:battle.beat,kind:'attack',text:source.role==='Archer'?'➶':source.role==='Hero'&&s.gear.weapon<0?'Strike':'⚔'};
 if(Math.random()<(target.evade||0)){target.event={beat:battle.beat,kind:'damage',text:'Dodge'};battleEvent(`${target.name} dodges ${source.name}.`);return;}
 const critical=Math.random()<(source.crit||0),damage=Math.max(1,Math.round((source.attack*(.9+Math.random()*.2)-(target.defense)*.55)*(critical?1.7:1)));
 const actual=Math.min(target.hp,damage);const stats=combatStats();if(source.id==='hero'||source.index!==undefined)stats.damage[source.id]=(stats.damage[source.id]||0)+actual;if(target.id==='hero'){stats.taken+=actual;stats.lastHit={name:source.name,role:source.role,damage:actual};}target.hp=Math.max(0,target.hp-damage);target.event={beat:battle.beat,kind:'damage',text:(critical?'Crit ':'−')+actual};battleEvent(`${source.name} hits ${target.name} for ${actual}${critical?' (critical)':''}.`);
 if(source.leech&&source.hp>0){const healing=Math.min(source.maxHp-source.hp,Math.ceil(actual*source.leech));source.hp+=healing;if(healing){const stats=combatStats();stats.healing[source.id]=(stats.healing[source.id]||0)+healing;}if(healing)battleEvent(`${source.name} steals ${healing} HP.`);}
 if(target.hp<=0){battleEvent(`${target.name} falls.`);if(target.index!==undefined){s.recruits[target.index].dead=true;log(s.recruits[target.index].cls+' fell in battle.');}}
}
function clearCombatEffects(){for(const u of [...battle.allies,...battle.enemies])delete u.event;}
function objectiveInfo(key){return ({none:{name:'No objective',help:'Standard rewards.',reward:{}},solo:{name:'Lone descent',help:'Travel alone, clear wave 10, then extract. Your companions stay home.',reward:{gold:25}},elite:{name:'Elite hunter',help:'Clear wave 5 on an Elite Enemies route, then extract.',reward:{iron:1}},safe:{name:'Bring everyone home',help:'Clear wave 10 with at least one recruit and all companions alive, then extract.',reward:{food:30,rivets:1}}})[key]||objectiveInfo('none');}
function objectiveStatus(b){const key=b.objective||'none';if(key==='none')return false;const cleared=b.clearedWave||0;return key==='solo'?cleared>=10&&b.allies.length===1:key==='elite'?cleared>=5&&b.modifier==='elite':cleared>=10&&b.allies.length>1&&b.allies.every(u=>u.hp>0);}
function awardObjective(b,won){if(!won||b.objectiveAwarded||!objectiveStatus(b))return false;const info=objectiveInfo(b.objective);for(const[k,v]of Object.entries(info.reward))b.loot[k]=(b.loot[k]||0)+v;b.objectiveAwarded=true;s.objectivesCompleted++;return true;}
function objectivePanel(){const info=objectiveInfo(s.objective);return `<details class="history-panel objective-picker" data-panel="objective"><summary>Optional objective · ${info.name}</summary><div class="objective-choices">${['none','solo','elite','safe'].map(k=>`<button data-action="objective:${k}" class="${s.objective===k?'chosen':''}" ${s.offlineQueue?'disabled':''}>${objectiveInfo(k).name}</button>`).join('')}</div><p>${info.help} ${Object.keys(info.reward).length?'Bonus: '+costText(info.reward)+'.':''}</p><small class="muted">One fixed bonus per successful run; no loot multipliers. Objectives are disabled for offline queues.</small></details>`;}
function bondStory(r){const name=r.name||r.cls,l=r.loyalty||0;const memories={Warrior:['reveals how their old watchtower fell.','entrusts you with the badge of their lost regiment.','swears to guard the home you have built.'],Archer:['speaks of a forest they can never return to.','shows you a map drawn by their missing sibling.','plants a sapling in Gravehold and calls it home.'],Healer:['recalls keeping a candle lit through the plague.','shares the names of those they could not save.','plants healing herbs and chooses to stay.']};if(l<10)return 'Trust grows with every safe return.';return name+' '+(memories[r.cls]||memories.Warrior)[l>=30?2:l>=20?1:0]+(l>=30?' Bond complete: +2 personal HP.':'');}

function specialistInfo(key){return ({blacksmith:{name:'Varric',role:'Blacksmith',help:'Build a workshop to reduce item-upgrade gold costs by 10%. Materials and forging costs stay the same.'},quartermaster:{name:'Nessa',role:'Quartermaster',help:'Buy 25 food for 20 gold, once per completed expedition. Needs storage space.'},scout:{name:'Corvin',role:'Scout',help:'Spend 20 gold to survey three new dungeon routes. Difficulty and loot rules stay the same.'}})[key];}
function rescueSpecialist(b){if(b.queued||b.rescue)return;const missing=['blacksmith','quartermaster','scout'].filter(k=>!s.specialists[k]);if(!missing.length)return;if(b.wave===15||(b.wave===10&&Math.random()<.08)){b.rescue=missing[0];battleEvent(specialistInfo(b.rescue).name+' is freed. Extract safely to bring them home.');}}
function settleRescue(b,won){if(!won||!b.rescue||s.specialists[b.rescue])return false;s.specialists[b.rescue]=true;log(specialistInfo(b.rescue).name+' settles in Gravehold as your '+specialistInfo(b.rescue).role.toLowerCase()+'.');return true;}
function specialistService(key){if(battle||s.offlineQueue||!s.specialists[key])return false;if(key==='blacksmith'){if(s.buildings.workshop||!pay({wood:300,stone:250,gold:150}))return false;s.buildings.workshop=1;}else if(key==='quartermaster'){if(s.quartermasterRun===s.expeditions||s.food+25>cap('food')||!pay({gold:20}))return false;s.food+=25;s.quartermasterRun=s.expeditions;}else if(key==='scout'){if(!pay({gold:20}))return false;s.choices=null;choices();}else return false;return true;}
function specialistsPanel(){const keys=Object.keys(s.specialists).filter(k=>s.specialists[k]&&specialistInfo(k));return `<details class="history-panel" data-panel="specialists"><summary>Settlement specialists · ${keys.length}/3 rescued</summary><p class="muted">Wave 10 offers an 8% rescue chance; a final boss frees one missing specialist. Extract to bring them home. Offline queues do not rescue specialists.</p><div class="grid specialist-grid">${keys.map(k=>{const x=specialistInfo(k),disabled=battle||s.offlineQueue||(k==='blacksmith'?s.buildings.workshop||!canAfford({wood:300,stone:250,gold:150}):k==='quartermaster'?s.quartermasterRun===s.expeditions||s.food+25>cap('food')||s.gold<20:s.gold<20);return `<section class="card"><div class="specialist-portrait">${sprite(k==='blacksmith'?'Miner':k==='quartermaster'?'Farmer':'Archer')}</div><h3>${x.name}</h3><span class="badge">${x.role}</span><p>${x.help}</p>${btn(k==='blacksmith'?s.buildings.workshop?'Workshop ready':'Build workshop · 300 wood · 250 stone · 150 gold':k==='quartermaster'?'Buy 25 food · 20 gold':'Survey routes · 20 gold','specialist:'+k,disabled)}</section>`;}).join('')||'<p class="muted">No specialists yet. Look for captives deeper in the dungeon.</p>'}</div></details>`;}
function rewardWave(){
 clearCombatEffects();battle.clearedWave=battle.wave;rescueSpecialist(battle);
 const m=(battle.d+1)*(battle.modifier==='double'?2:1),hunter=1+s.talents.treasure*.05,quantity=battle.modifier==='double'?2:1,focus=battle.focus||'balanced';battle.loot.gold+=Math.floor(m*(4+Math.floor(Math.random()*6))*hunter*(focus==='gold'?1.6:1));for(const k of ['wood','stone','food'])battle.loot[k]+=Math.floor(m*2*hunter);
 for(const[k,prob]of Object.entries({iron:.08,rivets:.06,leather:.05,essence:.025}))if(Math.random()<(prob+battle.d*.01)*hunter*(focus==='materials'?2:1))battle.loot[k]+=quantity;
 if(Math.random()<(.015+battle.d*.005)*hunter*(focus==='materials'?1.5:1))battle.loot.blueprints+=quantity;
 if(battle.wave%5===0&&Math.random()<Math.min(.18,(.08+battle.d*.02)*hunter*(focus==='equipment'?1.75:1))){const roll=Math.random(),slot=roll<.3?'weapon':roll<.45?'body':SLOTS[Math.floor(Math.random()*SLOTS.length)].key,rarityRoll=Math.random(),rarity=battle.d===0?(rarityRoll<.8?'common':rarityRoll<.98?'uncommon':'rare'):battle.d===1?(rarityRoll<.45?'common':rarityRoll<.85?'uncommon':rarityRoll<.99?'rare':'epic'):(rarityRoll<.5?'uncommon':rarityRoll<.9?'rare':rarityRoll<.99?'epic':'legendary'),item={slot,tier:1+battle.d,upgrade:0,rarity};battle.loot.equipment.push({...item});if(!estimating)notifyLoot(item,battle.wave);battleEvent('Rare equipment found: '+gearItem(slot,item.tier,0).name+'.');}battleEvent('Wave cleared. Rewards added to unsecured spoils.');
 if(battle.wave===15){finish(true);return;}
 if(battle.wave%5===0){battle.checkpoint=true;battle.phase='checkpoint';}
 else{battle.phase='between';battle.nextAt=battle.beat+2;}
}
function updateBattle(){if(!estimating){save();render();}}
function continueBattle(){clearCombatEffects();battle.checkpoint=false;battle.wave++;for(const u of battle.allies)if(u.hp>0)u.hp=Math.min(u.maxHp,u.hp+Math.round(u.maxHp*.2));spawnWave();}
function tickBattle(){
 if(!battle||battle.checkpoint||battle.result||(!estimating&&(document.hidden||resetting)))return;ensureBattle();const hs=heroStats(battle.objective!=="solo"),hero=battle.allies[0];hero.attack=hs.attack;hero.defense=hs.defense;hero.crit=hs.crit;hero.maxHp=hs.health;hero.hp=Math.min(hero.hp,hero.maxHp);battle.beat++;
 if(battle.phase==='between'){if(battle.beat>=battle.nextAt){battle.wave++;spawnWave();}updateBattle();return;}
 for(const unit of battle.allies.filter(u=>u.hp>0)){
  if(unit.role!=='Hero'&&battle.beat%2!==0)continue;
  if(unit.role==='Healer'&&battle.beat%2===0){const injured=battle.allies.filter(u=>u.hp>0&&u.hp<u.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(injured){healUnit(unit,injured,3+Math.floor(s.recruits[unit.index].level/4)+(s.recruits[unit.index].level>=5?1:0));continue;}}
  const target=battle.enemies.find(u=>u.hp>0);if(target)hit(unit,target);
 }
 if(battle.enemies.every(u=>u.hp<=0)){rewardWave();if(battle){updateBattle();}return;}
 for(const unit of battle.enemies.filter(u=>u.hp>0)){
  const alive=battle.allies.filter(u=>u.hp>0);const target=unit.role==='Archer'?alive[alive.length-1]:alive.find(u=>u.role==='Hero')||alive[0];if(target)hit(unit,target);
  if(battle.allies[0].hp<=0){finish(false);return;}
 }
 updateBattle();
}
function settings(confirm=false){
 const d=$('#settings');d.innerHTML=confirm?`<div class="eyebrow">Start over</div><h2>Reset your progress?</h2><p class="muted">This clears your hero, settlement, items, recruits, dungeon progress, debt, prestige, talents, and lifetime history${email?' from this account’s server save':''}. Your account remains.</p><label for="reset-word">Type RESET to confirm</label><input id="reset-word" placeholder="RESET" autocomplete="off"><p id="reset-error" class="muted"></p><div class="row">${btn('Cancel','settings')}${btn('Reset progress','reset-confirm',true)}</div>`:`<div class="row"><h2>Save settings</h2>${btn('Close','close')}</div><p class="muted">${email?'Your progress is saved to your account.':'Your progress is saved in this browser.'}</p><div class="reset-section"><h3>Start a new adventure</h3><p class="muted">Clear your progress and return to the beginning.</p>${btn('Reset save…','reset-prompt')}</div>`;if(!d.open)d.showModal();
}
async function resetSave(){
 if($('#reset-word')?.value!=='RESET'||resetting)return;resetting=true;for(const b of $('#settings').querySelectorAll('button'))b.disabled=true;$('#settings [data-action="reset-confirm"]').textContent='Resetting…';
 const fresh=initial();try{if(email){await syncPromise;const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:fresh})});if(!r.ok)throw new Error('The account save could not be reset. Please try again.');}
 s=fresh;battle=null;selectedSlot=null;tab='Settlement';riskCache.clear();for(const k of Object.keys(openPanels))delete openPanels[k];resetting=false;save();$('#settings').close();render();journal();
 }catch(e){resetting=false;$('#reset-error').textContent=e.message;for(const b of $('#settings').querySelectorAll('button'))b.disabled=false;$('#settings [data-action="reset-confirm"]').textContent='Reset progress';}
}

async function account(){const d=$('#account');if(standalone){d.innerHTML='<h2>Local adventure</h2><p class="muted">Your progress saves in this browser. Accounts and cross-device saves are available when this same HTML file is served by the Gravehold server.</p>'+btn('Close','close');d.showModal();return;}d.innerHTML=email?`<h2>Your account</h2><p>Signed in. Progress syncs to this server.</p>${btn('Sign out','logout')}${btn('Close','close')}`:`<h2>Return to Gravehold</h2><p class="muted">Save your settlement across devices on the same host.</p><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Password · at least 8 characters" autocomplete="current-password"><p id="auth-error"></p>${btn('Sign in','login')}${btn('Create account','register')}${btn('Continue with Google','google')}<p class="muted">Google sign-in requires the host’s OAuth configuration.</p>${btn('Close','close')}`;d.showModal()}
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab){if(battle&&el.dataset.tab!=='Expeditions'){log('Finish or extract from the current expedition first.');render();return}tab=el.dataset.tab;render();if(!s.tutorialsDisabled&&!s.seen.includes(tab))journal();return}if(el.dataset.topic){journal(el.dataset.topic);return}const[a,k]=String(el.dataset.action).split(':');let ok=true;
if(a==='queue'||a==='queue3')ok=startQueue(k,a==='queue3'?3:1);
if(a==='talent')ok=buyTalent(k);
if(a==='foreman'){ok=!s.foreman&&Object.keys(s.workers).length>=3&&pay({wood:300,stone:200,food:250});if(ok)s.foreman=true;}
if(a==='prestige-prompt'){const d=$('#prestige');d.innerHTML=`<h2>Begin a new lifetime?</h2><p>This resets your adventure and awards ${prestigeReward()} prestige Grave Essence. Your permanent bonuses and talents remain.</p>${btn('Cancel','close')}${btn('Prestige now','prestige-confirm')}`;d.showModal();return;}
if(a==='prestige-confirm'){ok=doPrestige();if(ok){$('#prestige').close();tab='Settlement';save();render();return;}}
if(s.offlineQueue&&['upgrade','craft','recruit','revive','enter'].includes(a)){log('Your expedition is away. Wait for its return before changing the team.');render();return;}
if(a==='objective'&&['none','solo','elite','safe'].includes(k)&&!battle&&!s.offlineQueue)s.objective=k;
if(a==='specialist')ok=specialistService(k);
if(a==='dismiss'){const item=s.equipmentBag[Number(k)];if(item)item.newFind=false;save();render();return;}if(a==='salvage')return salvagePrompt(Number(k));if(a==='salvage-confirm'){if(salvageItem(s.equipmentBag.indexOf(salvageTarget))){$('#salvage').close();save();render();if($('#inventory').open)inventory(false);}return;}if(a==='equip'){if(!equipItem(Number(k)))return;save();render();if($('#inventory').open)inventory(false);return;}if(a==='settings')return settings();if(a==='reset-prompt')return settings(true);if(a==='reset-confirm')return resetSave();if(a==='inventory')return inventory();if(a==='slot'){selectedSlot=k;render();return;}if(a==='journal')return journal();if(a==='account')return account();if(a==='close'){el.closest('dialog').close();return}
if(a==='login'||a==='register'){const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const v=await r.json();if(!r.ok){$('#auth-error').textContent=v.error;return}email=v.email;if(v.state){s=migrate(v.state);battle=s.activeBattle||null;}else save();save();$('#account').close();render();return}
if(a==='google'){location.href='/auth/google';return}
if(a==='logout'){await fetch('/api/logout',{method:'POST'});email=null;$('#account').close();render();return}
if(a==='gather'&&!s.gather)s.gather={kind:k,end:Date.now()+8000,amount:gatherYield(k)};if(a==='collect')collectGather();
if(a==='build'){ok=pay({wood:20,stone:10});if(ok){s.buildings[k]=1;log('Built a production site. Dungeon gates are now open.')}}
if(a==='worker'){ok=pay({food:15,wood:20});if(ok)s.workers[k]={xp:0}}
if(a==='train'){ok=pay({[k]:30+Math.floor(s.workers[k].xp/300)*15});if(ok)s.workers[k].xp+=300}
if(a==='storage'){ok=pay(storageCost(k));if(ok)s.buildings[k+'Storage']=(s.buildings[k+'Storage']||0)+1;}
if(a==='focus'&&['balanced','gold','materials','equipment'].includes(k)&&!battle&&!s.offlineQueue)s.rewardFocus=k;
if(a==='barracks')ok=buildBarracks();
if(a==='recruit')ok=hireRecruit(k);
if(a==='revive')ok=reviveRecruit(Number(k));
if(a==='upgrade'){const c=upgradeCost(k);ok=s.gear[k]>=0&&s.items.iron>=c.iron&&pay({gold:c.gold});if(ok){s.items.iron-=c.iron;s.gearUpgrades[k]++;}}
if(a==='craft'){const c=forgeCost(k);ok=canCraft(k);if(ok){s.blueprints--;for(const[key,v]of Object.entries(c)){if(key==='gold')s.gold-=v;else s.items[key]-=v;}s.gear[k]=Math.max(1,s.gear[k]+1);s.gearUpgrades[k]=0;log('Forged '+gearItem(k).name+'.');}}
if(a==='hero')ok=reviveHero();
if(a==='loan'){ok=reviveHero(true);if(ok)log('Emergency loan secured. The hero has been revived.');}
if(a==='recover'&&s.heroDead&&s.debt+s.interest>0&&!s.recover)s.recover=Date.now()+300000;
if(a==='repay'){const amount=Math.min(10,s.gold,s.debt+s.interest),i=Math.min(amount,s.interest);s.gold-=amount;s.interest-=i;s.debt=Math.max(0,s.debt-(amount-i));}
if(a==='enter'&&!s.heroDead&&!s.offlineQueue){startBattle({...s.choices[Number(k)],focus:s.rewardFocus,objective:s.objective});}
if(a==='extract'&&battle?.checkpoint)return finish(true);if(a==='continue'&&battle?.checkpoint)continueBattle();
if(!ok)log('Not enough resources yet. Gather, work, or return with dungeon loot.');save();render();});
document.addEventListener('change',e=>{if(e.target.id==='tutorials-off'){s.tutorialsDisabled=e.target.checked;save();}});
document.addEventListener('input',e=>{if(e.target.id==='reset-word')$('#settings [data-action="reset-confirm"]').disabled=e.target.value!=='RESET'||resetting;});
async function boot(){try{if(!standalone){const r=await fetch('/api/me');if(r.ok){const v=await r.json();email=v.email;if(v.state){s=migrate(v.state);battle=s.activeBattle||null;if(battle)tab='Expeditions';}}}}catch{}render();if(!s.tutorialsDisabled&&!s.seen.includes(tab))journal();}
setInterval(()=>{if(!document.hidden){render();save()}},1000);setInterval(tickBattle,650);boot();

</script>
