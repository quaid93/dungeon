<style>
:root{color-scheme:dark;--bg:#101413;--panel:#1b211e;--line:#333d33;--gold:#d1b67b;--muted:#8c998d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6e7dc;font-family:Inter,system-ui;font-size:14px}button{font:inherit;cursor:pointer;background:#2b352b;color:#e4e7d9;border:1px solid #465143;padding:10px 16px;border-radius:4px}button:hover{background:#3d4b36}button:disabled{opacity:.4;cursor:not-allowed}h1,h2,h3,.brand{font-family:Spectral,Georgia,serif}h1{font-size:38px;margin:8px 0}h2{font-size:25px}h3{margin:8px 0;font-size:21px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{padding:32px 22px;border-right:1px solid var(--line);background:#141a16}.brand{color:var(--gold);font-size:29px;letter-spacing:3px}.subtitle,.muted{color:var(--muted);line-height:1.7}.subtitle{font-size:10px;letter-spacing:3px}nav{margin-top:48px;display:grid;gap:10px}nav button{text-align:left;background:transparent;border:0;padding:14px}nav button.active{background:#293326;color:var(--gold);border-left:2px solid var(--gold)}main{padding:28px 40px;max-width:1600px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}.resources{display:flex;gap:22px;flex-wrap:wrap}.resource{color:var(--gold)}.resource small{display:block;color:var(--muted);margin-top:5px}.intro{display:flex;justify-content:space-between;align-items:center;margin:26px 0}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}.banner{height:240px;position:relative;overflow:hidden;background:linear-gradient(#253a35,#182723 65%,#293222);border:1px solid var(--line);margin-bottom:26px}.banner svg{width:100%;height:100%;image-rendering:pixelated}.banner-label{position:absolute;left:24px;bottom:20px;text-shadow:0 2px 5px #000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid var(--line);background:var(--panel);padding:22px;border-radius:5px}.card p{color:var(--muted);line-height:1.7}.card button{margin:5px 4px 0 0}.badge{font-size:10px;color:var(--gold);letter-spacing:2px}.icon{font-size:30px;margin-bottom:12px}.bar{height:5px;background:#343d32;margin:14px 0}.bar span{display:block;background:var(--gold);height:100%}.notice{padding:14px 20px;border:1px solid #586047;background:#262f23;margin:18px 0;color:#d3d9ba}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.feed{margin-top:25px;font-size:12px;color:var(--muted)}dialog{width:min(540px,90vw);background:#1b241d;border:1px solid #7b7855;color:#eee;padding:30px;border-radius:8px}dialog::backdrop{background:#000b}input{width:100%;padding:12px;margin:7px 0;background:#101813;color:#fff;border:1px solid #42503e}.arena{height:270px;background:linear-gradient(#11131d,#242331);display:flex;align-items:end;justify-content:space-around;border:8px solid #35333c;padding:30px;margin:20px 0;position:relative}.sprite{font-size:42px;filter:drop-shadow(4px 5px 0 #000);animation:bob 1s steps(2) infinite}.sprite.dead{opacity:.25;animation:none}.enemy{color:#bf7272}.gold{color:var(--gold)}@keyframes bob{50%{transform:translateY(-5px)}}footer{margin-top:35px;color:#69786b;font-size:11px;letter-spacing:1px} @media(max-width:900px){.layout{grid-template-columns:1fr}aside{padding:15px}nav{display:flex;margin:15px 0;overflow:auto}main{padding:20px}.grid{grid-template-columns:1fr}.top{align-items:start}.resources{gap:12px}.banner{height:190px}.subtitle{display:none}}
.sprite{display:inline-block}.sprite svg{image-rendering:pixelated}.arena{background:repeating-linear-gradient(0deg,transparent 0 38px,#35333b 38px 40px),repeating-linear-gradient(90deg,#1a1a24 0 78px,#35333b 78px 80px);border-bottom:18px solid #45404a}


.hiring{margin-top:20px;padding:16px;background:#263025;border:1px solid #515c3b;border-radius:5px}.hiring p{font-size:12px;margin:8px 0}.hiring small{display:block;color:var(--muted);margin-top:10px}.hiring button:not(:disabled){background:#b79c62;color:#141a16;border-color:#d1b67b;font-weight:600;width:100%}.storage-info{border-top:1px solid var(--line);margin-top:20px;padding-top:18px}.storage-info p{font-size:12px;margin:8px 0}.inventory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.inventory-item{padding:15px 8px;background:#121a15;border:1px solid var(--line);display:grid;text-align:center;gap:8px}.inventory-item span:last-child{color:var(--muted);font-size:12px}.inventory-item .icon{margin:0;font-size:24px;color:var(--gold)}.inventory-item strong{font-size:22px}.loadout-layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(300px,1fr);gap:22px}.equipment-grid{display:grid;grid-template-columns:repeat(3,minmax(75px,110px));grid-template-rows:repeat(5,85px);justify-content:center;gap:10px;background:radial-gradient(ellipse,#34402c66,transparent 70%);padding:15px}.equipment-slot{display:grid;padding:8px;text-align:center;gap:3px;font-size:12px}.equipment-slot>span{font-size:23px;color:var(--gold)}.equipment-slot small{font-size:10px;color:var(--muted)}.equipment-slot.selected{border:2px solid var(--gold);background:#3b422d}.equipment-slot.empty{border-style:dashed;background:#151c17}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.hero-stats span{background:#111912;padding:12px;color:var(--muted);font-size:12px}.hero-stats strong{display:block;color:var(--gold);font-size:21px;margin-top:6px}.item-detail hr{border:0;border-top:1px solid var(--line);margin:24px 0}.item-detail h2{text-transform:capitalize}.inventory-shortcut{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid var(--line);padding:16px;margin-top:20px;color:var(--muted);font-size:12px}.battle-scene{height:auto;min-height:320px;padding:30px 20px;gap:10px;align-items:center}.battle-side{display:flex;gap:12px;align-items:end;justify-content:center;flex:1;flex-wrap:wrap}.combat-unit{text-align:center;min-width:85px;width:105px;position:relative}.unit-label{font-size:11px;color:#d0d6bd;min-height:30px}.unit-sprite{position:relative;display:inline-block}.unit-sprite svg{image-rendering:pixelated;filter:drop-shadow(3px 4px 0 #000)}.unit-hp{height:7px;background:#111;border:1px solid #626954;margin:8px 0 5px}.unit-hp span{height:100%;background:#80ac65;display:block;transition:width .25s}.hostile .unit-hp span{background:#bd6969}.combat-unit strong{font-size:11px}.combat-unit small{display:block;font-size:10px;color:#8c998d;margin-top:6px}.fallen{opacity:.35}.combat-number{position:absolute;top:0;left:50%;font-size:16px;font-weight:bold;color:#f2cf91;white-space:nowrap;animation:float .6s ease-out}.combat-number.damage{color:#ff8a80}.combat-number.heal{color:#9ee09f}.attacking{animation:lunge .5s steps(3)}.hostile .attacking{animation:lunge-back .5s steps(3)}.struck{animation:flash .45s steps(2)}.versus{color:#8c7768;font-size:26px;text-align:center;width:65px}.versus small{display:block;font-size:9px;letter-spacing:1px;margin-top:10px}.battle-events{background:#151918;padding:12px 16px;border-left:2px solid #596546;min-height:100px;font-size:12px;color:var(--muted);line-height:1.7}.battle-events div:first-child{color:#d3d9ba}.spoils{background:#20281f;border:1px solid var(--line);margin-top:18px;padding:16px}.spoils summary{cursor:pointer;color:var(--gold);font-size:12px}.loot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.loot-grid span{font-size:12px;color:var(--muted)}.loot-grid strong{float:right;color:#e6e7dc}
@keyframes lunge{50%{transform:translateX(13px) rotate(8deg)}}@keyframes lunge-back{50%{transform:translateX(-13px) rotate(-8deg)}}@keyframes flash{50%{filter:brightness(2) saturate(.2)}}@keyframes float{to{transform:translateY(-25px);opacity:0}}

main,aside,.battle-side{min-width:0}.battle-side{gap:8px}.combat-unit{width:90px;min-width:80px}
@media(max-width:900px){.top{flex-direction:column;gap:16px}.top>div:last-child{display:flex;flex-wrap:wrap;gap:8px}.equipment-grid{grid-template-columns:repeat(3,minmax(0,1fr));padding:8px;gap:8px}.combat-unit{width:65px;min-width:60px}.battle-events,.spoils{overflow-wrap:anywhere}.inventory-grid{grid-template-columns:repeat(2,1fr)}.row{flex-wrap:wrap}}
.hostile .unit-sprite svg{transform:scaleX(-1)}

<body>
<div id="app"></div>
<dialog id="journal"></dialog>
<dialog id="account"></dialog>
<dialog id="inventory"></dialog>
<script type="module">
const standalone=location.protocol==='file:';
const $=s=>document.querySelector(s);
const SLOTS=[
 {key:'head',label:'Head',icon:'♜',row:1,col:2,stat:'defense'},
 {key:'cape',label:'Cape',icon:'⚑',row:2,col:1,stat:'health'},
 {key:'neck',label:'Neck',icon:'◇',row:2,col:2,stat:'attack'},
 {key:'weapon',label:'Weapon',icon:'⚔',row:3,col:1,stat:'attack'},
 {key:'body',label:'Body',icon:'▣',row:3,col:2,stat:'defense'},
 {key:'shield',label:'Shield',icon:'◈',row:3,col:3,stat:'defense'},
 {key:'legs',label:'Legs',icon:'Ⅱ',row:4,col:2,stat:'defense'},
 {key:'hands',label:'Hands',icon:'✥',row:5,col:1,stat:'attack'},
 {key:'feet',label:'Feet',icon:'♟',row:5,col:2,stat:'health'},
 {key:'ring',label:'Ring',icon:'○',row:5,col:3,stat:'attack'}
];
const MATERIALS={iron:{name:'Iron fragments',icon:'◆'},rivets:{name:'Binding rivets',icon:'✣'},leather:{name:'Worn leather',icon:'▧'},essence:{name:'Grave essence',icon:'✧'}};
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let estimating=false;const riskCache=new Map();
let selectedSlot='weapon';
function migrate(state){
 state.gear??={};state.gearUpgrades??={};
 if(state.gear.armor!==undefined){state.gear.body=state.gear.armor;state.gearUpgrades.body=state.gearUpgrades.armor||0;delete state.gear.armor;delete state.gearUpgrades.armor;}
 for(const slot of SLOTS){state.gear[slot.key]??=(['weapon','body','legs','feet'].includes(slot.key)?0:-1);state.gearUpgrades[slot.key]??=0;}
 state.items??={};for(const k of Object.keys(MATERIALS))state.items[k]??=0;
 return state;
}
function storageCost(k){const level=s.buildings[k+'Storage']||0;return {wood:35+level*40,stone:25+level*30};}
function canAfford(c){return Object.entries(c).every(([k,v])=>s[k]>=v);}
function gearItem(k,tier=s.gear[k],upgrade=s.gearUpgrades[k]||0){
 const slot=SLOTS.find(x=>x.key===k);if(!slot||tier<0)return null;
 const prefix=tier===0?'Worn':tier===1?'Iron':tier===2?'Gravewarden':tier===3?'Duskforged':'Ancient '+tier;
 const noun={head:'helm',cape:'cloak',neck:'pendant',weapon:'blade',body:'cuirass',shield:'shield',legs:'greaves',hands:'gloves',feet:'boots',ring:'signet'}[k];
 const value=slot.stat==='health'?2+tier*7+upgrade*2:slot.stat==='attack'?(k==='weapon'?3+tier*6:1+tier*2)+upgrade*2:1+tier*2+upgrade;
 const stats={[slot.stat]:value};
 if(tier>0&&k==='ring')stats.crit=tier*.02;
 if(tier>0&&k==='cape')stats.evade=tier*.015;
 if(tier>0&&k==='neck')stats.leech=tier*.015;
 return {name:prefix+' '+noun,tier,upgrade,stats};
}
function heroStats(){
 const total={attack:6,defense:0,health:65,crit:.05,evade:0,leech:0};
 for(const slot of SLOTS){const item=gearItem(slot.key);if(item)for(const[k,v]of Object.entries(item.stats))total[k]+=v;}
 total.crit=Math.min(.5,total.crit);total.evade=Math.min(.35,total.evade);total.leech=Math.min(.25,total.leech);return total;
}
function statText(stats){return Object.entries(stats).map(([k,v])=>`${['crit','evade','leech'].includes(k)?Math.round(v*100)+'%':v} ${k==='health'?'HP':k==='leech'?'life steal':k}`).join(' · ');}
function forgeCost(k){const n=Math.max(0,s.gear[k]);return {iron:5+n*3,rivets:3+n*2,gold:40+n*40,...(['cape','hands','feet'].includes(k)?{leather:3+n*2}:{}),...(['ring','neck'].includes(k)?{essence:2+n}: {})};}
function upgradeCost(k){const n=s.gearUpgrades[k]||0;return {gold:20+n*10,iron:3+n};}
function canCraft(k){const c=forgeCost(k);return s.blueprints>0&&Object.entries(c).every(([key,v])=>(key==='gold'?s.gold:s.items[key])>=v);}
function inventory(open=true){
 const dialog=$('#inventory');if(!dialog)return;
 const held=Object.entries(s.items).filter(([k,v])=>v>0||MATERIALS[k]);
 dialog.innerHTML=`<div class="row"><div><div class="eyebrow">Secured supplies</div><h2>Inventory</h2></div>${btn('Close','close')}</div><p class="muted">Only loot brought home is stored here. Farm resources stay in the top bar.</p><div class="inventory-grid">${held.map(([k,v])=>`<div class="inventory-item"><span class="icon">${MATERIALS[k]?.icon||'◇'}</span><strong>${Math.floor(v)}</strong><span>${escapeHtml(MATERIALS[k]?.name||k)}</span></div>`).join('')}<div class="inventory-item"><span class="icon">▤</span><strong>${s.blueprints}</strong><span>Consumable blueprints</span></div></div><p class="muted">Blueprints and materials drop separately. Open Loadout to choose a slot and craft.</p>${battle?'<div class="notice">Current dungeon rewards are unsecured. See the spoils tracker in your expedition.</div>':''}`;
 if(open&&!dialog.open)dialog.showModal();
}
const initial=()=>migrate({wood:0,stone:0,food:0,gold:0,buildings:{},workers:{},recruits:[],gear:{weapon:0,body:0,legs:0,feet:0},gearUpgrades:{},items:{iron:0,rivets:0,leather:0,essence:0},blueprints:0,seen:[],last:Date.now(),gather:null,heroDead:false,recover:0,debt:0,interest:0,expeditions:0,loanRuns:0,log:['Your story begins at the edge of the woods.'],choices:null});
let s=migrate(JSON.parse(localStorage.getItem('gravehold')||'null')||initial()),tab='Settlement',email=null,battle=s.activeBattle||null;if(battle)tab='Expeditions';
const topics={Settlement:['A foothold in the dark','Gather wood, stone and food by starting a short task, then collect it. Build your first production site to unlock dungeons. Hire workers to automate production; workers level as they work. Storage can be upgraded; each level costs more. Build a site, then use its highlighted Hire worker panel to automate gathering. Offline production is 50% of normal and stops when storage fills.'],Expeditions:['Beyond the gates','Choose one of three newly generated dungeons. The risk meter simulates your current team against all 15 waves to estimate a clear chance. Random attacks and critical hits mean it is a forecast, not a guarantee. Combat is automatic. Extract after waves 5 and 10 to secure your loot, or continue to the final boss. Defeat forfeits this run’s rewards.'],Loadout:['Forged, not found','Dungeon blueprints and materials drop separately. Crafting consumes one blueprint. Upgrade your equipment with gold and iron. Craft the next tier using your current equipment, a new blueprint, and ingredients. Owned equipment survives defeat. Select one of ten equipment slots (no arrow slot). Bonuses such as critical chance, evasion, and life steal affect real combat. Inventory in the top bar tracks all secured materials.'],Recruits:['No one walks alone','Hire up to three warriors, archers or healers using settlement resources. They level slowly through expeditions. Fallen recruits remain unavailable until revived with gold and food.'],Treasury:['A costly second chance','Revive your hero with gold and food, or borrow the missing cost. Only one loan can be outstanding. Every five completed expeditions adds 1% interest on remaining principal. Repay manually; payments cover interest first. While indebted, free hero recovery takes five minutes.']};
function log(t){s.log.unshift(t);s.log=s.log.slice(0,8)}
function save(){s.activeBattle=battle;s.last=Date.now();localStorage.setItem('gravehold',JSON.stringify(s));if(email)fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:s})}).catch(()=>{});}
function cap(k){return 100+(s.buildings[k+'Storage']||0)*150}
function accrue(){const now=Date.now(),seconds=(now-s.last)/1000;for(const [k,w]of Object.entries(s.workers)){const amount=seconds*(seconds>5?.5:1)*(1+Math.floor(w.xp/300)*.2);s[k]=Math.min(cap(k),s[k]+amount);w.xp+=seconds} s.last=now;if(s.heroDead&&s.recover&&now>=s.recover){s.heroDead=false;s.recover=0;log('Your hero has recovered.')}}
function pay(cost){if(Object.entries(cost).some(([k,v])=>s[k]<v))return false;for(const[k,v]of Object.entries(cost))s[k]-=v;return true}
function costText(c){return Object.entries(c).map(([k,v])=>`${v} ${k}`).join(' · ')}
function btn(label,action,disabled=false){return `<button data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
const scene=`<svg viewBox="0 0 1000 240" preserveAspectRatio="xMidYMid slice"><defs><pattern id="rain" width="60" height="50" patternUnits="userSpaceOnUse"><path d="M10 0l-4 12" stroke="#577165" opacity=".2"/></pattern></defs><circle cx="750" cy="47" r="26" fill="#a8b299" opacity=".5"/><path d="M0 155L90 65l70 90L240 45l115 130L450 70l95 100L660 35l100 140L880 55l120 105V240H0" fill="#192d28"/><path d="M0 175L100 100l75 85L300 100l90 80L560 95l120 95L850 110l150 65V240H0" fill="#11201c"/><path d="M400 190V130h110v60M382 130l74-65 74 65" fill="#594d39" stroke="#242a20" stroke-width="8"/><path d="M447 190v-44h22v44" fill="#151c17"/><path d="M415 140h15v20h-15m69-20h15v20h-15" fill="#d5ae60"/><path d="M535 187h75v-42h-75m-8 0l46-37 45 37" fill="#3c4431" stroke="#20271e" stroke-width="6"/><path d="M0 207Q200 170 350 212T700 205T1000 190V240H0" fill="#35412a"/><path d="M430 240l19-50h20l39 50" fill="#706345"/><path d="M100 218v-100m-40 65l40-80 40 80m-31 35V95" stroke="#17231b" stroke-width="14" fill="#243a29"/><rect width="1000" height="240" fill="url(#rain)"/></svg>`;
function settlement(){return `<div class="banner">${scene}<div class="banner-label"><div class="eyebrow">Your sanctuary</div><h2 style="margin:3px 0">A light against the dark</h2></div></div><div class="grid">${['wood','stone','food'].map((k,i)=>{
 const built=s.buildings[k],w=s.workers[k],cost={wood:20,stone:10},profession=['woodcutter','miner','farmer'][i],storage=storageCost(k);
 return `<section class="card"><div class="row"><span class="icon">${['♧','◆','❧'][i]}</span><span class="badge">${built?'BUILT':'UNBUILT'}</span></div><h3>${['Woodcutting camp','Stone quarry','Homestead'][i]}</h3><p>${w?`Worker level ${1+Math.floor(w.xp/300)} · ${(1+Math.floor(w.xp/300)*.2).toFixed(1)}/sec`:'Gather by hand to establish your first production site.'}</p><div class="bar"><span style="width:${s[k]/cap(k)*100}%"></span></div><div class="muted">${Math.floor(s[k])} / ${cap(k)} stored</div>
 ${s.gather?.kind===k?btn(Date.now()>=s.gather.end?'Collect +12':`Gathering… ${Math.ceil((s.gather.end-Date.now())/1000)}s`,'collect',Date.now()<s.gather.end):btn('Gather '+k,'gather:'+k,!!s.gather)}
 ${!built?`<div class="hiring"><strong>1. Build your production site</strong><p>${costText(cost)}</p>${btn('Build site →','build:'+k,!canAfford(cost))}<small>Building unlocks a ${profession} position.</small></div>`:!w?`<div class="hiring"><span class="badge">VACANT POSITION · 0 / 1</span><h3>Hire a ${profession}</h3><p>Automatically gathers ${k}, even while you are away.<br>Cost: 20 wood · 15 food</p>${btn('Hire '+profession+' →','worker:'+k,!canAfford({wood:20,food:15}))}<small>${canAfford({wood:20,food:15})?'Ready to hire':'Gather more wood and food to hire.'}</small></div>`:`<div class="hiring"><span class="badge">${profession.toUpperCase()} EMPLOYED · 1 / 1</span><p>Your worker is gathering ${k}.</p>${btn('Train · '+(30+Math.floor(w.xp/300)*15)+' '+k,'train:'+k)}</div>`}
 <div class="storage-info"><span class="muted">Storage level ${s.buildings[k+'Storage']||0} → ${(s.buildings[k+'Storage']||0)+1}</span><p>+150 capacity · ${costText(storage)}</p>${btn('Upgrade storage','storage:'+k,!canAfford(storage))}</div></section>`;
 }).join('')}</div>`;}
function choices(){if(!s.choices)s.choices=[0,1,2].map((d)=>({d,name:[['Hollow Crypt','Ashen Chapel','Forgotten Tomb'],['Bleak Catacombs','Widow’s Keep','Sunken Abbey'],['Blood Cathedral','Throne of Cinders','The Black Ossuary']][d][Math.floor(Math.random()*3)],mod:.9+Math.random()*.2}));}
function power(){const h=heroStats();return h.attack*2+h.defense*2+h.health/5+s.recruits.filter(r=>!r.dead).reduce((a,r)=>a+9+r.level*3,0);}
function chance(d,mod=1){
 const key=JSON.stringify([heroStats(),s.recruits.map(r=>[r.cls,r.level,r.dead]),d,mod]);if(riskCache.has(key))return riskCache.get(key);
 const originalState=s,originalBattle=battle;let wins=0;
 try{estimating=true;for(let run=0;run<24;run++){
  s=JSON.parse(JSON.stringify(originalState));startBattle({d,mod,name:'Forecast'});
  for(let beat=0;beat<750&&!battle.result;beat++){
   if(battle.checkpoint)continueBattle();tickBattle();
  }
  if(battle.result==='win')wins++;
 }}finally{s=originalState;battle=originalBattle;estimating=false;}
 const result=Math.round(wins/24*100/5)*5;if(riskCache.size>40)riskCache.clear();riskCache.set(key,result);return result;
}

function finish(win){
 if(estimating){battle.result=win?'win':'loss';return;}
 if(win){for(const k of ['gold','wood','stone','food'])s[k]=k==='gold'?s[k]+(battle.loot[k]||0):Math.min(cap(k),s[k]+(battle.loot[k]||0));
 for(const k of Object.keys(MATERIALS))s.items[k]+=(battle.loot[k]||0);s.blueprints+=battle.loot.blueprints||0;log('Returned safely with '+battle.loot.gold+' gold and crafting supplies.');
 }else{s.heroDead=true;log('The hero fell. Unsecured rewards were lost.');}
 s.expeditions++;if(s.debt>0&&++s.loanRuns>=5){s.interest+=s.debt*.01;s.loanRuns=0;}
 for(const r of s.recruits)if(!r.dead){r.xp++;if(r.xp>=20){r.level++;r.xp=0;}}
 battle=null;s.choices=null;save();render();
}
function recruitUnit(r,i){const level=r.level||1,warrior=r.cls==='Warrior',archer=r.cls==='Archer';const hp=(warrior?65:archer?38:42)+level*5;return {id:'recruit-'+i,name:r.cls+' '+(i+1),kind:r.cls,role:r.cls,index:i,maxHp:hp,hp:r.dead?0:hp,attack:(warrior?6:archer?9:3)+level*2,defense:warrior?4+level:1+level,crit:archer?.12:.04,evade:0,leech:0};}
function startBattle(c){const h=heroStats();battle={...c,wave:1,beat:0,checkpoint:false,phase:'combat',events:['The expedition enters the dungeon.'],loot:{gold:0,wood:0,stone:0,food:0,iron:0,rivets:0,leather:0,essence:0,blueprints:0},allies:[{id:'hero',name:'Your hero',kind:'hero',role:'Hero',hp:h.health,maxHp:h.health,attack:h.attack,defense:h.defense,crit:h.crit,evade:h.evade,leech:h.leech},...s.recruits.map(recruitUnit)],enemies:[]};spawnWave();}
function ensureBattle(){
 if(battle&&!battle.allies){const old=battle,c={d:old.d,name:old.name,mod:old.mod};startBattle(c);battle.wave=old.wave||1;battle.loot={...battle.loot,...old.loot};battle.checkpoint=old.checkpoint||false;battle.allies[0].hp=Math.max(1,Math.round(battle.allies[0].maxHp*(old.hp||100)/100));spawnWave();}
}
function battleEvent(t){battle.events.unshift(t);battle.events=battle.events.slice(0,12);}
function spawnWave(){
 const d=battle.d,w=battle.wave,m=battle.mod||1,boss=w===15,count=boss?1:Math.min(4,1+Math.floor((w-1)/5)+d);
 battle.enemies=Array.from({length:count},(_,i)=>{const hp=Math.round((boss?70+d*55:13+w*2+d*13)*m);return {id:'enemy-'+i,name:boss?'Ossuary lord':i%2?'Crypt archer':'Bone guard',kind:boss?'boss':i%2?'enemyArcher':'enemy',role:boss?'Boss':i%2?'Archer':'Warrior',hp,maxHp:hp,attack:Math.round((boss?12+d*6:4+w*.35+d*3)*m),defense:boss?3+d*2:Math.floor(w/6)+d,crit:boss?.15:.04,evade:0,leech:0};});
 battle.phase='combat';battleEvent(`Wave ${w}: ${boss?'the dungeon lord awakens':count+' enemies approach'}.`);
}
function healUnit(source,target,amount){const actual=Math.min(amount,target.maxHp-target.hp);if(actual<=0)return;target.hp+=actual;target.event={beat:battle.beat,kind:'heal',text:'+'+actual};source.event={beat:battle.beat,kind:'attack',text:'Heal'};battleEvent(`${source.name} restores ${actual} HP to ${target.name}.`);}
function hit(source,target){
 source.event={beat:battle.beat,kind:'attack',text:source.role==='Archer'?'➶':'⚔'};
 if(Math.random()<(target.evade||0)){target.event={beat:battle.beat,kind:'damage',text:'Dodge'};battleEvent(`${target.name} dodges ${source.name}.`);return;}
 const critical=Math.random()<(source.crit||0),damage=Math.max(1,Math.round((source.attack*(.9+Math.random()*.2)-target.defense*.55)*(critical?1.7:1)));
 const actual=Math.min(target.hp,damage);target.hp=Math.max(0,target.hp-damage);target.event={beat:battle.beat,kind:'damage',text:(critical?'Crit ':'−')+actual};battleEvent(`${source.name} hits ${target.name} for ${actual}${critical?' (critical)':''}.`);
 if(source.leech&&source.hp>0){const healing=Math.min(source.maxHp-source.hp,Math.ceil(actual*source.leech));source.hp+=healing;if(healing)battleEvent(`${source.name} steals ${healing} HP.`);}
 if(target.hp<=0){battleEvent(`${target.name} falls.`);if(target.index!==undefined){s.recruits[target.index].dead=true;log(s.recruits[target.index].cls+' fell in battle.');}}
}
function rewardWave(){
 const m=battle.d+1;battle.loot.gold+=m*(4+Math.floor(Math.random()*6));for(const k of ['wood','stone','food'])battle.loot[k]+=m*2;
 for(const[k,prob]of Object.entries({iron:.6,rivets:.4,leather:.35,essence:.2}))if(Math.random()<prob)battle.loot[k]+=m;
 if(Math.random()<.13)battle.loot.blueprints++;battleEvent('Wave cleared. Rewards added to unsecured spoils.');
 if(battle.wave===15){finish(true);return;}
 if(battle.wave%5===0){battle.checkpoint=true;battle.phase='checkpoint';}
 else{battle.phase='between';battle.nextAt=battle.beat+2;}
}
function updateBattle(){if(!estimating){save();render();}}
function continueBattle(){battle.checkpoint=false;battle.wave++;for(const u of battle.allies)if(u.hp>0)u.hp=Math.min(u.maxHp,u.hp+Math.round(u.maxHp*.2));spawnWave();}
function tickBattle(){
 if(!battle||battle.checkpoint||battle.result||(!estimating&&document.hidden))return;ensureBattle();battle.beat++;
 if(battle.phase==='between'){if(battle.beat>=battle.nextAt){battle.wave++;spawnWave();}updateBattle();return;}
 for(const unit of battle.allies.filter(u=>u.hp>0)){
  if(unit.role==='Healer'&&battle.beat%2===0){const injured=battle.allies.filter(u=>u.hp>0&&u.hp<u.maxHp).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];if(injured){healUnit(unit,injured,7+s.recruits[unit.index].level*2);continue;}}
  const target=battle.enemies.find(u=>u.hp>0);if(target)hit(unit,target);
 }
 if(battle.enemies.every(u=>u.hp<=0)){rewardWave();if(battle){updateBattle();}return;}
 for(const unit of battle.enemies.filter(u=>u.hp>0)){
  const alive=battle.allies.filter(u=>u.hp>0);const target=unit.role==='Archer'?alive[alive.length-1]:alive.find(u=>u.role==='Warrior')||alive.find(u=>u.role==='Hero')||alive[0];if(target)hit(unit,target);
  if(battle.allies[0].hp<=0){finish(false);return;}
 }
 updateBattle();
}

if(a==='loan'&&s.heroDead&&s.debt+s.interest===0){s.debt=Math.max(0,25-s.gold)+Math.max(0,15-s.food)*2;s.gold=Math.max(0,s.gold-25);s.food=Math.max(0,s.food-15);s.heroDead=false;s.loanRuns=0;log('Emergency loan secured. The hero has been revived.')}

if(a==='repay'){const amount=Math.min(10,s.gold,s.debt+s.interest),i=Math.min(amount,s.interest);s.gold-=amount;s.interest-=i;s.debt=Math.max(0,s.debt-(amount-i));}
if(a==='enter'&&!s.heroDead){startBattle(s.choices[Number(k)]);}
if(a==='extract'&&battle?.checkpoint)return finish(true);if(a==='continue'&&battle?.checkpoint)continueBattle();
if(!ok)log('Not enough resources yet. Gather, work, or return with dungeon loot.');save();render();});
async function boot(){try{if(!standalone){const r=await fetch('/api/me');if(r.ok){const v=await r.json();email=v.email;if(v.state){s=migrate(v.state);battle=s.activeBattle||null;if(battle)tab='Expeditions';}}}}catch{}render();if(!s.seen.includes(tab))journal();}
setInterval(()=>{if(!document.hidden){render();save()}},1000);setInterval(tickBattle,650);boot();
